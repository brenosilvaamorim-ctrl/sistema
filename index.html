async function acao(id, campos){
  const { error } = await sb.from('prazo').update(campos).eq('id', id);
  if (error) alert('Não foi possível: ' + error.message); else rota();
}
window.confirmar = id => acao(id, { situacao:'confirmado', confirmado_em:new Date().toISOString() });
window.cumprir  = id => acao(id, { situacao:'cumprido', cumprido_em:new Date().toISOString() });

window.ajustar  = (id, ev) => { ev.preventDefault();
  const d = ev.target.querySelector('input').value;
  if (d) acao(id, { data_fatal:d, origem:'manual', situacao:'confirmado', confirmado_em:new Date().toISOString() }); };

function linhaPrazo(p, podeConfirmar){
  const r = dias(p.data_fatal), [k,ic,tx] = sit(r), m = p.memoria_calculo || {};
  const alertas = (m.alertas||[]).map(a=>`<span class="sub" style="color:var(--ser)">▲ ${esc(a)}</span>`).join('');
  const acoes = podeConfirmar
    ? `<div class="acoes">
        <button class="btn ok" onclick="confirmar('${p.id}')">Confirmar</button>
        <form onsubmit="ajustar('${p.id}',event)"><input type="date" value="${p.data_fatal}"><button class="btn">Ajustar</button></form>
        <button class="btn" onclick="descartar('${p.id}')">Não é prazo</button></div>`
    : '';
  const proc = p.processo_id
    ? `<a class="lnk" href="#/processo/${p.processo_id}">${esc(p.intimacao?.numero_formatado||'ver')}</a>`
    : esc(p.intimacao?.numero_formatado||'—');
  return `<tr>
    <td style="text-align:center"><input type="checkbox" title="marcar como cumprido"
      onchange="riscar('prazo','${p.id}',this)"></td>
    <td class="dt"><b>${br(p.data_fatal)}</b><span class="sub">${r===0?'hoje':(r<0?'há '+(-r)+'d':r+' dias')}</span></td>
    <td><span class="pill ${k}"><span aria-hidden="true">${ic}</span> ${tx}</span></td>
    <td><b>${esc(p.descricao)}</b><span class="sub">${p.dias} dias úteis · ${esc(m.regime||'')}</span></td>
    <td><b>${esc(p.caso?.titulo || '—')}</b><span class="sub">${esc(p.intimacao?.tribunal_sigla||'')} · ${esc(p.intimacao?.orgao||'')}</span></td>
    <td class="proc">${proc}</td>
    <td style="max-width:330px"><span class="q">“${esc((p.trecho_origem||'').slice(0,105))}…”</span>
      <span class="sub">publicação ${br(m.publicacao)} → início ${br(m.inicioContagem)}</span>${alertas}</td>
    <td>${p.confianca ? Math.round(p.confianca*100)+'%' : '—'}</td>
    <td>${acoes}</td></tr>`;
}
function tabelaPrazos(titulo, nota, itens, podeConfirmar){

    <thead><tr><th style="width:44px">Feito</th><th>Vence</th><th>Situação</th><th>Providência</th>
    <th>Cliente / vara</th><th>Processo</th><th>Trecho lido e memória</th><th>Conf.</th><th>Ação</th></tr></thead>

window.sugerirTeses = async () => {

window.gerarMinuta = async () => {

/* aprender — fila de teses candidatas vinda das peças protocoladas */
let ULT_ABS = null, APO = '', APT = '';
window.absorverMinuta = async () => {
  const alvo = document.getElementById('apres');
  APT = (document.getElementById('aptexto')?.value || '').trim();
  APO = (document.getElementById('aporigem')?.value || '').trim();
  if (APT.length < 500) return alvo.innerHTML = '<p class="meta">Cole a peça inteira (ou pelo menos a fundamentação) para eu conseguir extrair as teses.</p>';
  alvo.innerHTML = '<p class="meta">Lendo a peça e comparando com o banco — leva cerca de um minuto. Não feche a página.</p>';
  const t0 = Date.now();
  let j;
  try {
    const { data:{session} } = await sb.auth.getSession();
    const r = await fetch(SB_URL + '/functions/v1/absorver-peca', { method:'POST',
      headers:{ apikey: SB_KEY, Authorization:'Bearer '+session.access_token, 'content-type':'application/json' },
      body: JSON.stringify({ texto: APT, origem: APO || 'peça colada no painel' }) });
    j = await r.json().catch(()=>({erro:'resposta inválida do servidor (HTTP '+r.status+')'}));
  } catch (e) { j = { erro: 'a chamada falhou: ' + (e?.message || e) }; }
  j.segundos = Math.round((Date.now()-t0)/1000);
  ULT_ABS = j;
  await telaAprender();
};
window.limparAbs = () => { ULT_ABS = null; APT = ''; APO = ''; telaAprender(); };
function resumoAbs(){
  const j = ULT_ABS;
  if (!j) return '';
  if (j.erro) return `<div class="card"><h2>Não deu certo</h2><p class="meta">${esc(j.erro)} (${j.segundos}s)</p>
    ${j.trecho?`<pre class="pre">${esc(j.trecho)}</pre>`:''}
    <div class="acoes"><button class="btn ok" onclick="absorverMinuta()">Tentar de novo</button>
      <button class="btn" onclick="limparAbs()">Limpar</button></div></div>`;
  const total = (j.teses_novas||0) + (j.refinamentos||0) + (j.precedentes||0);
  return `<div class="card"><h2>Resultado da leitura</h2>
    <div class="kpis">
      <div class="kpi"><div class="n">${j.teses_novas||0}</div><div class="l">teses novas</div></div>
      <div class="kpi"><div class="n">${j.refinamentos||0}</div><div class="l">refinamentos</div></div>

    </div>
    ${total ? '<p class="meta">Nada entrou no banco ainda: está tudo na fila abaixo, esperando sua decisão.</p>'
      : '<p class="meta">A leitura funcionou, mas não encontrei nada novo nesta peça: as teses dela já estão no banco e os julgados citados já constam. Se você esperava algo novo, cole a peça inteira, não só um trecho.</p>'}
    ${j.erro_teses?`<p class="meta">Erro ao gravar teses: ${esc(j.erro_teses)}</p>`:''}
    ${j.erro_precedentes?`<p class="meta">Erro ao gravar precedentes: ${esc(j.erro_precedentes)}</p>`:''}
    <div class="acoes"><button class="btn" onclick="limparAbs()">Limpar e colar outra</button></div></div>`;
}
window.decidirCand = async (id, status) => {
  if (status === 'aprovada') {
    const c = (await sb.from('tese_candidata').select('*').eq('id', id).single()).data;
    if (!c) return;
    if (c.tipo === 'refinamento') {
      await sb.from('tese').update({ texto_base: c.texto_base }).eq('codigo', c.codigo_alvo);
    } else {
      await sb.from('tese').upsert({ escritorio_id: c.escritorio_id, codigo: c.codigo, area: c.area || 'Trabalhista',
        titulo: c.titulo, rubrica: c.rubrica, gatilho: c.gatilho, texto_base: c.texto_base,
        pedido_modelo: c.pedido_modelo, provas: c.provas, origem: c.origem, ativo: true },
        { onConflict: 'escritorio_id,codigo' });
    }
  }
  await sb.from('tese_candidata').update({ status, decidido_em: new Date().toISOString() }).eq('id', id);
  telaAprender();
};

const MES_LONGO = ['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
let CAL = { ano:0, mes:0, sel:null };
window.mudaMes = d => { CAL.mes += d;
  if (CAL.mes < 0) { CAL.mes = 11; CAL.ano--; }
  if (CAL.mes > 11) { CAL.mes = 0; CAL.ano++; }
  pintaCalendario(); };
function rotuloDia(iso){
  const d = dias(iso);
  if (d === 0) return 'hoje';
  if (d === 1) return 'amanhã';
  if (d === -1) return 'ontem';
  return d < 0 ? 'há ' + (-d) + ' dias' : 'em ' + d + ' dias';
}
function itensPorDia(){
  const m = new Map();
  for (const it of AGE) {
    const k = String(it.data).slice(0,10);
    if (!m.has(k)) m.set(k, []);
    m.get(k).push(it);
  }
  for (const v of m.values()) v.sort((a,b)=>String(a.hora||'99').localeCompare(String(b.hora||'99')));
  return m;
}
window.verDia = iso => { CAL.sel = iso; pintaCalendario(); };
function detalheDia(){
  const iso = CAL.sel;
  if (!iso) return `<div class="diadet"><h3>Nenhum dia selecionado</h3>
    <p class="quando">Clique num dia do calendário para ver o que há nele.</p></div>`;
  const itens = itensPorDia().get(iso) || [];
  const [a,m,d] = iso.split('-');
  const data = `${d} de ${MES_LONGO[Number(m)-1]} de ${a}`;
  return `<div class="diadet">
    <h3>${data}</h3>
    <p class="quando">${rotuloDia(iso)}${itens.length?` · ${itens.length} compromisso${itens.length>1?'s':''}`:''}</p>
    ${itens.length ? itens.map(it=>`<div class="item ${it.tipo}">
        <div class="tt">${it.hora?`<b>${it.hora}</b> · `:''}${esc(it.titulo)}</div>
        ${it.local?`<div class="mt">${esc(it.local)}</div>`:''}
        ${it.detalhe?`<div class="mt">${esc(String(it.detalhe).replace(/\n/g,' · '))}</div>`:''}
        <div class="mt"><a href="${linkGoogle(it)}" target="_blank" rel="noreferrer">enviar para o Google Agenda</a></div>
      </div>`).join('') : '<p class="quando">Dia livre.</p>'}
  </div>`;
}
function faixaProximos(){
  const f = AGE.filter(i => dias(String(i.data).slice(0,10)) >= 0)
    .sort((a,b)=>String(a.data).localeCompare(String(b.data))).slice(0,6);
  if (!f.length) return '';
  return `<div class="faixa">${f.map(it=>{
    const iso = String(it.data).slice(0,10), d = dias(iso);
    return `<div class="prox ${it.tipo}${d<=3?' urg':''}" onclick="verDia('${iso}')" style="cursor:pointer">
      <div class="qd">${esc(it.tipo)}</div>
      <div class="dd">${rotuloDia(iso)}</div>
      <div class="tx">${esc(it.titulo.replace(/^(Prazo|Audiência|Prescrição)\s*[:—-]\s*/,'').slice(0,80))}</div>
      <div class="qd" style="margin-top:6px">${br(iso)}${it.hora?' · '+it.hora:''}</div>
    </div>`;
  }).join('')}</div>`;
}
function gradeMes(){
  const { ano, mes } = CAL;
  const primeiro = new Date(Date.UTC(ano, mes, 1));
  const inicio = new Date(primeiro); inicio.setUTCDate(1 - primeiro.getUTCDay());
  const porDia = itensPorDia();
  let html = `<div class="calnav">
    <span class="mes">${MES_LONGO[mes]}</span><span class="ano">${ano}</span>
    <span class="nav"><button onclick="mudaMes(-1)">←</button>
      <button onclick="irHoje()">hoje</button>
      <button onclick="mudaMes(1)">→</button></span></div>
    <div class="calmes"><div><div class="cal">` +
    ['dom','seg','ter','qua','qui','sex','sáb'].map(d=>`<div class="cabdia">${d}</div>`).join('');
  for (let i = 0; i < 42; i++) {
    const d = new Date(inicio); d.setUTCDate(inicio.getUTCDate() + i);
    const iso = d.toISOString().slice(0,10);
    const fora = d.getUTCMonth() !== mes;
    const itens = porDia.get(iso) || [];
    const tipos = [...new Set(itens.map(x=>x.tipo))].slice(0,4);
    html += `<div class="dia${fora?' fora':''}${iso===hoje()?' hoje':''}${iso===CAL.sel?' sel':''}"
        ${fora?'':`onclick="verDia('${iso}')"`}>
      <div class="num">${d.getUTCDate()}</div>
      <div class="pontos">${tipos.map(t=>`<span class="pt ${t}"></span>`).join('')}</div>
      ${itens.length>1?`<div class="qtd">${itens.length}</div>`:''}
    </div>`;
  }
  html += `</div><div class="legenda">
      <span><i class="pt prazo"></i> prazo</span>
      <span><i class="pt audiencia"></i> audiência</span>
      <span><i class="pt prescricao"></i> prescrição</span>
      <span><i class="pt pericia"></i> perícia</span>
      <span><i class="pt reuniao"></i> reunião</span></div>
    </div>${detalheDia()}</div>`;
  return html;
}
function pintaCalendario(){
  const el = document.getElementById('cal');
  if (el) el.innerHTML = gradeMes();
}
window.irHoje = () => {
  const h = new Date();
  CAL.ano = h.getUTCFullYear(); CAL.mes = h.getUTCMonth(); CAL.sel = hoje();
  pintaCalendario();
};

let AGE = [];
const ymd = d => String(d).slice(0,10).replace(/-/g,'');
function linkGoogle(it){
  const ini = ymd(it.data);
  const fim = ymd(new Date(Date.parse(String(it.data).slice(0,10)+'T00:00:00Z') + 864e5).toISOString());
  const p = new URLSearchParams({
    action:'TEMPLATE', text: it.titulo,
    dates: it.hora ? `${ini}T${it.hora.replace(':','')}00/${ini}T${String(Number(it.hora.slice(0,2))+1).padStart(2,'0')}${it.hora.slice(3,5)}00`
                   : `${ini}/${fim}`,
    details: it.detalhe || '', location: it.local || '',
  });
  if (it.convidado) p.set('add', it.convidado);
  return 'https://calendar.google.com/calendar/render?' + p.toString();
}
function linkEmail(it){
  const corpo = [it.titulo, '', 'Quando: ' + br(it.data) + (it.hora ? ' às ' + it.hora : ''),
    it.local ? 'Onde: ' + it.local : '', it.detalhe || '', '',
    'Enviado pelo sistema de ' + ESC_NOME + '.'].filter(Boolean).join('\n');
  return 'mailto:' + encodeURIComponent(it.convidado) +
    '?subject=' + encodeURIComponent(it.titulo) + '&body=' + encodeURIComponent(corpo);
}
function ics(itens){
  const esc2 = t => String(t||'').replace(/([,;\\])/g,'\\$1').replace(/\n/g,'\\n');
  const linhas = ['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Escritorio//Agenda//PT-BR','CALSCALE:GREGORIAN'];
  for (const it of itens){
    const ini = ymd(it.data);
    const fim = ymd(new Date(Date.parse(String(it.data).slice(0,10)+'T00:00:00Z') + 864e5).toISOString());
    linhas.push('BEGIN:VEVENT', 'UID:'+it.id+'@escritorio',
      'DTSTAMP:'+ new Date().toISOString().replace(/[-:]/g,'').slice(0,15)+'Z',
      it.hora ? `DTSTART;TZID=America/Sao_Paulo:${ini}T${it.hora.replace(':','')}00`
              : `DTSTART;VALUE=DATE:${ini}`,
      it.hora ? `DTEND;TZID=America/Sao_Paulo:${ini}T${String(Number(it.hora.slice(0,2))+1).padStart(2,'0')}${it.hora.slice(3,5)}00`
              : `DTEND;VALUE=DATE:${fim}`,
      'SUMMARY:'+esc2(it.titulo), 'DESCRIPTION:'+esc2(it.detalhe),
      it.local ? 'LOCATION:'+esc2(it.local) : 'X-EMPTY:1',
      it.convidado ? `ATTENDEE;ROLE=REQ-PARTICIPANT;PARTSTAT=NEEDS-ACTION;RSVP=TRUE:mailto:${it.convidado}` : 'X-EMPTY2:1',
      'BEGIN:VALARM','TRIGGER:-P2D','ACTION:DISPLAY','DESCRIPTION:'+esc2(it.titulo),'END:VALARM',
      'END:VEVENT');
  }
  linhas.push('END:VCALENDAR');
  return linhas.join('\r\n');
}

      <button class="btn ok" type="submit">Registrar</button>

let CASO = null, CASOPROC = [], CASOLINHA = [], CASOFILTRO = new Set(), CASOMOV = {};
const soDig = t => String(t||'').replace(/\D/g,'');
function cnjFormata(n){
  const d = soDig(n);
  if (d.length !== 20) return n || '';
  return `${d.slice(0,7)}-${d.slice(7,9)}.${d.slice(9,13)}.${d.slice(13,14)}.${d.slice(14,16)}.${d.slice(16)}`;
}

  audiencia:  ['Audiência', 'crit'],
  pericia:    ['Perícia', 'warn'],
  reuniao:    ['Reunião', 'cin'],
  tarefa:     ['Tarefa', 'cin'],
  outro:      ['Compromisso', 'cin'],
  andamento:  ['Andamento', 'cin'],
  intimacao:  ['Intimação', 'warn'],
  contato:    ['Contato', 'good'],
  peca:       ['Peça', 'good'],
  documento:  ['Documento', 'cin'],
  assinatura: ['Assinatura', 'good'],
  delegacao:  ['Parceria', 'serie'],
};

window.addProcesso = async (ev) => {
  ev.preventDefault();
  const f = ev.target, v = n => (f.elements[n]?.value || '').trim() || null;
  const st = document.getElementById('pr-st');
  const dig = soDig(v('numero'));
  if (dig.length !== 20) { st.style.color='var(--crit)';
    return st.textContent = 'o número do CNJ tem 20 dígitos; conte de novo'; }
  st.style.color = 'var(--i3)'; st.textContent = 'salvando…';
  const { error } = await sb.from('processo').insert({
    escritorio_id: CASO.escritorio_id, caso_id: CASO.id,
    numero_cnj: dig, numero_formatado: cnjFormata(dig),
    tribunal_sigla: v('tribunal'), orgao: v('orgao'), classe: v('classe'),
    grau: v('grau'), data_ajuizamento: v('ajuizamento'), monitorar: true,
  });
  if (error) { st.style.color='var(--crit)';
    return st.textContent = /duplicate|unique/i.test(error.message)
      ? 'esse número já está cadastrado em outro caso' : 'erro: ' + error.message; }
  telaCaso(CASO.id);
};
window.tirarProcesso = async (id) => {
  await sb.from('processo').update({ caso_id: null, monitorar: false }).eq('id', id);
  telaCaso(CASO.id);
};
window.addAtividade = async (ev) => {
  ev.preventDefault();
  const f = ev.target, v = n => (f.elements[n]?.value || '').trim() || null;
  const st = document.getElementById('at-st');
  st.style.color = 'var(--i3)'; st.textContent = 'salvando…';
  const tipo = v('tipo'), data = v('data'), hora = v('hora') || '09:00';
  let error;
  if (tipo === 'prazo') {
    ({ error } = await sb.from('prazo').insert({
      escritorio_id: CASO.escritorio_id, caso_id: CASO.id,
      processo_id: CASOPROC[0]?.id ?? null,
      descricao: v('titulo'), providencia: v('obs'), data_fatal: data,
      origem: 'manual', situacao: 'confirmado', urgencia: v('urgencia'), fatal: true,
      confirmado_em: new Date().toISOString() }));
  } else if (tipo === 'contato') {
    ({ error } = await sb.from('interacao').insert({
      escritorio_id: CASO.escritorio_id, caso_id: CASO.id,
      tipo: v('canal') || 'anotação', descricao: v('titulo') + (v('obs') ? ' — ' + v('obs') : ''),
      data: data + 'T' + hora + ':00+00:00' }));
  } else {
    ({ error } = await sb.from('evento').insert({
      escritorio_id: CASO.escritorio_id, caso_id: CASO.id, cliente_id: CASO.cliente_id,
      tipo, titulo: v('titulo'), descricao: v('obs'),
      inicio: data + 'T' + hora + ':00+00:00', local: v('local'), urgencia: v('urgencia') }));
  }
  if (error) { st.style.color='var(--crit)'; return st.textContent = 'erro: ' + error.message; }
  telaCaso(CASO.id);
};
window.filtrarLinha = (k) => {

function pintarLinha(){
  const alvo = document.getElementById('linha');
  if (!alvo) return;
  const ativos = CASOFILTRO.size ? CASOLINHA.filter(i => CASOFILTRO.has(i.tipo)) : CASOLINHA;
  document.querySelectorAll('.fchip').forEach(b => {
    b.classList.toggle('on', CASOFILTRO.has(b.dataset.k));
  });
  const cont = document.getElementById('fcont');
  if (cont) cont.textContent = ativos.length + ' de ' + CASOLINHA.length;
  alvo.innerHTML = ativos.length ? ativos.map(i => {
    const [rot, cor] = TIPOLINHA[i.tipo] || ['Registro','cin'];
    const d = i.futuro ? dias(String(i.data).slice(0,10)) : null;
    return `<div class="tl ${i.futuro ? 'fut' : ''}">
      <div class="tldata">${br(i.data)}${i.hora ? '<span class="sub">'+i.hora+'</span>' : ''}
        ${d !== null ? `<span class="sub">${d===0?'hoje':(d<0?'há '+(-d)+'d':'em '+d+'d')}</span>` : ''}</div>
      <div class="tlponto"></div>

        <span class="pill ${cor}">${rot}</span>

        ${i.situacao ? `<span class="sub">situação: ${esc(i.situacao)}</span>` : ''}
      </div></div>`;
  }).join('') : '<div class="vazio">Nada registrado com esse filtro.</div>';
}
async function telaCaso(id){

    sb.from('processo').select('*').eq('caso_id', id).order('criado_em'),
    sb.from('prazo').select('*').eq('caso_id', id).order('data_fatal'),
    sb.from('evento').select('*').eq('caso_id', id).order('inicio'),
    sb.from('interacao').select('*').eq('caso_id', id).order('data'),
    sb.from('honorario').select('*').eq('caso_id', id),
    sb.from('documento').select('*').eq('caso_id', id),
    sb.from('minuta').select('id,tipo,criado_em,status').eq('caso_id', id),
    sb.from('caso_documento').select('*').eq('caso_id', id).order('ordem'),

async function carregarXlsx(){
  if (window.XLSX) return window.XLSX;
  await new Promise((ok, err) => {
    const s = document.createElement('script');
    s.src = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
    s.onload = ok; s.onerror = () => err(new Error('não consegui carregar a biblioteca de planilha'));
    document.head.appendChild(s);
  });
  return window.XLSX;
}
function baixarPlanilha(abas, nome){
  return carregarXlsx().then(X => {
    const wb = X.utils.book_new();
    for (const [titulo, linhas] of abas) {
      const ws = X.utils.json_to_sheet(linhas.length ? linhas : [{ aviso: 'sem registros' }]);
      X.utils.book_append_sheet(wb, ws, titulo.slice(0, 31));
    }
    X.writeFile(wb, nome);
  });
}

function pintarProtocolados(){

async function dadosProducao(de, ate){
  const [cs, pz, ev, mn] = await Promise.all([
    sb.from('caso').select('id,titulo,area,polo,criado_em,encerrado_em,resultado,cliente:cliente_id(nome),responsavel:responsavel_id(nome)'),
    sb.from('prazo').select('descricao,data_fatal,situacao,cumprido_em,caso:caso_id(titulo)'),
    sb.from('evento').select('tipo,titulo,inicio,situacao,caso:caso_id(titulo)'),
    sb.from('minuta').select('tipo,criado_em,status,caso:caso_id(titulo)'),
  ]);
  const dentro = d => d && String(d).slice(0,10) >= de && String(d).slice(0,10) <= ate;
  return {
    novos: (cs.data||[]).filter(c=>dentro(c.criado_em)),
    encerrados: (cs.data||[]).filter(c=>dentro(c.encerrado_em)),
    prazos: (pz.data||[]).filter(p=>dentro(p.data_fatal)),
    eventos: (ev.data||[]).filter(e=>dentro(e.inicio)),
    pecas: (mn.data||[]).filter(m=>dentro(m.criado_em)),
    todos: cs.data||[],
  };
}

function barras(titulo, nota, pares){
  const max = Math.max(1, ...pares.map(p=>p[1]));
  const linhas = pares.map(([r,v])=>`<div class="bar"><div class="rot">${esc(r)}</div>
    <div class="trilho"><div class="barra" style="width:${Math.round(v/max*100)}%"></div></div>
    <div class="val">${v}</div></div>`).join('');
  return `<div class="card"><h2>${titulo}</h2>${nota?`<p class="nota">${nota}</p>`:''}
    <div class="bars">${linhas || '<div class="vazio">Sem dados ainda.</div>'}</div></div>`;
}
const MES = ['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
function porMes(datas, n){
  const hoje = new Date(), out = [];
  for (let i = n-1; i >= 0; i--) {
    const d = new Date(Date.UTC(hoje.getUTCFullYear(), hoje.getUTCMonth()-i, 1));
    const ch = d.toISOString().slice(0,7);
    out.push([MES[d.getUTCMonth()]+'/'+String(d.getUTCFullYear()).slice(2),
              datas.filter(x => String(x||'').slice(0,7) === ch).length]);
  }
  return out;
}
function contar(lista, chave, rotulos){
  const m = new Map();
  for (const x of lista) { const k = x[chave] || '—'; m.set(k, (m.get(k)||0)+1); }
  return [...m.entries()].map(([k,v]) => [rotulos ? (rotulos.get(k)||'não informado') : k, v])
    .sort((a,b)=>b[1]-a[1]);
}
async function telaMetricas(){

    sb.from('area_atuacao').select('id,nome'),
    sb.from('caso').select('id,area_id'),
    sb.from('processo').select('id', { count:'exact', head:true }),
  ]);
  if (pr.error) return erro(pr.error.message);
  const rotArea = new Map((ar.data||[]).map(x=>[x.id,x.nome]));
  const areaDoCaso = new Map((cs.data||[]).map(c=>[c.id, rotArea.get(c.area_id) || 'não informada']));
  const doAno = (pr.data||[]).filter(p => String(p.data_ajuizamento).slice(0,4) === String(ano));
  const anterior = (pr.data||[]).filter(p => String(p.data_ajuizamento).slice(0,4) === String(ano-1)).length;

  const meses = MES.map((m,i) => [m, doAno.filter(p =>
    Number(String(p.data_ajuizamento).slice(5,7)) === i+1).length]);
  const porArea = contar(doAno.map(p=>({a: areaDoCaso.get(p.caso_id) || 'não informada'})), 'a');
  const porTrib = contar(doAno.map(p=>({t: p.tribunal_sigla || '—'})), 't');
  const mesAtual = new Date().getUTCMonth() + 1;
  const media = mesAtual ? (doAno.length / mesAtual) : 0;

  PROCANO = (pr.data||[]).map(p => ({ ...p, _area: areaDoCaso.get(p.caso_id) || 'não informada' }));
  ANOSDISP = [...new Set(PROCANO.map(p => String(p.data_ajuizamento).slice(0,4)))]
    .filter(Boolean).sort().reverse();
  if (!ANOSDISP.includes(String(ano))) ANOSDISP.unshift(String(ano));
  ANOSEL = String(ano);
  const listaAno = [...doAno].sort((a,b) =>
    String(b.data_ajuizamento).localeCompare(String(a.data_ajuizamento)));
  ANOLISTA = listaAno.map(p => ({

  app.innerHTML = menu('metricas') + `

  <div class="card"><h2>Relatórios</h2>
    <p class="nota">Escolha o período e gere o documento. O PDF sai pela janela de impressão —

    <div style="padding:0 18px 18px;display:flex;gap:9px;flex-wrap:wrap;align-items:flex-end">
      <label style="display:flex;flex-direction:column;gap:3px">
        <span class="sub" style="margin:0">De</span>
        <input type="date" id="rel-de" value="${new Date(Date.now()-180*864e5).toISOString().slice(0,10)}"></label>
      <label style="display:flex;flex-direction:column;gap:3px">
        <span class="sub" style="margin:0">Até</span>
        <input type="date" id="rel-ate" value="${hoje()}"></label>
      <button class="btn ok" onclick="relatorioProducaoPdf()">Produção (PDF)</button>
      <button class="btn" onclick="relatorioProducaoXlsx()">Produção (Excel)</button>
      <button class="btn ok" onclick="relatorioFinanceiroPdf()">Financeiro (PDF)</button>
      <button class="btn" onclick="relatorioPlanilhaGeral()">Planilha completa (Excel)</button>
      <span class="sub" id="rel-st" style="margin:0"></span>
    </div></div>
  <p class="meta">Pela data de distribuição informada pelo CNJ. É o número que fecha o ano.</p>
  <div class="kpis">
    <div class="kpi"><div class="n">${doAno.length}</div><div class="l">ajuizados em ${ano}</div></div>
    <div class="kpi"><div class="n">${media.toFixed(1)}</div><div class="l">média por mês</div></div>
    <div class="kpi"><div class="n">${projecao}</div><div class="l">projeção para o ano</div></div>
    <div class="kpi"><div class="n">${anterior}</div><div class="l">ajuizados em ${ano-1}</div></div>
  </div>
  ${barras('Mês a mês', `Distribuições de janeiro a dezembro de ${ano}.`, meses)}
  <div class="duas">
    ${barras('Por área', 'Área do caso ligado ao processo.', porArea)}
    ${barras('Por tribunal', null, porTrib)}
  </div>
  <div class="aviso" style="border-color:var(--ln);margin-top:18px">
    Só entram processos com data de distribuição vinda do CNJ — hoje
    <b>${(pr.data||[]).length} de ${tot.count ?? '—'}</b> processos já têm essa data.
    Conforme a varredura noturna avança, o número do ano se completa sozinho.</div>

  <div class="card" style="margin-top:18px"><h2>Processos protocolados</h2>
    <p class="nota">Um a um, do mais recente para o mais antigo. Clique no número para abrir o processo

    <div style="padding:0 18px 12px;display:flex;gap:8px;flex-wrap:wrap;align-items:center">
      <span class="sub" style="margin:0">Ano</span>

    </div>
    <div id="protoc"></div>
    <div style="padding:12px 18px 18px;display:flex;gap:8px;flex-wrap:wrap;align-items:center">

  pintarProtocolados();
}

    .select('processo_id,data,texto_cliente').eq('relevante', true).order('data');

    .select('caso_id,corpo,relevancia,revisar,motivo_revisar,criado_em')

  const rascCaso = new Map((rs.data||[]).map(r => [r.caso_id, r]));
  const porCaso = new Map();
  for (const p of (pr.data||[])) {
    if (!porCaso.has(p.caso_id)) porCaso.set(p.caso_id, []);
    porCaso.get(p.caso_id).push(p);

    <div class="kpi"><div class="n">${semFone}</div><div class="l">sem telefone cadastrado</div></div>
  </div>
  <div class="aviso" style="border-color:var(--ln)">
    O texto usa só as movimentações marcadas como <b>relevantes</b> no dicionário. A numeração avança
    quando você registra o envio — por isso vale registrar sempre. <b>Leia antes de enviar</b>: quem assina é você.</div>
  <div class="card"><h2>Casos</h2>
    <div class="filtros" id="fm">
      <button class="btn" data-f="novidade" onclick="filtroMsg('novidade')">Com novidade</button>
      <button class="btn" data-f="parados"  onclick="filtroMsg('parados')">Sem contato há +30 dias</button>
      <button class="btn" data-f="semfone"  onclick="filtroMsg('semfone')">Sem telefone</button>
      <button class="btn" data-f="todos"    onclick="filtroMsg('todos')">Todos</button>
    </div>
    <table><thead><tr><th>Cliente</th><th>Telefone</th><th>Último informativo</th><th>Última movimentação</th><th></th></tr></thead>
    <tbody id="cm"></tbody></table></div></main>`;

};

  Number(v).toLocaleString('pt-BR', { style:'currency', currency:'BRL' });
function valorDel(d){
  if (d.honorario_tipo === 'percentual' && d.honorario_percentual != null)
    return String(d.honorario_percentual).replace('.', ',') + '% do êxito';
  if (d.honorario_valor != null) return dinheiro(d.honorario_valor);
  return 'a combinar';
}
/* semáforo da delegação: atraso do retorno e pendência de pagamento */
function semDel(d){
  if (d.situacao === 'cancelada') return { cor:'cin', peso:0, texto:'Cancelada' };
  if (d.situacao === 'entregue') {
    if (d.pago_em) return { cor:'good', peso:0, texto:'Entregue e paga' };
    const temValor = d.honorario_valor != null || d.honorario_percentual != null;
    return temValor
      ? { cor:'warn', peso:2, texto:'Entregue — falta pagar' }
      : { cor:'good', peso:0, texto:'Entregue' };
  }
  const alvo = d.prazo_retorno || (d.data_ato ? String(d.data_ato).slice(0,10) : null);
  if (!alvo) return { cor:'cin', peso:1, texto:'Sem data de retorno' };
  const n = diasDesde(alvo);
  if (n > 0)  return { cor:'crit', peso:5, texto:'Atrasada há ' + humano(n) };
  if (n === 0) return { cor:'crit', peso:4, texto:'Vence hoje' };
  if (n >= -3) return { cor:'ser',  peso:3, texto:'Faltam ' + Math.abs(n) + ' dia(s)' };
  return { cor:'good', peso:1, texto:'Faltam ' + humano(Math.abs(n)) };
}
function textoDelegacao(d){
  const p = PARC.find(x => x.id === d.parceiro_id);
  const c = d.caso ? d.caso.titulo : '';
  const pr = d.processo ? (d.processo.numero_formatado || d.processo.numero_cnj) : '';
  const l = ['Olá' + (p ? ', ' + primeiroNome(p.nome) : '') + '! Tudo bem?', ''];
  const COMO = { audiencia:'uma audiência', diligencia:'uma diligência', peca:'a redação de uma peça',
    caso:'um caso inteiro', parceria:'uma parceria num caso' };
  l.push('Preciso passar para você ' + (COMO[d.tipo] || 'um serviço') + ':');
  l.push('');
  l.push('• O quê: ' + d.titulo);
  if (pr) l.push('• Processo: ' + pr);
  if (d.processo?.orgao) l.push('• Vara: ' + d.processo.orgao);
  if (c) l.push('• Caso: ' + c);
  if (d.data_ato) l.push('• Quando: ' + br(String(d.data_ato).slice(0,10)) +
    (String(d.data_ato).slice(11,16) !== '00:00' ? ' às ' + String(d.data_ato).slice(11,16) : ''));
  if (d.local_ato) l.push('• Onde: ' + d.local_ato);
  if (d.prazo_retorno) l.push('• Retorno até: ' + br(d.prazo_retorno));
  l.push('• Honorários: ' + valorDel(d));
  if (d.descricao) { l.push(''); l.push(d.descricao); }
  l.push('');
  l.push('Consegue assumir? Qualquer coisa me chama.');
  return l.join('\n');
}

let SOLTOS = [], CASOSLISTA = [];
const areaDoTribunal = t => {
  const s = String(t || '').toUpperCase();
  if (s.startsWith('TRT') || s === 'TST') return 'Trabalhista';
  if (s.startsWith('TRF') || s.startsWith('JF') || s === 'STJ') return 'Federal';
  if (s.startsWith('TJ')) return 'Cível';
  return null;
};
async function carregarSoltos(){
  const { data } = await sb.from('processo')
    .select('id,numero_formatado,numero_cnj,classe,orgao,tribunal_sigla')
    .is('caso_id', null).order('numero_cnj').limit(500);
  SOLTOS = data || [];
  return SOLTOS;
}
const rotuloProc = p => (p.numero_formatado || cnjFormata(p.numero_cnj))
  + ' · ' + (p.classe || 'sem classe') + ' · ' + (p.orgao || p.tribunal_sigla || '');
function pickerHtml(casoId){
  return `<div style="padding:0 18px 16px">
    <p class="nota" style="padding:0">Vincular processo que já está cadastrado e ainda não pertence a caso nenhum.</p>
    <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">
      <input id="bs-${casoId}" type="search" placeholder="número, vara ou classe"
             oninput="filtrarSoltos('${casoId}')" style="min-width:220px">
      <select id="ss-${casoId}" style="min-width:330px"></select>
      <button class="btn ok" onclick="vincularProc('${casoId}')">Vincular ao caso</button>
      <span class="sub" id="vs-${casoId}" style="margin:0"></span>
    </div></div>`;
}
window.filtrarSoltos = casoId => {
  const s = document.getElementById('ss-' + casoId); if (!s) return;
  const t = (document.getElementById('bs-' + casoId)?.value || '').toLowerCase().trim();
  const l = SOLTOS.filter(p => !t ||
    String(p.numero_formatado || p.numero_cnj || '').toLowerCase().includes(t) ||
    String(p.orgao || '').toLowerCase().includes(t) ||
    String(p.classe || '').toLowerCase().includes(t) ||
    String(p.tribunal_sigla || '').toLowerCase().includes(t));
  s.innerHTML = l.length
    ? l.slice(0, 300).map(p => `<option value="${p.id}">${esc(rotuloProc(p))}</option>`).join('')
    : '<option value="">— nenhum processo solto com esse termo —</option>';
};
window.vincularProc = async casoId => {
  const s = document.getElementById('ss-' + casoId), st = document.getElementById('vs-' + casoId);
  const pid = s?.value; if (!pid) return;
  if (st) st.textContent = 'vinculando…';
  const { error } = await sb.from('processo').update({ caso_id: casoId }).eq('id', pid);
  if (error) { if (st) st.textContent = 'erro: ' + error.message; return; }
  SOLTOS = SOLTOS.filter(p => p.id !== pid);
  if (typeof CASO !== 'undefined' && CASO && CASO.id === casoId) return telaCaso(casoId);
  if (st) st.textContent = 'vinculado ✓';
  filtrarSoltos(casoId);
};
/* usado na aba Processos: escolher o caso de um processo solto */
window.vincularCaso = async (procId, casoId, el) => {
  const st = el.parentElement.querySelector('.sub');
  if (!casoId) return;
  if (st) st.textContent = 'vinculando…';
  const { error } = await sb.from('processo').update({ caso_id: casoId }).eq('id', procId);
  if (st) st.textContent = error ? 'erro: ' + error.message : 'vinculado ✓';
  if (!error) setTimeout(() => telaProcessos(), 700);
};
window.criarCasosSoltos = async () => {
  const st = document.getElementById('cs-st');
  const eid = await escId();
  st.textContent = 'lendo os processos…'; st.style.color = 'var(--i3)';
  const { data: procs, error } = await sb.from('processo')
    .select('id,numero_formatado,numero_cnj,classe,tribunal_sigla,orgao,data_ajuizamento')
    .is('caso_id', null).limit(500);
  if (error) { st.textContent = 'erro: ' + error.message; st.style.color = 'var(--crit)'; return; }
  if (!procs.length) { st.textContent = 'nenhum processo solto — está tudo vinculado.'; return; }
  if (!confirm('Criar ' + procs.length + ' casos, um para cada processo sem caso?\n\n' +
    'O título vai ser o número e a classe, com o nome quando a intimação permitir identificar sem dúvida. ' +
    'Você renomeia depois, caso a caso.')) { st.textContent = ''; return; }

  const ids = procs.map(p => p.id);
  let intim = [];
  for (let i = 0; i < ids.length; i += 40) {
    const { data } = await sb.from('intimacao').select('processo_id,destinatarios')
      .in('processo_id', ids.slice(i, i + 40)).limit(500);
    intim = intim.concat(data || []);
  }
  const ENT = /(LTDA|S\/A|EIRELI|MUNICIPIO|ESTADO DE|SECRETARIA|FUNDACAO|INSTITUTO|COOPERATIV|PROCURADORIA|\bPGE\b|BANCO|HOSPITAL|PREFEITURA|UNIAO|\bINSS\b|CAIXA|MINISTERIO|EMPRESA|COMERCIO|INDUSTRIA|SERVICOS|ASSOCIACAO|SINDICATO|CONSELHO|AGENCIA|DEPARTAMENTO)/i;
  const MEU = /BRENO\s+DA\s+SILVA\s+AMORIM|BRENO\s+S\.?\s*AMORIM/i;
  const porProc = {};
  for (const it of intim) {
    porProc[it.processo_id] ||= new Set();
    for (const d of (it.destinatarios || [])) if (d?.nome) porProc[it.processo_id].add(d.nome);
  }
  const freq = {};
  for (const c of Object.values(porProc)) for (const n of c) freq[n] = (freq[n] || 0) + 1;
  const nomeDe = pid => {
    const c = porProc[pid]; if (!c) return null;
    const cand = [...c].filter(n => !ENT.test(n) && !MEU.test(n) && freq[n] === 1);
    return cand.length === 1 ? cand[0] : null;
  };

  let feitos = 0, falhas = 0, comNome = 0;
  for (const p of procs) {
    const nome = nomeDe(p.id); if (nome) comNome++;
    const titulo = [nome, p.numero_formatado || cnjFormata(p.numero_cnj), p.classe].filter(Boolean).join(' — ');
    const linha = { escritorio_id: eid, titulo, area: areaDoTribunal(p.tribunal_sigla),
      observacoes: 'Caso criado automaticamente a partir do processo importado. Confira o cliente e ajuste o título.'
        + (nome ? ' O nome veio de uma intimação do DJEN e ainda precisa ser confirmado.' : '') };
    if (p.data_ajuizamento) linha.criado_em = p.data_ajuizamento + 'T12:00:00Z';
    const { data: novo, error: e1 } = await sb.from('caso').insert(linha).select('id').single();
    if (e1) { falhas++; continue; }
    const { error: e2 } = await sb.from('processo').update({ caso_id: novo.id }).eq('id', p.id);
    if (e2) { falhas++; continue; }
    feitos++;
    if (feitos % 5 === 0) st.textContent = 'criando… ' + feitos + ' de ' + procs.length;
  }
  st.textContent = feitos + ' caso(s) criados' + (comNome ? ', ' + comNome + ' com nome vindo de intimação' : '')
    + (falhas ? ' · ' + falhas + ' falha(s)' : '') + '. Atualizando a tela…';
  st.style.color = falhas ? 'var(--warn)' : 'var(--good)';
  setTimeout(() => telaProcessos(), 1800);
};

/* --------------------------------------------- tempo de trâmite e paralisação */
const DIA_MS = 864e5;
const FASES = { conhecimento:'Conhecimento', recurso:'Recurso', execucao:'Execução', suspenso:'Suspenso' };
const diasDesde = d => {
  if (!d) return null;
  const s = String(d);
  const t = Date.parse(s.length <= 10 ? s + 'T12:00:00' : s);
  return isNaN(t) ? null : Math.floor((Date.now() - t) / DIA_MS);
};
function humano(n){
  if (n == null) return '—';
  if (n < 0) return 'em ' + Math.abs(n) + ' dias';
  if (n < 60) return n + (n === 1 ? ' dia' : ' dias');
  const meses = Math.round(n / 30.44);
  const a = Math.floor(meses / 12), m = meses % 12;
  if (!a) return m + (m === 1 ? ' mês' : ' meses');
  return a + (a === 1 ? ' ano' : ' anos') + (m ? ' e ' + m + (m === 1 ? ' mês' : ' meses') : '');
}
/* data do último sinal de vida do processo */
const ultimoSinal = p => p.ultima_movimentacao || p.ultima_intimacao || p.data_ajuizamento || null;
/* Devolve { cor, peso, titulo, acao, silenciado } para um processo. */
function semaforo(p){
  const hoje = new Date().toISOString().slice(0,10);
  if (p.aguardando_ate && p.aguardando_ate >= hoje)
    return { cor:'cin', peso:0, silenciado:true, titulo:'Aguardando ' + br(p.aguardando_ate),
             acao: p.aguardando_obs || 'alerta silenciado até essa data' };
  if (p.fase === 'suspenso')
    return { cor:'cin', peso:0, silenciado:true, titulo:'Suspenso', acao:'sem cobrança enquanto estiver suspenso' };

  if (p.fase === 'execucao') {
    if (!p.marco_intercorrente)
      return { cor:'cin', peso:1, titulo:'Execução sem marco',
               acao:'marque a data da intimação do art. 11-A para o relógio começar' };
    const d = diasDesde(p.marco_intercorrente), m = Math.floor(d / 30.44);
    const limite = new Date(Date.parse(p.marco_intercorrente + 'T12:00:00') + 1096 * DIA_MS)
      .toISOString().slice(0,10);
    const venceu = limite < new Date().toISOString().slice(0,10);
    if (venceu) return { cor:'crit', peso:6, titulo:'Prazo do art. 11-A já vencido — ' + m + ' meses',
      acao:'os três anos se completaram em ' + br(limite) + '. Confira se houve intimação regular e ato interruptivo' };
    if (m >= 30) return { cor:'crit', peso:5, titulo:'Prescrição intercorrente perto — ' + m + ' meses',
      acao:'o biênio se completa em ' + br(limite) + '. Peticione diligência útil agora' };
    if (m >= 24) return { cor:'ser', peso:4, titulo:'Biênio correndo — ' + m + ' meses',
      acao:'prescreve em ' + br(limite) + '. Indique meios efetivos de persecução patrimonial' };
    if (m >= 12) return { cor:'warn', peso:3, titulo:'Suspensão vencida — ' + m + ' meses',
      acao:'acabou o ano de suspensão; a partir daqui o prazo do art. 11-A corre' };
    return { cor:'good', peso:0, titulo:'Suspensão em curso — ' + m + ' meses',
      acao:'no primeiro ano a prescrição não corre (art. 921, §1º, do CPC)' };
  }

  const base = p.ultima_movimentacao || p.ultima_intimacao;
  if (!base) {
    if (!p.ultima_sync) return { cor:'cin', peso:1, titulo:'Ainda não consultado',
      acao:'o robô do DataJud ainda não trouxe nada deste número — confira se está correto' };
    const d0 = diasDesde(p.data_ajuizamento);
    if (d0 == null) return { cor:'cin', peso:1, titulo:'Sem data de ajuizamento',
      acao:'preencha a data para o contador funcionar' };
    return { cor: d0 >= 180 ? 'ser' : 'cin', peso: d0 >= 180 ? 4 : 1,
      titulo:'Nenhuma movimentação em ' + humano(d0),
      acao:'o DataJud não devolveu andamento nenhum; confira direto no PJe' };
  }
  const d = diasDesde(base);
  if (d == null) return { cor:'cin', peso:1, titulo:'Sem andamento registrado',
    acao:'confira se o número está certo e se o robô já consultou' };
  if (d >= 180) return { cor:'crit', peso:5, titulo:'Parado há ' + humano(d),
    acao:'já cabe reclamação à Corregedoria do tribunal' };
  if (d >= 90)  return { cor:'ser', peso:4, titulo:'Parado há ' + humano(d),
    acao:'peticione pedindo impulso ou cobre a secretaria da vara' };
  if (d >= 60)  return { cor:'warn', peso:3, titulo:'Parado há ' + humano(d),
    acao:'confira o que está pendente de cumprimento' };
  return { cor:'good', peso:0, titulo:'Parado há ' + humano(d), acao:'dentro do normal' };
}

      <td><input type="date" value="${p.aguardando_ate||''}" style="font-size:12px;width:100%"
            onchange="mudarEspera('${p.id}', this.value, this)"><span class="sub"></span></td>

async function telaAndamento(){
  const [pp, px] = await Promise.all([
    sb.from('processo_painel').select('*').limit(1000),
    sb.from('processo').select('id,data_ajuizamento,fase,aguardando_ate,aguardando_obs,marco_intercorrente').limit(1000),
  ]);
  if (pp.error) return erro(pp.error.message);
  const extra = Object.fromEntries((px.data || []).map(x => [x.id, x]));
  AND = (pp.data || []).map(p => ({ ...p, ...(extra[p.id] || {}) }));
  const s = AND.map(semaforo);
  const criticos = s.filter(x => x.peso >= 4).length;
  const atencao  = s.filter(x => x.peso === 3).length;
  const risco    = AND.filter(p => p.fase === 'execucao' && semaforo(p).peso >= 3).length;
  const calados  = s.filter(x => x.silenciado).length;
  const idades = AND.map(emTramite).filter(x => x != null);
  const medio = idades.length ? Math.round(idades.reduce((a,b)=>a+b,0) / idades.length) : null;
  app.innerHTML = menu('andamento') + `
  <main><h1>Andamento dos processos</h1>
  <p class="meta">Dois relógios: há quanto tempo cada processo tramita e há quanto tempo está parado.

    <div class="kpi"><div class="n">${atencao}</div><div class="l">merecendo conferência</div></div>
    <div class="kpi ${risco?'al':''}"><div class="n">${risco}</div><div class="l">execuções com o prazo correndo</div></div>
    <div class="kpi"><div class="n">${medio!=null?humano(medio):'—'}</div><div class="l">tempo médio em trâmite</div></div>
  </div>
  <div class="card"><h2>Os mais parados primeiro</h2>
    <p class="nota">Marque a fase de cada processo — a régua da execução é bem mais severa que a do conhecimento.
      Se o processo está só aguardando audiência já marcada, preencha “aguardando até” e ele para de aparecer aqui.
      ${calados ? '<b>' + calados + '</b> processo(s) silenciado(s) no momento.' : ''}</p>
    <div id="andf" style="padding:0 18px 12px;display:flex;gap:8px;flex-wrap:wrap">
      <button class="btn" data-f="atencao" onclick="filtrarAndamento('atencao')">só o que pede ação</button>
      <button class="btn" data-f="tudo" onclick="filtrarAndamento('tudo')">todos os processos</button>
    </div>
    <div id="andlista"></div></div>
  </main>` + rodape();
  pintarAndamento();
}

window.docMover = (i,j,d) => {
  const a = DOCL[i].itens, k = j+d; if (k < 0 || k >= a.length) return;
  [a[j], a[k]] = [a[k], a[j]]; DOCL[i].sujo = true; pintarDocs();
};
window.docSalvar = async i => {
  const l = DOCL[i], s = document.getElementById('ds'+i);
  const itens = (l.itens||[]).filter(x => (x.t||'').trim());

    ? await sb.from('checklist_modelo').update({ nome:l.nome, itens, atualizado_em:new Date().toISOString() }).eq('id', l.id)
    : await sb.from('checklist_modelo').insert({ escritorio_id: await escId(), nome: l.nome, ordem: DOCL.length, itens });
  if (error) { if (s) s.textContent = 'erro: ' + error.message; return; }
  l.sujo = false; if (s) s.textContent = 'salvo';
  if (!l.id) return telaDocumentos();

async function listarBackups(){
  const alvo = document.getElementById('bklista'); if (!alvo) return;
  const { data, error } = await sb.storage.from('backup').list('', { limit: 120, sortBy: { column:'name', order:'desc' } });
  if (error) return alvo.innerHTML = '<div class="vazio">Não consegui listar: ' + esc(error.message) + '</div>';
  const fs = (data||[]).filter(f => f.name.endsWith('.json'));
  if (!fs.length) return alvo.innerHTML = '<div class="vazio">Nenhuma cópia automática ainda. A primeira sai na próxima madrugada.</div>';
  const mb = b => (Number(b||0)/1048576).toFixed(1).replace('.', ',') + ' MB';
  alvo.innerHTML = `<p class="sub" style="margin:0 0 8px">${fs.length} cópia${fs.length>1?'s':''} guardada${fs.length>1?'s':''}.</p>
    <table><thead><tr><th>Dia</th><th>Tamanho</th><th></th></tr></thead><tbody>
    ${fs.map(f=>`<tr><td class="dt">${br(f.name.replace('.json',''))}</td>
      <td class="proc">${mb(f.metadata?.size)}</td>
      <td><button class="btn" onclick="baixarCopia('${f.name}')">Baixar</button>
          <span class="sub" id="bx${f.name.replace(/\W/g,'')}"></span></td></tr>`).join('')}
    </tbody></table>`;
  aplicarRotulos(alvo);
}
window.baixarCopia = async nome => {
  const st = document.getElementById('bx' + nome.replace(/\W/g,''));
  if (st) st.textContent = 'preparando…';
  const { data, error } = await sb.storage.from('backup').createSignedUrl(nome, 120, { download: 'backup-' + nome });
  if (error) { if (st) st.textContent = 'erro: ' + error.message; return; }
  if (st) st.textContent = '';
  window.open(data.signedUrl, '_blank');
};
const TABELAS_BACKUP = ['escritorio','usuario','cliente','caso','processo','parte','prazo',
  'movimentacao','intimacao','evento','lancamento','honorario','interacao','lead','documento',
  'tese','tese_candidata','precedente','minuta','informativo_rascunho','preferencia',
  'area_atuacao','origem_captacao','categoria_financeira'];
window.baixarBackup = async () => {
  const st = document.getElementById('bk-st');
  st.style.color = 'var(--i3)';
  const pacote = { gerado_em: new Date().toISOString(), sistema: ESC_NOME, tabelas: {} };
  const falhas = [];
  for (const t of TABELAS_BACKUP) {
    st.textContent = 'lendo ' + t + '…';
    const { data, error } = await sb.from(t).select('*').limit(50000);
    if (error) { falhas.push(t + ' (' + error.message + ')'); continue; }
    pacote.tabelas[t] = data || [];
  }
  const total = Object.values(pacote.tabelas).reduce((n, a) => n + a.length, 0);
  pacote.total_registros = total;
  if (falhas.length) pacote.nao_lidas = falhas;
  const nome = 'backup-' + hoje() + '.json';
  const b = new Blob([JSON.stringify(pacote, null, 1)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(b); a.download = nome; a.click();
  URL.revokeObjectURL(a.href);
  st.style.color = 'var(--good)';
  st.textContent = total.toLocaleString('pt-BR') + ' registros salvos em ' + nome +
    (falhas.length ? ' — não consegui ler: ' + falhas.join(', ') : '');
};

/* ----------------------------------------------------------------- rotas */
async function rota(){
  const { data:{ user } } = await sb.auth.getUser();
  if(!user) return telaLogin();
  USER = user;
  if (!ESC_CARREGADO) {
    ESC_CARREGADO = true;
    const { data: e } = await sb.from('escritorio').select('*').limit(1).single();
    if (e?.nome) ESC_NOME = e.nome;
    if (e?.logo_url) ESC_LOGO = e.logo_url;
    ESC_ID = e?.id ?? null; ESC_TOKEN = e?.agenda_token ?? null;
    await carregarMenu().catch(()=>{});
    await carregarCorHoje().catch(()=>{});
    await carregarRotulos().catch(()=>{});
    vigiarRotulos();
  }
  const h = location.hash || '#/prazos';
  if(h.startsWith('#/processo/')) return telaProcesso(h.slice('#/processo/'.length));
  if(h.startsWith('#/caso/'))      return telaCaso(h.slice('#/caso/'.length));
  if(h.startsWith('#/agenda'))     return telaAgenda();
  if(h.startsWith('#/captacao'))   return telaCaptacao();
  if(h.startsWith('#/casos'))      return telaCasos();
  if(h.startsWith('#/andamento'))  return telaAndamento();
  if(h.startsWith('#/processos'))  return telaProcessos();
  if(h.startsWith('#/clientes'))   return telaClientes();
  if(h.startsWith('#/mensageria')) return telaMensageria();
  if(h.startsWith('#/metricas'))   return telaMetricas();
  if(h.startsWith('#/financeiro')) return telaFinanceiro();
  if(h.startsWith('#/parceiros'))  return telaParceiros();
  if(h.startsWith('#/mensagens'))  return telaMensageria();
  if(h.startsWith('#/minutas'))    return telaMinutas();
  if(h.startsWith('#/aprender'))   return telaAprender();
  if(h.startsWith('#/dicionario')) return telaDicionario();
  if(h.startsWith('#/documentos')) return telaDocumentos();
  if(h.startsWith('#/tutoriais'))  return telaTutoriais();
  if(h.startsWith('#/config'))     return telaConfig();
  return telaPrazos();
}
window.addEventListener('hashchange', rota);
sb.auth.onAuthStateChange(()=>rota());
rota();
</script></body></html>
