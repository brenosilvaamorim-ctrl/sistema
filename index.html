}

function aplicarRotulos(raiz){
  const pares = Object.entries(ROTULOS).filter(([k,v]) => v && v !== k);
  if (!pares.length || !raiz) return;
  const mapa = Object.fromEntries(pares);
  const it = document.createTreeWalker(raiz, NodeFilter.SHOW_TEXT);
  const nos = []; while (it.nextNode()) nos.push(it.currentNode);
  for (const n of nos){
    const t = n.nodeValue.trim();
    if (t && mapa[t]) n.nodeValue = n.nodeValue.replace(t, mapa[t]);
  }
  raiz.querySelectorAll?.('[placeholder]').forEach(e => {
    const t = e.getAttribute('placeholder')?.trim();
    if (t && mapa[t]) e.setAttribute('placeholder', mapa[t]);
  });
}
function vigiarRotulos(){
  if (!app || window.__vig) return; window.__vig = true;
  new MutationObserver(ms => {
    for (const m of ms) for (const n of m.addedNodes)
      if (n.nodeType === 1) aplicarRotulos(n);
  }).observe(app, { childList:true, subtree:true });
}

window.salvarConfirma = async (id, confirmando) => {
  const st = document.getElementById('pz-st-' + id);
  const val = k => (document.getElementById('pz-'+k+'-'+id)?.value || '').trim() || null;
  const desc = val('desc');
  if (!desc) { st.style.color='var(--crit)'; return st.textContent = 'escreva do que se trata'; }
  const data = val('data');
  if (!data) { st.style.color='var(--crit)'; return st.textContent = 'a data de vencimento é obrigatória'; }
  st.style.color = 'var(--i3)'; st.textContent = 'gravando…';

  const campos = { descricao: desc, providencia: val('prov'), data_fatal: data,
                   caso_id: val('caso'), processo_id: val('proc') };
  /* Escolheu o processo mas não o caso? O caso do processo entra junto. */
  if (!campos.caso_id && campos.processo_id) {
    const pr = PZPROCS.find(x => x.id === campos.processo_id);
    if (pr?.caso_id) campos.caso_id = pr.caso_id;
  }
  if (confirmando) { campos.situacao = 'confirmado'; campos.confirmado_em = new Date().toISOString(); }
  const p = (PZLISTA||[]).find(x=>x.id===id);
  if (p && data !== p.data_fatal) campos.origem = 'manual';

  const { error } = await sb.from('prazo').update(campos).eq('id', id);
  if (error) { st.style.color='var(--crit)'; return st.textContent = 'erro: ' + error.message; }
  if (confirmando && PZINTIM) {
    await sb.from('intimacao').update({ situacao:'confirmada', lida_em:new Date().toISOString() }).eq('id', PZINTIM);
    PZINTIM = null;
  }
  telaPrazos();
};

async function telaInicio(){
  const h = hoje();
  const d7  = new Date(Date.now() + 7*864e5).toISOString().slice(0,10);
  const d30 = new Date(Date.now() - 30*864e5).toISOString().slice(0,10);
  const mes = h.slice(0,7);
  const [pz, ev, itm, lc, cs] = await Promise.all([
    sb.from('prazo').select('id,descricao,data_fatal,situacao,caso:caso_id(id,titulo)')
      .in('situacao',['sugerido','confirmado']).order('data_fatal'),
    sb.from('evento').select('id,titulo,tipo,inicio,local,link_sala,situacao,caso:caso_id(id,titulo),cliente:cliente_id(nome)')
      .not('situacao','in','("concluida","cancelada")').order('inicio'),
    sb.from('intimacao').select('id,situacao').gte('data_disponibilizacao', d30),
    sb.from('lancamento').select('tipo,valor,situacao,vencimento').gte('vencimento', mes+'-01').lte('vencimento', mes+'-31'),
    sb.from('caso').select('id,encerrado_em'),
  ]);
  if (pz.error) return erro(pz.error.message);
  const PZ = pz.data||[], EV = ev.data||[], LC = lc.data||[];
  const dia = e => String(e.inicio).slice(0,10);
  const vencidos  = PZ.filter(p => p.data_fatal <  h);
  const prHoje    = PZ.filter(p => p.data_fatal === h);
  const pr7       = PZ.filter(p => p.data_fatal >  h && p.data_fatal <= d7);
  const evHoje    = EV.filter(e => dia(e) === h);
  const ev7       = EV.filter(e => dia(e) >  h && dia(e) <= d7);
  const aud7      = EV.filter(e => e.tipo === 'audiencia' && dia(e) >= h && dia(e) <= d7);
  const conferir  = (itm.data||[]).filter(i => !['sem_providencia','confirmada','cumprida'].includes(i.situacao)).length;
  const abertos   = (cs.data||[]).filter(c => !c.encerrado_em).length;
  const entra = LC.filter(x=>x.tipo==='entrada').reduce((a,b)=>a+Number(b.valor||0),0);
  const sai   = LC.filter(x=>x.tipo==='saida').reduce((a,b)=>a+Number(b.valor||0),0);

let PROCS = [];
window.filtrarProc = () => {
  const t = document.getElementById('bp').value.toLowerCase().trim();
  const f = PROCS.filter(p => !t ||
    (p.cliente_nome||'').toLowerCase().includes(t) || (p.caso_titulo||'').toLowerCase().includes(t) ||
    (p.orgao||'').toLowerCase().includes(t) || (p.tribunal_sigla||'').toLowerCase().includes(t) ||
    (p.numero_cnj||'').includes(so(t)) || (p.area||'').toLowerCase().includes(t) );
  document.getElementById('cp').innerHTML = f.map(linhaProc).join('') || '<tr><td colspan="6" class="vazio">Nada encontrado.</td></tr>';
  document.getElementById('qtd').textContent = f.length;
};
function linhaProc(p){
  const d = p.ultima_movimentacao ? Math.round((Date.now()-Date.parse(p.ultima_movimentacao))/864e5) : null;
  const k = d===null ? 'cin' : (d>90 ? 'ser' : (d>30 ? 'warn' : 'good'));
  return `<tr>
    <td><a class="lnk" href="#/processo/${p.id}"><b>${esc(p.cliente_nome || p.caso_titulo || 'Sem cliente')}</b></a>
      <span class="sub">${(p.caso_titulo && p.caso_titulo !== p.cliente_nome) ? esc(p.caso_titulo) : (p.caso_id ? '' : 'sem caso vinculado')}</span></td>
    <td>${p.caso_id
      ? `<select onchange="mudarArea('${p.caso_id}', this.value, this)" style="min-width:160px;font-size:12px">
          <option value="">— sem área —</option>
          ${AREAS.map(a=>`<option value="${a.id}" ${(p.area||'')===a.nome?'selected':''}>${esc(a.nome)}</option>`).join('')}
        </select><span class="sub" id="ar_${p.id}"></span>`
      : `<select onchange="vincularCaso('${p.id}', this.value, this)" style="min-width:170px;font-size:12px">
          <option value="">— escolher o caso —</option>
          ${CASOSLISTA.map(k=>`<option value="${k.id}">${esc(k.titulo)}</option>`).join('')}
        </select><span class="sub"></span>`}</td>
    <td class="proc">${esc(p.numero_formatado || p.numero_cnj)}<span class="sub">${esc(p.tribunal_sigla||'')} · ${esc(p.grau||'')}</span></td>
    <td>${esc(p.orgao||'—')}<span class="sub">${esc(p.classe||'')}</span></td>
    <td class="dt">${humano(emTramite(p))}
      <span class="sub">${p.data_ajuizamento?'desde '+br(p.data_ajuizamento):'sem data de ajuizamento'}</span></td>
    <td class="dt">${p.ultima_movimentacao?br(p.ultima_movimentacao):'—'}
      <span class="sub">${d===null?'sem andamento':(d===0?'hoje':'há '+d+' dias')}</span></td>
    <td><span class="pill ${k}">${p.movimentacoes} mov.</span></td></tr>`;
}
window.mudarArea = async (casoId, areaId, el) => {
  const st = el.parentElement.querySelector('.sub');
  const nome = AREAS.find(a => a.id === areaId)?.nome ?? null;
  if (st) { st.textContent = ' salvando…'; st.style.color = 'var(--i3)'; }
  const { error } = await sb.from('caso')
    .update({ area_id: areaId || null, area: nome, atualizado_em: new Date().toISOString() })
    .eq('id', casoId);
  if (st) { st.textContent = error ? ' erro' : ' ✓'; st.style.color = error ? 'var(--crit)' : 'var(--good)'; }
  if (!error) { PROCS.filter(x => x.caso_id === casoId).forEach(x => x.area = nome); }
  if (st && !error) setTimeout(() => { st.textContent = ''; }, 2500);
};

  </div>
  ${PROCS.filter(p=>!p.caso_id).length ? `<div class="card"><h2>Processos sem caso</h2>
    <p class="nota"><b>${PROCS.filter(p=>!p.caso_id).length} processo(s)</b> não estão ligados a caso nenhum —

    <div style="padding:0 18px 18px;display:flex;gap:8px;align-items:center;flex-wrap:wrap">

      <span class="sub" id="cs-st" style="margin:0"></span>
    </div></div>` : ''}

  <div class="card"><h2>Todos os processos</h2>
    <div class="filtros"><input id="bp" type="search" placeholder="cliente, número, vara, tribunal…" oninput="filtrarProc()">
      <span class="sub" style="margin:0">mostrando <b id="qtd">${PROCS.length}</b></span></div>

    <tbody id="cp">${PROCS.map(linhaProc).join('')}</tbody></table></div></main>`;
}

/* ---------- REVISÃO DA CARTEIRA ----------
   Varredura barata, sem IA: cruza as palavras do gatilho de cada tese com o
   texto de cada caso aberto. O que sobra é sugestão para o advogado olhar —
   nunca conclusão. O que ele decide fica gravado e não volta a aparecer. */
let REVCART = [], REVFILTRO = 'pendente', REVDADOS = null;
const REVSTOP = new Set(('a o e de da do das dos em no na nos nas por para com sem sob ante apos ate '+
  'que se ao aos as os um uma uns umas seu sua seus suas este esta esse essa isso isto aquele aquela '+
  'como quando porque entre sendo desde estar forma todos todas outro outra outros outras pelos pelas '+
  'maior menor muito depois antes mesmo cabe deve pode sera sido tais qual quais onde ainda sobre '+
  'processo processos acao acoes autor autora reu ree parte partes caso casos cliente clientes '+
  'reclamante reclamada reclamado empresa trabalho trabalhista direito juridico juridica art artigo '+
  'artigos lei leis inciso paragrafo sumula tema teses tese pedido pedidos valor valores data datas'
  ).split(' '));
function revPalavras(txt){
  return new Set(semAcento(String(txt||'')).toLowerCase()
    .split(/[^a-z0-9]+/).filter(p => p.length >= 5 && !REVSTOP.has(p)));
}
async function carregarRevisao(){
  const [cs, ts, mn, rv, pc, ft] = await Promise.all([
    sb.from('caso').select('id,titulo,area,descricao,observacoes,cliente:cliente_id(nome)')
      .is('encerrado_em', null).order('titulo').limit(2000),
    sb.from('tese').select('codigo,titulo,rubrica,gatilho,area,provas').eq('ativo', true)
      .not('codigo','like','\\_%'),
    sb.from('minuta').select('caso_id,teses').limit(2000),
    sb.from('carteira_revisao').select('caso_id,tese_codigo,situacao,anotacao'),
    sb.from('processo').select('caso_id,classe,assunto').not('caso_id','is',null).limit(3000),
    sb.from('fato').select('caso_id,descricao').limit(3000),
  ]);
  /* O título do caso é processual e não diz nada dos fatos. O que carrega tema é o
     assunto do processo (classificação do CNJ) e os fatos que você já anotou. */
  const extra = new Map();
  (pc.data||[]).forEach(x => extra.set(x.caso_id, (extra.get(x.caso_id)||'') + ' ' + (x.assunto||'') + ' ' + (x.classe||'')));
  (ft.data||[]).forEach(x => extra.set(x.caso_id, (extra.get(x.caso_id)||'') + ' ' + (x.descricao||'')));
  const casos = (cs.data||[]).map(c => ({ ...c, _extra: extra.get(c.id) || '' }));
  REVDADOS = { casos, teses: ts.data||[], minutas: mn.data||[], decid: rv.data||[] };
  return REVDADOS;
}
function varrerCarteira(){
  const D = REVDADOS; if(!D) return [];
  const jaNaMinuta = new Map();          // caso_id -> Set(codigos já usados)
  D.minutas.forEach(m => {
    if(!jaNaMinuta.has(m.caso_id)) jaNaMinuta.set(m.caso_id, new Set());
    (m.teses||[]).forEach(c => jaNaMinuta.get(m.caso_id).add(c));
  });
  const decidido = new Map();
  D.decid.forEach(d => decidido.set(d.caso_id+'|'+d.tese_codigo, d));
  const kwTese = D.teses.map(t => ({ t, kw: revPalavras([t.gatilho, t.titulo, t.rubrica].join(' ')) }));
  const achados = [];
  D.casos.forEach(c => {
    const txt = revPalavras([c.titulo, c.descricao, c.observacoes, c._extra].join(' '));
    if(txt.size < 3) return;             // caso sem descrição não dá para avaliar
    const usadas = jaNaMinuta.get(c.id) || new Set();
    kwTese.forEach(({t, kw}) => {
      if(usadas.has(t.codigo)) return;
      if(t.area && c.area && semAcento(t.area).toLowerCase() !== semAcento(c.area).toLowerCase()) return;
      const bate = [...kw].filter(p => txt.has(p));
      if(bate.length < 2) return;
      const d = decidido.get(c.id+'|'+t.codigo);
      achados.push({ caso: c, tese: t, bate, n: bate.length, situacao: d?.situacao || 'pendente', anotacao: d?.anotacao||'' });
    });
  });
  achados.sort((a,b) => b.n - a.n);
  return achados;
}

window.decidirRev = async function(casoId, codigo, situacao){

window.copiarBriefing = function(){

const MES_LONGO = ['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
let CAL = { ano:0, mes:0, sel:null };
window.mudaMes = d => { CAL.mes += d;
  if (CAL.mes < 0) { CAL.mes = 11; CAL.ano--; }
  if (CAL.mes > 11) { CAL.mes = 0; CAL.ano++; }
  pintaCalendario(); };
function rotuloDia(iso){
  const d = dias(iso);
  if (d === 0) return 'hoje';
  if (d === 1) return 'amanhã';
  if (d === -1) return 'ontem';
  return d < 0 ? 'há ' + (-d) + ' dias' : 'em ' + d + ' dias';
}
function itensPorDia(){
  const m = new Map();
  for (const it of AGE) {
    const k = String(it.data).slice(0,10);
    if (!m.has(k)) m.set(k, []);
    m.get(k).push(it);
  }
  for (const v of m.values()) v.sort((a,b)=>String(a.hora||'99').localeCompare(String(b.hora||'99')));
  return m;
}
window.verDia = iso => { CAL.sel = iso; pintaCalendario(); };
function detalheDia(){
  const iso = CAL.sel;
  if (!iso) return `<div class="diadet"><h3>Nenhum dia selecionado</h3>
    <p class="quando">Clique num dia do calendário para ver o que há nele.</p></div>`;
  const itens = itensPorDia().get(iso) || [];
  const [a,m,d] = iso.split('-');
  const data = `${d} de ${MES_LONGO[Number(m)-1]} de ${a}`;
  return `<div class="diadet">
    <h3>${data}</h3>
    <p class="quando">${rotuloDia(iso)}${itens.length?` · ${itens.length} compromisso${itens.length>1?'s':''}`:''}</p>
    ${itens.length ? itens.map(it=>`<div class="item ${it.tipo}">
        <div class="tt">${it.hora?`<b>${it.hora}</b> · `:''}${
          it.caso_id ? `<a class="lnk" href="#/caso/${it.caso_id}">${esc(it.titulo)}</a>` : esc(it.titulo)}${
          it.subtipo?` <span class="sub" style="display:inline;margin:0">(${esc(it.subtipo)})</span>`:''}</div>
        ${it.local?`<div class="mt">${esc(it.local)}</div>`:''}
        ${it.detalhe?`<div class="mt">${esc(String(it.detalhe).replace(/\n/g,' · '))}</div>`:''}
        <div class="mt" style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">
          ${vinculoAgenda(it,'mini') || '<span class="sub" style="margin:0">sem caso</span>'}

const SUBAUD = ['una','inicial','instrução','encerramento de instrução','conciliação','instrução e julgamento','julgamento','prosseguimento','perícia','justificação'];
function subtipoAudiencia(it){
  if (it.tipo !== 'audiencia' || !it.ref) return '';
  return `<select onchange="marcarSubtipo('${it.ref}', this.value, this)"
    title="tipo da audiência" style="font-size:11px;padding:2px 5px;margin-top:3px;max-width:150px;${
      it.subtipo?'':'border-color:var(--warn)'}">
    <option value=""${it.subtipo?'':' selected'}>— tipo? —</option>
    ${SUBAUD.map(x=>`<option value="${x}"${x===it.subtipo?' selected':''}>${x}</option>`).join('')}
  </select>`;
}
window.marcarSubtipo = async function(ref, valor, el){
  el.disabled = true;
  const { error } = await sb.from('evento').update({ subtipo: valor || null }).eq('id', ref);
  if (error) { el.disabled = false; alert('Não deu para guardar: ' + error.message); return; }

/* Um item pode chegar solto: prazo lido de uma intimação de processo não cadastrado,
   tarefa criada às pressas. Aqui ele ganha dono — e, com dono, vira link. */
function vinculoAgenda(it, tam){
  const p = tam === 'mini' ? 'font-size:11px;padding:2px 5px;max-width:150px' : 'font-size:11.6px;padding:3px 6px;max-width:210px';
  if (it.caso_id) return `<a class="lnk" href="#/caso/${it.caso_id}" title="abrir o caso">${
    esc(it.cliente_nome || it.caso_nome || 'ver o caso')}</a>`;
  if (!it.ref) return '';
  return `<select onchange="vincularAgenda('${it.qual}','${it.ref}', this.value, this)"
    title="este item não está ligado a nenhum caso" style="${p};border-color:var(--warn)">
    <option value="">— sem caso —</option>
    ${AGCASO.map(c=>`<option value="${c.id}">${esc(c.titulo)}</option>`).join('')}
  </select>`;
}
window.vincularAgenda = async function(qual, ref, casoId, el){
  if (!casoId) return;
  el.disabled = true;
  const { data: c } = await sb.from('caso').select('id,cliente_id').eq('id', casoId).maybeSingle();
  const campos = qual === 'prazo' ? { caso_id: casoId }
                                  : { caso_id: casoId, cliente_id: c?.cliente_id || null };
  const { error } = await sb.from(qual).update(campos).eq('id', ref);
  if (error) { el.disabled = false; alert('Não deu para vincular: ' + error.message); return; }
  telaAgenda();
};
function faixaProximos(){
  const f = AGE.filter(i => dias(String(i.data).slice(0,10)) >= 0)
    .sort((a,b)=>String(a.data).localeCompare(String(b.data))).slice(0,6);
  if (!f.length) return '';
  return `<div class="faixa">${f.map(it=>{
    const iso = String(it.data).slice(0,10), d = dias(iso);
    return `<div class="prox ${it.tipo}${d<=3?' urg':''}" onclick="verDia('${iso}')" style="cursor:pointer">
      <div class="qd">${esc(it.tipo)}</div>
      <div class="dd">${rotuloDia(iso)}</div>
      <div class="tx">${esc(it.titulo.replace(/^(Prazo|Audiência|Prescrição)\s*[:—-]\s*/,'').slice(0,80))}</div>
      <div class="qd" style="margin-top:6px">${br(iso)}${it.hora?' · '+it.hora:''}</div>
    </div>`;
  }).join('')}</div>`;
}
function gradeMes(){
  const { ano, mes } = CAL;
  const primeiro = new Date(Date.UTC(ano, mes, 1));
  const inicio = new Date(primeiro); inicio.setUTCDate(1 - primeiro.getUTCDay());
  const porDia = itensPorDia();
  let html = `<div class="calnav">
    <span class="mes">${MES_LONGO[mes]}</span><span class="ano">${ano}</span>
    <span class="nav"><button onclick="mudaMes(-1)">←</button>
      <button onclick="irHoje()">hoje</button>
      <button onclick="mudaMes(1)">→</button></span></div>
    <div class="calmes"><div><div class="cal">` +
    ['dom','seg','ter','qua','qui','sex','sáb'].map(d=>`<div class="cabdia">${d}</div>`).join('');
  for (let i = 0; i < 42; i++) {
    const d = new Date(inicio); d.setUTCDate(inicio.getUTCDate() + i);
    const iso = d.toISOString().slice(0,10);
    const fora = d.getUTCMonth() !== mes;
    const itens = porDia.get(iso) || [];
    const tipos = [...new Set(itens.map(x=>x.tipo))].slice(0,4);
    html += `<div class="dia${fora?' fora':''}${iso===hoje()?' hoje':''}${iso===CAL.sel?' sel':''}"
        ${fora?'':`onclick="verDia('${iso}')"`}>
      <div class="num">${d.getUTCDate()}</div>
      <div class="pontos">${tipos.map(t=>`<span class="pt ${t}"></span>`).join('')}</div>
      ${itens.length>1?`<div class="qtd">${itens.length}</div>`:''}
    </div>`;
  }
  html += `</div><div class="legenda">
      <span><i class="pt prazo"></i> prazo</span>
      <span><i class="pt audiencia"></i> audiência</span>
      <span><i class="pt prescricao"></i> prescrição</span>
      <span><i class="pt pericia"></i> perícia</span>
      <span><i class="pt reuniao"></i> reunião</span></div>
    </div>${detalheDia()}</div>`;
  return html;
}
function pintaCalendario(){
  const el = document.getElementById('cal');
  if (el) el.innerHTML = gradeMes();
}
window.irHoje = () => {
  const h = new Date();
  CAL.ano = h.getUTCFullYear(); CAL.mes = h.getUTCMonth(); CAL.sel = hoje();
  pintaCalendario();
};

let AGE = [], AGDIV = 0;
const ymd = d => String(d).slice(0,10).replace(/-/g,'');
function linkGoogle(it){
  const ini = ymd(it.data);
  const fim = ymd(new Date(Date.parse(String(it.data).slice(0,10)+'T00:00:00Z') + 864e5).toISOString());
  const p = new URLSearchParams({
    action:'TEMPLATE', text: it.titulo,
    dates: it.hora ? `${ini}T${it.hora.replace(':','')}00/${ini}T${String(Number(it.hora.slice(0,2))+1).padStart(2,'0')}${it.hora.slice(3,5)}00`
                   : `${ini}/${fim}`,
    details: it.detalhe || '', location: it.local || '',
  });
  if (it.convidado) p.set('add', it.convidado);
  return 'https://calendar.google.com/calendar/render?' + p.toString();
}
function linkEmail(it){
  const corpo = [it.titulo, '', 'Quando: ' + br(it.data) + (it.hora ? ' às ' + it.hora : ''),
    it.local ? 'Onde: ' + it.local : '', it.detalhe || '', '',
    'Enviado pelo sistema de ' + ESC_NOME + '.'].filter(Boolean).join('\n');
  return 'mailto:' + encodeURIComponent(it.convidado) +
    '?subject=' + encodeURIComponent(it.titulo) + '&body=' + encodeURIComponent(corpo);
}
function ics(itens){
  const esc2 = t => String(t||'').replace(/([,;\\])/g,'\\$1').replace(/\n/g,'\\n');
  const linhas = ['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Escritorio//Agenda//PT-BR','CALSCALE:GREGORIAN'];
  for (const it of itens){
    const ini = ymd(it.data);
    const fim = ymd(new Date(Date.parse(String(it.data).slice(0,10)+'T00:00:00Z') + 864e5).toISOString());
    linhas.push('BEGIN:VEVENT', 'UID:'+it.id+'@escritorio',
      'DTSTAMP:'+ new Date().toISOString().replace(/[-:]/g,'').slice(0,15)+'Z',
      it.hora ? `DTSTART;TZID=America/Sao_Paulo:${ini}T${it.hora.replace(':','')}00`
              : `DTSTART;VALUE=DATE:${ini}`,
      it.hora ? `DTEND;TZID=America/Sao_Paulo:${ini}T${String(Number(it.hora.slice(0,2))+1).padStart(2,'0')}${it.hora.slice(3,5)}00`
              : `DTEND;VALUE=DATE:${fim}`,
      'SUMMARY:'+esc2(it.titulo), 'DESCRIPTION:'+esc2(it.detalhe),
      it.local ? 'LOCATION:'+esc2(it.local) : 'X-EMPTY:1',
      it.convidado ? `ATTENDEE;ROLE=REQ-PARTICIPANT;PARTSTAT=NEEDS-ACTION;RSVP=TRUE:mailto:${it.convidado}` : 'X-EMPTY2:1',
      'BEGIN:VALARM','TRIGGER:-P2D','ACTION:DISPLAY','DESCRIPTION:'+esc2(it.titulo),'END:VALARM',
      'END:VEVENT');
  }
  linhas.push('END:VCALENDAR');
  return linhas.join('\r\n');
}

  a.href = URL.createObjectURL(b); a.download = 'agenda-escritorio.ics'; a.click();
};

let TEMCONV = null;
const semColunaConvidado = e => !!e && /convidado_email/.test(e.message || '');

  const t = document.getElementById('ev_tipo')?.value;

window.salvarEvento = async (ev) => {
  ev.preventDefault();
  const f = ev.target, v = n => (f.elements[n]?.value || '').trim() || null;
  const st = document.getElementById('ev-st');
  st.style.color = 'var(--i3)'; st.textContent = 'salvando…';
  if (!ESC_ID){ const { data } = await sb.from('escritorio').select('id').limit(1).single(); ESC_ID = data?.id; }
  const tipo = v('tipo'), data = v('data'), hora = v('hora') || '09:00';
  let error;
  const semColuna = e => e && /convidado_email/.test(e.message || '');
  if (tipo === 'prazo'){
    ({ error } = await sb.from('prazo').insert({ escritorio_id: await escId(), caso_id: v('caso'),
      descricao: v('titulo'), providencia: v('obs'), data_fatal: data,
      origem: 'manual', situacao: 'confirmado', urgencia: v('urgencia'), fatal: true,
      convidado_email: v('convidado'),
      confirmado_em: new Date().toISOString() }));
  } else {
    ({ error } = await sb.from('evento').insert({ escritorio_id: await escId(), tipo,
      titulo: v('titulo'), descricao: v('obs'), inicio: data + 'T' + hora + ':00+00:00',
      local: v('local'), caso_id: v('caso'), cliente_id: v('cliente'), urgencia: v('urgencia'),
      link_sala: v('sala'), convidado_email: v('convidado') }));
  }
  if (semColuna(error)){
    const base = { escritorio_id: await escId(), tipo, titulo: v('titulo'), descricao: v('obs'),
      inicio: data + 'T' + hora + ':00+00:00', local: v('local'), caso_id: v('caso'),
      cliente_id: v('cliente'), urgencia: v('urgencia'), link_sala: v('sala') };
    ({ error } = tipo === 'prazo'
      ? await sb.from('prazo').insert({ escritorio_id: await escId(), caso_id: v('caso'),
          descricao: v('titulo'), providencia: v('obs'), data_fatal: data,
          origem:'manual', situacao:'confirmado', urgencia: v('urgencia'), fatal:true,
          confirmado_em: new Date().toISOString() })
      : await sb.from('evento').insert(base));
    if (!error){ st.style.color = 'var(--ser)';
      st.textContent = 'salvo, mas o campo de e-mail do parceiro ainda não está ligado no banco.'; }
  }
  if (error){ st.style.color = 'var(--crit)'; st.textContent = 'erro: ' + error.message; return; }
  telaAgenda();
};
window.riscar = async (qual, id, el) => {
  const eraTexto = el.tagName === 'BUTTON' ? el.textContent : null;
  el.disabled = true;
  if (eraTexto !== null) el.textContent = 'dando baixa…';
  const agora = new Date().toISOString();
  const { error } = qual === 'prazo'
    ? await sb.from('prazo').update({ situacao:'cumprido', cumprido_em: agora }).eq('id', id)
    : await sb.from('evento').update({ situacao:'concluida', concluido_em: agora }).eq('id', id);
  if (error){
    el.disabled = false;
    if (eraTexto !== null) el.textContent = eraTexto; else el.checked = false;
    return alert('Não foi possível: ' + error.message);
  }
  const bloco = el.closest('tr') || el.closest('.item');
  if (bloco){ bloco.style.opacity = '.45'; bloco.style.textDecoration = 'line-through'; }
  const diaAberto = CAL?.sel;
  setTimeout(() => {
    if (location.hash.startsWith('#/agenda')) telaAgenda().then(() => {
      /* volta para o mesmo dia que estava aberto, para a baixa não jogar você no mês */
      if (diaAberto) { CAL.sel = diaAberto; pintaCalendario(); }
    });
    else rota();
  }, 700);
};
window.concluirEvento = async (id) => {

async function telaAgenda(){
  const colPz = c => 'id,descricao,data_fatal,dias,situacao,urgencia,caso_id' + c +
    ',intimacao:intimacao_id(numero_formatado,orgao),caso:caso_id(titulo,cliente_id,cliente:cliente_id(id,nome))';
  const colEv = c => 'id,tipo,titulo,inicio,local,descricao,urgencia,situacao,link_sala,caso_id,cliente_id,subtipo' + c +
    ',cliente:cliente_id(id,nome),caso:caso_id(titulo,cliente_id,cliente:cliente_id(id,nome))';
  const extra = TEMCONV === false ? '' : ',convidado_email';
  let [pz, ev, cs, cl, ca] = await Promise.all([
    sb.from('prazo').select(colPz(extra)).in('situacao',['sugerido','confirmado']),
    sb.from('evento').select(colEv(extra)).not('situacao','in','("concluida","cancelada")'),
    sb.from('caso').select('id,titulo,prescricao_em,prescricao_obs').not('prescricao_em','is',null),
    sb.from('cliente').select('id,nome').order('nome'),
    sb.from('caso').select('id,titulo').order('titulo'),
  ]);
  if (semColunaConvidado(pz.error) || semColunaConvidado(ev.error)) {
    TEMCONV = false;
    [pz, ev] = await Promise.all([
      sb.from('prazo').select(colPz('')).in('situacao',['sugerido','confirmado']),
      sb.from('evento').select(colEv('')).not('situacao','in','("concluida","cancelada")'),
    ]);
  } else if (TEMCONV === null && !pz.error) TEMCONV = true;
  if (pz.error) return erro(pz.error.message);
  AGCLI = cl.data || []; AGCASO = ca.data || [];
  try {
    const dv = await sb.from('google_link').select('id', { count:'exact', head:true }).not('divergencia','is',null);
    AGDIV = dv.count || 0;
  } catch { AGDIV = 0; }
  AGE = [];
  for (const p of (pz.data||[])) AGE.push({
    id:'prazo-'+p.id, ref:p.id, qual:'prazo', tipo:'prazo', data:p.data_fatal, urgencia:p.urgencia,
    convidado:p.convidado_email,
    caso_id:p.caso_id||null, caso_nome:p.caso?.titulo||null,
    cliente_id:p.caso?.cliente?.id||null, cliente_nome:p.caso?.cliente?.nome||null,
    titulo:`Prazo: ${p.descricao}${p.caso?.titulo ? ' — '+p.caso.titulo : ''}`,
    detalhe:`${p.dias||''} dias úteis · situação: ${p.situacao}\n${p.intimacao?.numero_formatado||''}`,
    local:p.intimacao?.orgao||'' });
  for (const e of (ev.data||[])) AGE.push({
    id:'evento-'+e.id, ref:e.id, qual:'evento', tipo:e.tipo, data:String(e.inicio).slice(0,10), hora:String(e.inicio).slice(11,16),
    urgencia:e.urgencia, convidado:e.convidado_email,
    subtipo:e.subtipo||null,
    caso_id:e.caso_id||null, caso_nome:e.caso?.titulo||null,
    cliente_id:e.cliente?.id||e.caso?.cliente?.id||null,
    cliente_nome:e.cliente?.nome||e.caso?.cliente?.nome||null,
    titulo:`${e.tipo === 'audiencia' ? 'Audiência' : e.tipo}: ${e.titulo}` +
      (e.cliente?.nome ? ' — '+e.cliente.nome : (e.caso?.titulo ? ' — '+e.caso.titulo : '')),
    detalhe:e.descricao||'', local:e.local||'', sala:e.link_sala||'' });
  for (const c of (cs.data||[])) AGE.push({
    id:'presc-'+c.id, tipo:'prescricao', data:c.prescricao_em, caso_id:c.id, caso_nome:c.titulo,
    titulo:`Prescrição — ${c.titulo}`, detalhe:c.prescricao_obs||'Prazo prescricional anotado no cadastro.', local:'' });
  AGE.sort((a,b)=>String(a.data).localeCompare(String(b.data)));

  const futuros = AGE.filter(i => dias(String(i.data).slice(0,10)) >= 0);
  const passados = AGE.filter(i => dias(String(i.data).slice(0,10)) < 0);
  /* Uma cor por tipo, e a mesma cor na tabela, no calendário e na faixa. */

                reuniao:'serie', tarefa:'taref', outro:'cin' };

    const d = dias(String(it.data).slice(0,10));
    return `<tr>
      <td>${it.ref
        ? `<button class="btn" style="font-size:11.6px;padding:4px 9px;white-space:nowrap"
             title="${it.qual==='prazo'?'marcar este prazo como cumprido':'marcar como realizado'} — sai da agenda"

        ${it.urgencia && it.urgencia!=='normal' ? `<span class="pill ${URG[it.urgencia]?.[1]||'cin'}">${URG[it.urgencia]?.[0]||it.urgencia}</span>` : ''}</td>

    </tr>`;
  };
  app.innerHTML = menu('agenda') + `
  <main><h1>Agenda</h1>
  ${AGDIV ? `<div class="card" style="border-left:3px solid var(--crit)"><div style="padding:12px 18px">
    <b>${AGDIV} divergência${AGDIV>1?'s':''} com o Google Agenda.</b>
    <span class="sub" style="margin:4px 0 0">Alguém mudou ou apagou no Google um item que o sistema não deixa o
    Google mandar. Aqui nada mudou — as datas abaixo continuam valendo.</span>

window.salvarFicha = async (id) => {
  const v = k => document.getElementById('q_'+k+'_'+id).value.trim() || null;
  const st = document.getElementById('fs'+id);
  st.textContent = 'salvando…'; st.style.color = 'var(--i3)';
  const { error } = await sb.from('cliente').update({
    cpf_cnpj:v('cpf_cnpj'), rg:v('rg'), estado_civil:v('estado_civil'), profissao:v('profissao'),
    ctps:v('ctps'), pis:v('pis'), endereco:v('endereco'), cidade:v('cidade'),
    uf:(v('uf')||'').slice(0,2)||null, cep:v('cep'), email:v('email'),
    atualizado_em: new Date().toISOString(),
  }).eq('id', id);
  st.textContent = error ? 'erro: '+error.message : 'qualificação salva ✓';
  st.style.color = error ? 'var(--crit)' : 'var(--good)';
};
window.gerarDoc = async (id, tipo) => {
  const c = CLI.find(x => x.id === id);
  const st = document.getElementById('fs'+id);
  if (!c?.caso_id) { st.textContent = 'este cliente ainda não tem caso vinculado'; st.style.color='var(--crit)'; return; }
  st.textContent = 'gerando…'; st.style.color = 'var(--i3)';
  const { data:{ session } } = await sb.auth.getSession();
  const p = new URLSearchParams({ tipo, caso_id: c.caso_id,
    objeto: document.getElementById('obj_'+id).value.trim(),
    honorarios: document.getElementById('hon_'+id).value.trim() });
  const r = await fetch('https://wrdfyudabvvpvfcrvvzd.supabase.co/functions/v1/gerar-documento?' + p, {
    headers: { apikey: SB_KEY, Authorization: 'Bearer ' + session.access_token } });
  if (!r.ok) { st.textContent = 'erro: ' + (await r.text()).slice(0,120); st.style.color='var(--crit)'; return; }
  const b = await r.blob();
  const nome = (tipo === 'procuracao' ? 'Procuracao' : 'Procuracao-e-contrato') + ' - ' + (c.nome||'cliente') + '.docx';
  const a = document.createElement('a');
  a.href = URL.createObjectURL(b); a.download = nome; a.click();
  st.textContent = 'baixado ✓ — confira antes de imprimir'; st.style.color = 'var(--good)';
};

};

window.perderLead = async (id) => {

  if (motivo === null) return;
  const l = LEADS.find(x=>x.id===id);
  const { error } = await sb.from('lead').update({
    etapa: 'perdido',
    resumo: [(l.resumo||''), 'PERDIDO: ' + motivo].filter(Boolean).join('\n'),
    atualizado_em: new Date().toISOString(),
  }).eq('id', id);
  if (error) alert(error.message); else telaCaptacao();
};
window.fecharLead = async (id) => {
  const l = LEADS.find(x=>x.id===id);
  if (!confirm(`Transformar "${l.nome}" em cliente e abrir o caso?`)) return;
  const esc1 = await escritorioId();
  const { data: cli, error: e1 } = await sb.from('cliente')
    .insert({ escritorio_id: esc1, nome: l.nome, telefone: l.telefone, whatsapp: l.telefone, origem_id: l.origem_id })
    .select('id').single();
  if (e1) return alert('Erro ao criar cliente: ' + e1.message);
  const { data: col } = await sb.from('coluna_caso')
    .select('id').eq('nome','Iniciais/Contestações pendentes').limit(1).single();
  const { data: caso, error: e2 } = await sb.from('caso').insert({
    escritorio_id: esc1, cliente_id: cli.id, titulo: l.nome,
    area_id: l.area_id, origem_id: l.origem_id, coluna_id: col?.id ?? null,
    descricao: l.resumo, prescricao_em: l.prescricao_em,
  }).select('id').single();
  if (e2) return alert('Erro ao criar caso: ' + e2.message);
  await sb.from('lead').update({ etapa:'fechado', caso_id: caso.id, atualizado_em: new Date().toISOString() }).eq('id', id);
  /* A ficha do atendimento segue o lead: sem isso, o que foi colhido na primeira
     conversa ficaria órfão justamente quando o caso começa. */
  await sb.from('ficha').update({ caso_id: caso.id, cliente_id: cli.id }).eq('lead_id', id);
  location.hash = '#/casos';
};
const VIAB = [

  ['prova',  'Tem prova documental do essencial',         3],
  ['test',   'Tem testemunha',                            1],

  ['claro',  'O relato é coerente e sem contradição',     1],

function notaViab(v){
  return VIAB.reduce((a,[k,,peso]) => a + (v?.[k] ? peso : 0), 0);
}
function corNota(n){ return n >= 8 ? 'good' : (n >= 5 ? 'ser' : 'crit'); }
window.abrirViab = (id) => {
  const el = document.getElementById('vb'+id); if (!el) return;
  el.style.display = el.style.display === 'none' ? 'block' : 'none';
};
window.salvarViab = async (id) => {
  const l = LEADS.find(x=>x.id===id); if (!l) return;
  const v = {};
  VIAB.forEach(([k]) => { v[k] = !!document.getElementById('vb-'+k+'-'+id)?.checked; });
  const valor = document.getElementById('vb-valor-'+id)?.value;
  if (valor) v.valor = Number(valor);
  const obs = document.getElementById('vb-obs-'+id)?.value?.trim();
  if (obs) v.obs = obs;
  const n = notaViab(v);
  const st = document.getElementById('vb-st-'+id);
  if (st) { st.style.color='var(--i3)'; st.textContent = 'guardando…'; }
  const { error } = await sb.from('lead').update({ viabilidade: v, nota: n }).eq('id', id);
  if (error) { if (st) { st.style.color='var(--crit)'; st.textContent = 'erro: '+error.message; } return; }
  l.viabilidade = v; l.nota = n;
  if (st) { st.style.color='var(--good)'; st.textContent = 'nota ' + n + ' de 10'; }
};

const FICHA_PADRAO = [
  { nome:'Ficha de atendimento trabalhista', area:'Trabalhista', ordem:1, estrutura:FICHA_TRABALHISTA },
];
let FICHA = null, FICHAMOD = [], FICHASALVA = null;
/* O módulo A vale para esta ficha? Só se a linha-gatilho do bloco 0 tiver marca. */
function moduloA(est, r){
  for (const sec of est) for (const c of sec.c)
    if (c.g === 'A' && Array.isArray(r[c.k]) && r[c.k].length) return true;
  return false;
}

/* Os modelos moram no banco, mas nascem daqui: na primeira vez que a tela abre,
   ela planta os dois modelos de papel que o escritório já usava. */
async function semearModelos(){
  const e = await escId();
  const { data } = await sb.from('ficha_modelo').select('id,nome');
  const tem = new Set((data||[]).map(x=>x.nome));
  const novos = FICHA_PADRAO.filter(m => !tem.has(m.nome))
    .map(m => ({ escritorio_id:e, nome:m.nome, area:m.area, ordem:m.ordem, estrutura:m.estrutura }));
  if (novos.length) await sb.from('ficha_modelo').insert(novos);
  /* Os dois modelos antigos (acidente + geral) foram fundidos na ficha única.
     Ficam desativados, não apagados: fichas já preenchidas continuam abrindo. */
  const velhos = ['Acidente de trabalho e doença ocupacional','Trabalhista geral'];
  if ((data||[]).some(x => velhos.includes(x.nome)))
    await sb.from('ficha_modelo').update({ ativo:false }).in('nome', velhos);
  FICHAMOD = (await sb.from('ficha_modelo').select('*').eq('ativo',true).order('ordem')).data || [];
  return FICHAMOD;
}
window.abrirFicha = async function(leadId){
  const ja = (await sb.from('ficha').select('id').eq('lead_id', leadId).limit(1).maybeSingle()).data;
  if (ja) { location.hash = '#/ficha/' + ja.id; return; }
  await semearModelos();
  let m = FICHAMOD[0];
  if (FICHAMOD.length > 1) {
    const nomes = FICHAMOD.map((x,i)=>`${i+1}) ${x.nome}`).join('\n');
    m = FICHAMOD[Number(prompt('Qual ficha?\n\n' + nomes + '\n\nDigite o número:', '1'))-1];
  }
  if (!m) return alert('Nenhum modelo de ficha cadastrado.');
  const l = (await sb.from('lead').select('*').eq('id', leadId).maybeSingle()).data;
  const resp = {};
  if (l?.nome) resp.nome = l.nome;
  if (l?.telefone) resp.fone = l.telefone;
  if (l?.email) resp.email = l.email;
  const { data, error } = await sb.from('ficha').insert({
    escritorio_id: await escId(), modelo_id: m.id, lead_id: leadId,
    caso_id: l?.caso_id || null, respostas: resp,
  }).select('id').maybeSingle();
  if (error) return alert('Não deu para criar a ficha: ' + error.message);
  location.hash = '#/ficha/' + data.id;
};
const campoFicha = (c, v) => {
  const id = 'fc-' + c.k, val = v == null ? '' : v;
  const rot = `<div style="font-size:12.6px;color:var(--i2);margin-bottom:3px">${esc(c.r)}${
    c.d?`<span class="sub" style="display:block;margin:1px 0 0">${esc(c.d)}</span>`:''}</div>`;
  if (c.t === 'info')  return `<div class="sub" style="margin:0;padding:8px 11px;border-left:2px solid var(--ser);background:var(--f2);border-radius:0 5px 5px 0;font-size:12.4px;line-height:1.5">${esc(c.r)}</div>`;
  if (c.t === 'long')  return rot + `<textarea id="${id}" rows="3" style="width:100%">${esc(val)}</textarea>`;
  if (c.t === 'sn')    return rot + `<div style="display:flex;gap:14px;flex-wrap:wrap">${
    ['sim','não','não sei'].map(o=>`<label style="display:flex;gap:5px;align-items:center;font-size:13px">
      <input type="radio" name="${id}" value="${o}" ${val===o?'checked':''}> ${o}</label>`).join('')}</div>`;
  if (c.t === 'esc')   return rot + `<select id="${id}"><option value=""></option>${
    (c.op||[]).map(o=>`<option ${val===o?'selected':''}>${esc(o)}</option>`).join('')}</select>`;
  if (c.t === 'multi') { const m = Array.isArray(val)?val:[];
    return rot + `<div style="display:flex;gap:6px 16px;flex-wrap:wrap">${
    (c.op||[]).map((o,i)=>`<label style="display:flex;gap:5px;align-items:center;font-size:13px">
      <input type="checkbox" name="${id}" value="${esc(o)}" ${m.includes(o)?'checked':''}> ${esc(o)}</label>`).join('')}</div>`; }
  const tipo = c.t==='data' ? 'date' : c.t==='hora' ? 'time' : c.t==='num' ? 'number' : 'text';
  return rot + `<input id="${id}" type="${tipo}" value="${esc(val)}" style="width:100%">`;
};
function lerFicha(){
  const est = FICHA.modelo.estrutura, r = {};
  for (const sec of est) for (const c of sec.c) {
    if (c.t === 'info') continue;
    const id = 'fc-' + c.k;
    if (c.t === 'sn')   { const m = document.querySelector(`input[name="${id}"]:checked`); if (m) r[c.k] = m.value; }
    else if (c.t === 'multi') { const m = [...document.querySelectorAll(`input[name="${id}"]:checked`)].map(x=>x.value); if (m.length) r[c.k] = m; }
    else { const el = document.getElementById(id); if (el && el.value !== '') r[c.k] = el.value; }
  }
  return r;
}
window.salvarFicha = async function(silencioso){
  const st = document.getElementById('fi-st');
  const respostas = lerFicha();
  if (st && !silencioso) st.textContent = 'guardando…';
  const { error } = await sb.from('ficha').update({ respostas, atualizado_em: new Date().toISOString() }).eq('id', FICHA.id);
  if (st) { st.style.color = error ? 'var(--crit)' : 'var(--i3)';
            st.textContent = error ? error.message : 'guardado ' + new Date().toTimeString().slice(0,5); }
  FICHA.respostas = respostas;
};
async function telaFicha(id){
  const f = (await sb.from('ficha').select('*, modelo:modelo_id(*), lead:lead_id(nome,telefone), caso:caso_id(id,titulo)').eq('id', id).maybeSingle()).data;
  if (!f) return erro('Ficha não encontrada.');
  FICHA = f;
  const r = f.respostas || {}, est = f.modelo?.estrutura || [];
  const vale = c => c.t !== 'info';
  const total = est.reduce((a,s)=>a+s.c.filter(vale).length,0);
  const feitos = est.reduce((a,s)=>a+s.c.filter(c=>vale(c) && r[c.k]!=null && r[c.k]!=='').length,0);
  app.innerHTML = menu('captacao') + `
  <main><h1>Ficha de atendimento</h1>
  <p class="meta">${esc(f.modelo?.nome||'')}${f.lead?.nome?' · '+esc(f.lead.nome):''} ·
    aberta em ${br(String(f.criado_em).slice(0,10))}. O que você escreve é guardado sozinho ao sair de cada campo.</p>
  <div class="kpis">
    <div class="kpi"><div class="n">${feitos}/${total}</div><div class="l">respondido</div></div>
    <div class="kpi"><div class="n">${pct(feitos,total)}%</div><div class="l">da ficha</div></div>
    <div class="kpi"><div class="n">${f.situacao==='concluida'?'concluída':'rascunho'}</div><div class="l">situação</div></div>
    <div class="kpi"><div class="n">${f.caso?'sim':'não'}</div><div class="l">virou caso</div></div>
  </div>
  <div class="card"><div style="padding:12px 18px;display:flex;gap:8px;flex-wrap:wrap;align-items:center">
    <button class="btn ok" onclick="salvarFicha()">Guardar agora</button>
    <button class="btn" onclick="imprimirFicha()">Imprimir para assinar</button>
    <button class="btn" onclick="fichaVirarFatos()">Levar respostas para os fatos do caso</button>
    <button class="btn" onclick="fichaCobrarDocs()">Cobrar os documentos que faltam</button>
    <button class="btn" onclick="concluirFicha()">${f.situacao==='concluida'?'Reabrir':'Concluir'}</button>
    <span class="sub" id="fi-st" style="margin:0"></span>
  </div></div>
  <div id="fi-avisoA" class="card" style="border-left:3px solid var(--warn);display:none">
    <div style="padding:12px 18px" class="sub">
      O <b>módulo A</b> — acidente de trabalho e doença ocupacional — está escondido.
      Ele aparece sozinho assim que você marcar algum item da linha
      <i>&ldquo;Acidente e saúde&rdquo;</i>, no primeiro bloco.
    </div></div>
  ${est.map(sec=>`<div class="card"${sec.m?` data-mod="${sec.m}"`:''}${sec.i?' style="border-left:3px solid var(--warn)"':sec.m?' style="border-left:3px solid var(--crit)"':''}>
    <h2>${esc(sec.s)}</h2>
    ${sec.d?`<p class="sub" style="margin:-4px 18px 0">${esc(sec.d)}</p>`:''}
    <div style="padding:6px 18px 16px;display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px 16px">
      ${sec.c.map(c=>`<div${c.t==='long'||c.t==='multi'||c.t==='info'?' style="grid-column:1/-1"':''}>${campoFicha(c, r[c.k])}</div>`).join('')}
    </div></div>`).join('')}
  </main>` + rodape();
  app.querySelectorAll('input,textarea,select').forEach(el =>
    el.addEventListener('change', () => salvarFicha(true)));
  /* O módulo A só existe quando o atendimento é de acidente ou doença. Fica
     escondido até alguém marcar a linha que o dispara, e some se desmarcarem. */
  const gatilho = [];
  for (const sec of est) for (const c of sec.c) if (c.g === 'A') gatilho.push('fc-' + c.k);
  const olharA = () => {
    const liga = gatilho.some(id =>
      [...document.querySelectorAll(`input[name="${id}"]:checked`)].length > 0);
    app.querySelectorAll('[data-mod="A"]').forEach(el => el.style.display = liga ? '' : 'none');
    const av = document.getElementById('fi-avisoA'); if (av) av.style.display = liga ? 'none' : '';
  };
  gatilho.forEach(id => document.querySelectorAll(`input[name="${id}"]`)
    .forEach(el => el.addEventListener('change', olharA)));
  olharA();
}

window.concluirFicha = async function(){
  await salvarFicha(true);
  const nova = FICHA.situacao === 'concluida' ? 'rascunho' : 'concluida';
  await sb.from('ficha').update({ situacao: nova, assinada_em: nova==='concluida' ? hoje() : null }).eq('id', FICHA.id);
  telaFicha(FICHA.id);
};
/* Cada resposta longa vira um fato do caso — é isso que a minuta lê depois. */
window.fichaVirarFatos = async function(){
  await salvarFicha(true);
  if (!FICHA.caso_id) return alert('Esta ficha ainda não está ligada a um caso. Feche o lead como cliente primeiro — o caso nasce ali.');
  const est = FICHA.modelo.estrutura, r = FICHA.respostas || {};
  const jaTem = new Set(((await sb.from('fato').select('descricao').eq('caso_id', FICHA.caso_id)).data||[]).map(x=>x.descricao));
  const novos = [];
  const temA = moduloA(est, r);
  for (const sec of est) { if (sec.i) continue; if (sec.m === 'A' && !temA) continue;
    for (const c of sec.c) {
      if (c.t === 'info') continue;
      const v = r[c.k]; if (v == null || v === '' || (Array.isArray(v) && !v.length)) continue;
      if (c.t !== 'long' && String(v).length < 12) continue;      // dado curto não é fato
      const d = `${c.r} — ${Array.isArray(v) ? v.join('; ') : v}`;
      if (!jaTem.has(d)) novos.push(d);
    }
  }
  if (!novos.length) return alert('Nada novo para levar: ou a ficha está vazia, ou os fatos já estão no caso.');
  const e = await escId();
  const base = ((await sb.from('fato').select('id').eq('caso_id', FICHA.caso_id)).data||[]).length;
  const { error } = await sb.from('fato').insert(novos.map((d,i)=>({
    escritorio_id:e, caso_id:FICHA.caso_id, descricao:d, ordem:base+i, origem:'ficha de atendimento' })));
  alert(error ? 'Erro: '+error.message : `${novos.length} fato(s) levados para o caso. Abra o caso e confira antes de gerar a minuta.`);
};
/* O checklist do fim da ficha vira pendência no caso, com o que NÃO foi marcado. */
window.fichaCobrarDocs = async function(){
  await salvarFicha(true);
  if (!FICHA.caso_id) return alert('Ligue a ficha a um caso antes — o pedido de documento mora no caso.');
  const est = FICHA.modelo.estrutura, r = FICHA.respostas || {};
  let campo = null;
  for (const sec of est) for (const c of sec.c) if (c.t==='multi' && /document/i.test(c.r)) campo = c;
  if (!campo) return alert('Este modelo não tem checklist de documentos.');
  const trouxe = new Set(Array.isArray(r[campo.k]) ? r[campo.k] : []);
  const faltam = (campo.op||[]).filter(o => !trouxe.has(o));
  if (!faltam.length) return alert('O cliente trouxe tudo o que a ficha pede.');
  const e = await escId();
  const jaTem = new Set(((await sb.from('caso_documento').select('descricao').eq('caso_id', FICHA.caso_id)).data||[]).map(x=>x.descricao));
  const novos = faltam.filter(d=>!jaTem.has(d));
  if (!novos.length) return alert('Esses documentos já estão na lista do caso.');
  const base = ((await sb.from('caso_documento').select('id').eq('caso_id', FICHA.caso_id)).data||[]).length;
  const { error } = await sb.from('caso_documento').insert(novos.map((d,i)=>({
    escritorio_id:e, caso_id:FICHA.caso_id, descricao:d, ordem:base+i, obs:'pedido na ficha de atendimento' })));
  alert(error ? 'Erro: '+error.message : `${novos.length} documento(s) entraram na lista do caso.`);
};

async function telaCaptacao(){
  const [le, ar, og] = await Promise.all([
    sb.from('lead').select('*').order('criado_em', { ascending:false }),
    sb.from('area_atuacao').select('id,nome').eq('ativo',true).order('ordem'),
    sb.from('origem_captacao').select('id,nome').eq('ativo',true).order('nome'),
  ]);
  if (le.error) return erro(le.error.message);
  AREAS = ar.data||[]; ORIGENS = og.data||[];
  const rotA = new Map(AREAS.map(a=>[a.id,a.nome])), rotO = new Map(ORIGENS.map(o=>[o.id,o.nome]));
  LEADS = (le.data||[]).map(l => ({ ...l, area_nome: rotA.get(l.area_id), origem_nome: rotO.get(l.origem_id) }));

  const mes = hoje().slice(0,7);
  const doMes = LEADS.filter(l => String(l.criado_em).slice(0,7) === mes);
  const fechados = doMes.filter(l => l.etapa === 'fechado').length;
  const abertos = LEADS.filter(l => !['fechado','perdido'].includes(l.etapa));
  const atrasados = abertos.filter(l => l.proximo_contato && dias(l.proximo_contato) < 0).length;
  const conv = doMes.length ? Math.round(fechados / doMes.length * 100) : 0;
  const opt = (lista, vazio) => `<option value="">${vazio}</option>` +
    lista.map(x=>`<option value="${x.id}">${esc(x.nome)}</option>`).join('');
  const perdidos = LEADS.filter(l=>l.etapa==='perdido');

  app.innerHTML = menu('captacao') + `
  <main><h1>Captação</h1>
  <p class="meta">De quem chegou até virar caso. Quando fecha, o cliente e o caso são criados sozinhos.</p>
  <div class="kpis">
    <div class="kpi"><div class="n">${abertos.length}</div><div class="l">em andamento</div></div>
    <div class="kpi"><div class="n">${doMes.length}</div><div class="l">entraram neste mês</div></div>
    <div class="kpi"><div class="n">${conv}%</div><div class="l">fecharam, no mês</div></div>
    <div class="kpi ${atrasados?'al':''}"><div class="n">${atrasados}</div><div class="l">com retorno atrasado</div></div>
  </div>

  <div class="card"><h2>Novo contato</h2>
    <p class="nota">Registre na hora em que a pessoa chama. Sem isso, a métrica de origem não existe.</p>
    <form onsubmit="novoLead(event)" style="display:flex;gap:8px;flex-wrap:wrap;padding:0 18px 18px;align-items:center">
      <input name="nome" type="text" placeholder="nome" required style="min-width:180px">
      <input name="telefone" type="text" placeholder="telefone" style="width:150px">
      <select name="origem_id">${opt(ORIGENS,'de onde veio')}</select>
      <select name="area_id">${opt(AREAS,'área')}</select>
      <input name="resumo" type="text" placeholder="o que a pessoa relatou" style="flex:1;min-width:220px">
      <input name="proximo_contato" type="date" title="quando retornar">
      <button class="btn ok" type="submit">Registrar</button>
    </form></div>

  <div class="quadro">
    ${ETAPAS.map(([k,rot])=>{
      const meus = abertos.filter(l=>l.etapa===k);
      return `<div class="coluna">
        <div class="cabcol" style="border-top:3px solid var(--serie)">${rot}
          <span class="sub" style="display:inline;margin:0">${meus.length}</span></div>
        ${meus.map(cartaoLead).join('') || '<div class="sub" style="padding:10px 2px">vazio</div>'}
      </div>`;
    }).join('')}
  </div>

  ${perdidos.length?`<div class="card" style="margin-top:20px"><h2>Não fecharam</h2>
    <p class="nota">Vale reler de vez em quando: é aqui que aparece se o problema é preço, triagem ou demora.</p>
    <table><thead><tr><th>Nome</th><th>Origem</th><th>Área</th><th>Motivo</th><th>Quando</th></tr></thead>
    <tbody>${perdidos.slice(0,30).map(l=>`<tr>
      <td>${esc(l.nome)}</td><td>${esc(l.origem_nome||'—')}</td><td>${esc(l.area_nome||'—')}</td>
      <td class="sub" style="margin:0">${esc((l.resumo||'').split('PERDIDO: ')[1] || '—')}</td>
      <td class="dt">${br(l.atualizado_em)}</td></tr>`).join('')}</tbody></table></div>`:''}
  </main>` + rodape();
}

    sb.from('caso_tag').select('caso_id, tag:tag_id(id,nome,cor)'),
  ]);

window.novaTagCaso = async (casoId) => {
  const inp = document.getElementById('tagnova');
  const sel = document.getElementById('tagsel');
  const st  = document.getElementById('tag-st');
  const nome = (inp?.value || '').trim();
  let tagId = sel?.value || '';
  st.textContent = 'salvando…';
  if (nome) {
    const achou = TAGS.find(t => t.nome.toLowerCase() === nome.toLowerCase());
    if (achou) tagId = achou.id;
    else {
      const { data, error } = await sb.from('tag')
        .insert({ escritorio_id: await escId(), nome, cor: '#eceae4' }).select().single();
      if (error) { st.textContent = 'erro: ' + error.message; return; }
      tagId = data.id;
    }
  }
  if (!tagId) { st.textContent = 'escolha uma etiqueta ou escreva o nome de uma nova'; return; }
  const { error } = await sb.from('caso_tag').insert({ caso_id: casoId, tag_id: tagId });
  if (error && !/duplicate|unique/i.test(error.message)) { st.textContent = 'erro: ' + error.message; return; }

/* ------------------------------------------- arrastar cartão no quadro ---
   A ordem manual vive em caso.ordem. Quem nunca foi arrastado fica com ordem
   nula e vai para o fim da coluna, em ordem de entrada — nada muda de lugar
   sozinho só porque o recurso passou a existir. */
let CASOORD = {}, ARRASTA = null;
function porOrdemCaso(a, b){
  const oa = CASOORD[a.id], ob = CASOORD[b.id];
  const va = (oa === null || oa === undefined) ? Infinity : Number(oa);
  const vb = (ob === null || ob === undefined) ? Infinity : Number(ob);
  if (va !== vb) return va - vb;
  return String(a.criado_em).localeCompare(String(b.criado_em));
}
function cartaoDepoisDe(col, y){
  const outros = [...col.querySelectorAll('.cartao:not(.arrastando)')];
  return outros.find(el => { const r = el.getBoundingClientRect(); return y < r.top + r.height/2; }) || null;
}
function ligarArrastoCasos(){
  document.querySelectorAll('.quadro .cartao').forEach(el => {
    el.draggable = true;
    el.addEventListener('dragstart', e => {
      ARRASTA = el; el.classList.add('arrastando');
      e.dataTransfer.effectAllowed = 'move';
      e.dataTransfer.setData('text/plain', el.dataset.caso);
    });
    el.addEventListener('dragend', () => {
      el.classList.remove('arrastando'); ARRASTA = null;
      document.querySelectorAll('.coluna.alvo').forEach(c=>c.classList.remove('alvo'));
    });
  });
  document.querySelectorAll('.quadro .coluna').forEach(col => {
    col.addEventListener('dragover', e => {
      if (!ARRASTA) return;
      e.preventDefault(); e.dataTransfer.dropEffect = 'move';
      col.classList.add('alvo');
      const depois = cartaoDepoisDe(col, e.clientY);
      if (depois) col.insertBefore(ARRASTA, depois); else col.appendChild(ARRASTA);
    });
    col.addEventListener('dragleave', e => {
      if (!col.contains(e.relatedTarget)) col.classList.remove('alvo');
    });
    col.addEventListener('drop', async e => {
      e.preventDefault(); col.classList.remove('alvo');
      const el = ARRASTA; ARRASTA = null;
      if (el) el.classList.remove('arrastando');
      await gravarOrdemColuna(col);
    });
  });
}
/* Renumera a coluna de 10 em 10 e grava só o que realmente mudou. */
async function gravarOrdemColuna(col){
  const colId = col.dataset.col;
  const ids = [...col.querySelectorAll('.cartao')].map(el => el.dataset.caso);
  const mudancas = [];
  ids.forEach((id, i) => {
    const nova = (i + 1) * 10;
    const atual = CASOORD[id];
    const trocouColuna = (QUADRO.find(c => c.id === id)?.coluna_id || '') !== colId;
    if (Number(atual) !== nova || trocouColuna) {
      const campos = { ordem: nova };
      if (trocouColuna) campos.coluna_id = colId;
      mudancas.push({ id, campos });
    }
  });
  if (!mudancas.length) return;
  const res = await Promise.all(mudancas.map(m => sb.from('caso').update(m.campos).eq('id', m.id)));
  const falha = res.find(r => r.error);
  if (falha) { alert('Não deu para gravar a nova ordem: ' + falha.error.message); }
  telaCasos();
}
/* As setas fazem o mesmo caminho, para quem não quer arrastar (ou está no celular). */
window.subirCaso = async function(id, passo){
  const caso = QUADRO.find(c => c.id === id);
  if (!caso) return;
  const fila = QUADRO.filter(c => !c.encerrado_em && c.coluna_id === caso.coluna_id).sort(porOrdemCaso);
  const i = fila.findIndex(c => c.id === id), j = i + passo;
  if (i < 0 || j < 0 || j >= fila.length) return;
  const nova = fila.slice(); nova.splice(j, 0, nova.splice(i, 1)[0]);
  const res = await Promise.all(nova.map((c, k) => {
    const ord = (k + 1) * 10;
    return Number(CASOORD[c.id]) === ord ? null : sb.from('caso').update({ ordem: ord }).eq('id', c.id);
  }).filter(Boolean));
  const falha = res.find(r => r.error);
  if (falha) { alert('Não deu para mover: ' + falha.error.message); return; }
  telaCasos();
};

async function carregarXlsx(){
  if (window.XLSX) return window.XLSX;
  await new Promise((ok, err) => {
    const s = document.createElement('script');
    s.src = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
    s.onload = ok; s.onerror = () => err(new Error('não consegui carregar a biblioteca de planilha'));
    document.head.appendChild(s);
  });
  return window.XLSX;
}
function baixarPlanilha(abas, nome){
  return carregarXlsx().then(X => {
    const wb = X.utils.book_new();
    for (const [titulo, linhas] of abas) {
      const ws = X.utils.json_to_sheet(linhas.length ? linhas : [{ aviso: 'sem registros' }]);
      X.utils.book_append_sheet(wb, ws, titulo.slice(0, 31));
    }
    X.writeFile(wb, nome);
  });
}

/* área de um registro, caindo para um rótulo honesto quando não há caso */
const areaDe = x => x?.caso?.area || (x?.caso ? 'sem área informada' : 'sem caso vinculado');
const evtFeito  = e => e.situacao === 'concluida';
const evtDesmarcado = e => e.situacao === 'cancelada';
/* cruza qualquer lista por área, aplicando contadores nomeados */
function porArea(itens, contadores){
  const m = {};
  for (const it of itens) {
    const a = areaDe(it);
    m[a] ||= Object.fromEntries(Object.keys(contadores).map(k => [k, 0]));
    for (const [k, f] of Object.entries(contadores)) if (f(it)) m[a][k]++;
  }
  return Object.entries(m).sort((x,y)=>x[0].localeCompare(y[0]))
    .map(([area, v]) => ({ area, ...v }));
}
function somaLinhas(linhas, chaves){
  const t = { area: 'TOTAL' };
  for (const k of chaves) t[k] = linhas.reduce((s,l)=>s+(l[k]||0), 0);
  return t;
}

function barras(titulo, nota, pares){
  const max = Math.max(1, ...pares.map(p=>p[1]));
  const linhas = pares.map(([r,v])=>`<div class="bar"><div class="rot">${esc(r)}</div>
    <div class="trilho"><div class="barra" style="width:${Math.round(v/max*100)}%"></div></div>
    <div class="val">${v}</div></div>`).join('');
  return `<div class="card"><h2>${titulo}</h2>${nota?`<p class="nota">${nota}</p>`:''}
    <div class="bars">${linhas || '<div class="vazio">Sem dados ainda.</div>'}</div></div>`;
}
const MES = ['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
function porMes(datas, n){
  const hoje = new Date(), out = [];
  for (let i = n-1; i >= 0; i--) {
    const d = new Date(Date.UTC(hoje.getUTCFullYear(), hoje.getUTCMonth()-i, 1));
    const ch = d.toISOString().slice(0,7);
    out.push([MES[d.getUTCMonth()]+'/'+String(d.getUTCFullYear()).slice(2),
              datas.filter(x => String(x||'').slice(0,7) === ch).length]);
  }
  return out;
}
function contar(lista, chave, rotulos){
  const m = new Map();
  for (const x of lista) { const k = x[chave] || '—'; m.set(k, (m.get(k)||0)+1); }
  return [...m.entries()].map(([k,v]) => [rotulos ? (rotulos.get(k)||'não informado') : k, v])
    .sort((a,b)=>b[1]-a[1]);
}

   minutas e as habilidades. Desde a migração 20 existe `playbook.tese_id`
   ligando os dois — e o formulário abaixo escreve nos dois de uma vez, que é
   o que impede a duplicação de voltar a acontecer. */

      texto_base: v('texto'), origem: 'cadastrado pelo playbook',
    }).select('id').maybeSingle();
    if (r.error) { st.style.color='var(--crit)';
      return st.textContent = 'erro no banco de teses: ' + r.error.message; }
    teseId = r.data.id;
  }

  /* 2 — o texto pronto no playbook, já ligado ao verbete */
  const { error } = await sb.from('playbook').insert({
    escritorio_id: e, area, tema, tese: v('tese'), tese_id: teseId,
    quando_usar: v('quando'), texto_padrao: v('texto'), contra: v('contra'),
    fundamento: v('fundamento'), ordem: PBK.length });
  if (error) { st.style.color='var(--crit)';
    return st.textContent = 'a tese entrou no banco, mas o texto pronto falhou: ' + error.message; }
  telaPlaybook();
};

window.tirarTese = async id => {
  const t = PBK.find(x => x.id === id);
  const aviso = t?.tese_id
    ? 'Apagar o texto pronto deste verbete?\n\nO verbete continua no banco de teses — só o texto sai.'
    : 'Apagar esta tese do playbook?';
  if (!confirm(aviso)) return;
  const { error } = await sb.from('playbook').delete().eq('id', id);
  if (error) return alert('Não foi possível: ' + error.message);
  telaPlaybook();
};

window.ligarTese = async (playbookId, teseId, el) => {
  el.disabled = true;
  const { error } = await sb.from('playbook').update({ tese_id: teseId || null }).eq('id', playbookId);
  el.disabled = false;
  if (error) return alert('Não deu para ligar: ' + error.message);
  telaPlaybook();
};

/* Uma tese que ainda não tem texto pronto: leva os dados dela para o formulário. */
window.escreverTexto = (codigo) => {
  const t = PBTESES.find(x => x.codigo === codigo); if (!t) return;
  const f = document.getElementById('pb-form'); if (!f) return;
  f.elements['area'].value    = t.area || '';
  f.elements['tema'].value    = t.titulo || '';
  f.elements['codigo'].value  = t.codigo || '';
  f.elements['codigo'].dataset.tocado = '1';
  f.elements['rubrica'].value = t.rubrica || '';
  f.elements['gatilho'].value = t.gatilho || '';
  f.elements['texto'].value   = t.texto_base || '';
  f.scrollIntoView({ block:'center' });
  f.elements['tese'].focus();
};

window.copiarTese = async (id) => {
  const t = PBK.find(x=>x.id===id); if (!t) return;
  const txt = [t.tema, t.tese, t.texto_padrao, t.fundamento ? 'Fundamento: '+t.fundamento : '',
               t.contra ? 'Se a defesa alegar: '+t.contra : ''].filter(Boolean).join('\n\n');
  const st = document.getElementById('pbc-'+id);
  try { await navigator.clipboard.writeText(txt); st.textContent = 'copiado'; }
  catch(e){ st.textContent = 'não deu para copiar'; }
  setTimeout(()=>{ if (st) st.textContent=''; }, 2500);
};

function casa(regra, item, cls){
  if (regra.contem && !String(item.texto||'').toLowerCase().includes(regra.contem.toLowerCase())) return false;
  if (regra.gatilho === 'qualquer') return true;
  if (regra.gatilho === 'naocadastrado') return !item.processo_id;
  return cls.chave === regra.gatilho;
}
async function rodarRegras(itens){
  if (!REGRAS.length) {
    const { data } = await sb.from('regra').select('*').eq('ativo', true);
    REGRAS = data || [];
  }
  const ativas = REGRAS.filter(r => r.ativo);
  if (!ativas.length) return { feitas: 0, detalhe: 'nenhuma regra ativa' };
  const eid = await escId();
  let feitas = 0;
  for (const i of itens) {
    const cls = classificar(i);
    for (const r of ativas) {
      if (!casa(r, i, cls)) continue;
      const quando = new Date(Date.now() + (Number(r.dias)||0)*864e5).toISOString().slice(0,10);
      const titulo = r.parametro || r.nome;
      if (r.acao === 'tarefa' || r.acao === 'avisar') {
        const t = r.acao === 'avisar' ? 'Escrever ao cliente: ' + titulo : titulo;
        const ja = await sb.from('evento').select('id').eq('caso_id', i.caso_id || null).eq('titulo', t).limit(1);
        if (ja.data?.length) continue;
        const { error } = await sb.from('evento').insert({ escritorio_id: eid, caso_id: i.caso_id || null,
          tipo: 'tarefa', titulo: t, descricao: 'criada pela regra: ' + r.nome,
          inicio: quando + 'T09:00:00+00:00' });
        if (!error) feitas++;
      } else if (r.acao === 'prazo') {
        if (!i.caso_id) continue;
        const { error } = await sb.from('prazo').insert({ escritorio_id: eid, caso_id: i.caso_id,
          intimacao_id: i.id, descricao: titulo, data_fatal: quando, origem: 'automatico',
          situacao: 'sugerido', fatal: true, trecho_origem: 'gerado pela regra: ' + r.nome });
        if (!error) feitas++;
      } else if (r.acao === 'etiqueta') {
        if (!i.caso_id || !titulo) continue;
        let tag = TAGS.find(t => t.nome.toLowerCase() === titulo.toLowerCase());
        if (!tag) {
          const { data } = await sb.from('tag').insert({ escritorio_id: eid, nome: titulo, cor: '#eceae4' }).select().single();
          if (data) { tag = data; TAGS.push(data); }
        }
        if (tag) { const { error } = await sb.from('caso_tag').insert({ caso_id: i.caso_id, tag_id: tag.id });
          if (!error) feitas++; }
      }
      await sb.from('regra').update({ vezes: (r.vezes||0) + 1 }).eq('id', r.id);
    }
  }
  return { feitas };
}
window.aplicarRegrasTriagem = async () => {

  await registrarAcao('aplicou', 'regra', `regras aplicadas na triagem: ${feitas} item(ns)`);
};
