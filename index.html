const MANUAL_MD = `# Manual do sistema — Breno S. Amorim Advocacia

Atualizado em 19 de agosto de 2026.

Este manual explica o que cada menu faz, na ordem em que a coisa acontece no escritório: a publicação chega, vira prazo, vira tarefa, vira peça, vira dinheiro. No fim tem os limites do sistema e o que fazer quando algo der errado.

Endereço: sistema.brenosamorimadvocacia.com.br — a entrada é por link mágico enviado ao seu e-mail, não há senha para decorar.

## 1. Como o sistema pensa

Três ideias sustentam tudo:

**Cliente → caso → processo.** O cliente é a pessoa. O caso é o problema dela (pode existir antes de haver processo). O processo é o número no tribunal. Um caso pode ter vários processos; um processo pertence a um caso só.

**Nada some sozinho.** Publicação, prazo, tarefa e mensagem só saem da sua frente quando você mandar. O sistema não decide por você e não escreve para cliente sem a sua ordem.

**O robô traz, você decide.** Duas vezes por dia o sistema lê o DJEN e o DataJud, sugere prazos e classifica as publicações. Tudo o que ele conclui vem com um nível de confiança. A responsabilidade continua sendo sua — confira a data antes de aceitar.

## 2. A rotina de cinco minutos

De manhã: abra **Início**. Ele mostra o que venceu, o que vence hoje, o que vem nos próximos sete dias, quantas publicações estão esperando conferência e como está o mês no dinheiro.

Depois: **Prazos e publicações**. Confirme ou descarte os prazos sugeridos, clique em "Aplicar as regras" e trate as publicações que sobraram.

No fim do dia: marque o que foi feito. Prazo protocolado, tarefa concluída, audiência realizada. É esse clique que alimenta os relatórios — sem ele, a Métrica e a Jurimetria mostram zero.

## 3. Início

A tela de abertura. Seis números no topo, três blocos embaixo:

- **Hoje** — o que venceu, o que vence hoje e o compromisso do dia. Audiência por vídeo aparece com o botão verde "Entrar agora".
- **Os próximos sete dias** — prazos e compromissos da semana.
- **O mês no dinheiro** — a receber, a pagar e o resultado previsto.

A faixa "Começar alguma coisa" leva direto a novo atendimento, casos, agenda, prazos, mensagem, financeiro e minuta.

## 4. Prazos e publicações

É onde a maior parte do trabalho começa. A tela tem três partes, de cima para baixo:

**Aguardando confirmação.** Prazos que o robô leu da intimação. Cada linha traz o trecho lido, a memória de cálculo e o nível de confiança.

O botão **Conferir e confirmar** abre um painel embaixo da linha, com cinco campos: *do que se trata* (a descrição que vai aparecer na agenda, já preenchida com o que o robô leu), *o que precisa ser feito*, a *data de vencimento*, o *caso* e o *processo*. Só depois de preencher é que o prazo é confirmado. Escolhendo o caso, a lista de processos se reduz aos daquele caso; escolhendo o processo primeiro, o caso dele vem junto. *Confirme sempre olhando a data — a contagem é sugestão do sistema.*

O quadro no topo conta quantos prazos estão **sem caso vinculado**, e cada um deles aparece na tabela com uma etiqueta laranja. Isso importa: prazo sem caso não aparece na ficha do cliente, não entra no relatório do caso e não tem como virar peça.

**Confirmados por você.** Marque o quadradinho quando protocolar. O prazo sai do painel e some da agenda. O botão **Editar** abre o mesmo painel, para corrigir a descrição, a data, o caso ou o processo depois.

**Publicações que chegaram.** Os cartões da triagem, com o texto integral da publicação — não precisa abrir o PJe para ler. Cada cartão diz o que o robô entendeu (prazo, audiência, sem providência, processo não cadastrado) e o quanto confia nisso. Botões: ver a publicação, confirmar o prazo, cadastrar processo, escrever ao cliente, marcar como lida.

O filtro padrão é "a conferir (fora os prazos acima)", para você não tratar duas vezes a mesma coisa. Ao lado ficam os filtros por tipo e o seletor de período.

**Aplicar as regras a tudo o que está aberto** roda o motor de regras (item 17) sobre as publicações pendentes.

### O passo a passo de uma publicação

1. Leia o cartão. Ele diz o que o robô entendeu e com que confiança — **alta**, **regular** ou **baixa**. Confiança regular ou baixa quer dizer: leia o texto antes de aceitar.
2. Clique em **Ver a publicação** para abrir o texto integral. Ele vem direto do Diário, sem corte.
3. Se virou prazo, confira a **data fatal** e a **memória de cálculo** — o sistema mostra de que data contou, quantos dias e se contou em dias úteis. **Confirmar o prazo**, no cartão, leva você até a linha dele na tabela de cima e abre o painel de conferência; ao guardar, a publicação é marcada como confirmada junto. Errou? Descarte e marque à mão.
4. Se marcou audiência, cadastre na agenda e cole o **link da sala**, se for por vídeo.
5. Se o processo não estiver cadastrado, use **Cadastrar processo**: ele já vem com número, tribunal e órgão preenchidos da própria publicação.
6. Se for caso de avisar o cliente, **Escrever ao cliente** abre a mensagem daquele caso já montada.
7. Terminado, **Marcar como lida**. A publicação sai da fila e fica guardada no caso.

### O que significa cada situação

- **prazo** — o robô encontrou prazo processual e já propôs a data.
- **audiência** — encontrou designação de audiência.
- **sem providência** — mera ciência, nada a fazer.
- **processo não cadastrado** — a publicação é de processo que não está no sistema.

## 5. Agenda

Prazos, audiências, perícias, reuniões, tarefas e prescrições no mesmo calendário.

- **Marcar prazo, audiência ou tarefa** — o formulário de cima. O campo **link da sala** guarda o endereço do Zoom, Meet ou PJe e vira o botão "Entrar agora".
- **Google Agenda** — copie o endereço de assinatura e cole em *Google Agenda → Outras agendas → + → De URL*. A partir daí tudo o que você marcar aqui aparece lá sozinho. **Esse endereço é a chave da sua agenda: não repasse.**
- **Cor do dia de hoje** — em Configurações, se quiser trocar.

## 6. Mensagens

A lista de clientes com o texto de atualização já pronto, um por caso. O botão do WhatsApp abre a conversa com o texto colado; o registro entra na ficha do caso quando você clica em registrar.

Não há numeração de informativo: a mensagem abre como "Atualização do processo tal". Filtros: com novidade, parados há mais de 30 dias, sem telefone.

## 7. Casos

Duas visões, alternadas no topo:

- **Quadro** — cartões por etapa, com prazo mais próximo, tempo parado e etiquetas.
- **Lista** — tabela com cliente, área, etapa, etiquetas, próximo prazo e nº de processos. Boa para varrer tudo de uma vez.

As **etiquetas** você cria dentro do caso e viram filtro aqui no topo.

### Dentro de um caso

**Tipo do caso e etiquetas.** Escolher o tipo (verbas rescisórias, vínculo, acidente de trabalho, concurso, servidor, cível) traz de uma vez a lista de documentos, as primeiras tarefas já datadas e os campos próprios daquela ação. Nada é apagado: só se acrescenta o que falta.

**Ler um documento.** Manda o PDF ou a foto — CTPS, TRCT, contracheque, cartão de ponto, laudo, edital. O sistema lê e devolve os campos e os fatos, com o trecho e a página de cada um.

Não existe OCR separado: as páginas são vistas como imagem, então **PDF de texto, PDF digitalizado e foto de celular passam pelo mesmo caminho**. Documento torto, com sombra ou fundo cinza é lido do mesmo jeito.

- **PDF acima de 3 MB é dividido sozinho** em blocos de 12 páginas, lido bloco a bloco, e o resultado é remontado com a numeração real das páginas. Dá para mandar processo inteiro, até 60 MB.
- **Foto avulsa**: até 6 MB, o que cobre qualquer câmera de celular.
- Depois de ler, confira a **ressalva da leitura** — é ali que ele avisa o que ficou ilegível.
- **Nada entra no caso sem você marcar.** Campo que ele não conseguiu ler fica de fora, em vez de ser chutado.
- A transcrição integral fica guardada e é ela que alimenta a busca na prova, logo abaixo.

**Linha do tempo dos fatos, com a prova de cada um.** Um fato por linha, na ordem em que aconteceu, dizendo qual documento prova aquilo. Fato sem prova indicada aparece marcado em vermelho. O botão "Copiar a narrativa" entrega o texto pronto para a inicial.

**Onde isto está provado?** Escreva a afirmação que você quer levar para a peça — "trabalhava aos domingos", "recebia por fora", "foi dispensado sem justa causa" — e o sistema procura nos documentos já lidos daquele caso, devolvendo o trecho e o nome do arquivo. Cada resultado tem **"Virar fato com esta prova"**, que joga direto na linha do tempo, já com o trecho amarrado. Só encontra o que passou pelo "Ler um documento": quanto mais documento você mandar, mais ele acha.

**Processos.** Cadastre o número assim que protocolar — não precisa esperar o diário. A partir daí o robô do DataJud acompanha sozinho.

**Registrar atividade.** Prazo, audiência, perícia, reunião, tarefa ou contato, tudo amarrado ao caso.

**Documentos do cliente.** A lista do que foi pedido, com data de recebimento, e o botão que monta a cobrança pronta no WhatsApp.

**Assinatura de documentos.** Gera a procuração e o contrato, registra o envio e a assinatura, e monta a cobrança de quem não assinou. O envio é manual, pelo seu WhatsApp ou e-mail.

**Delegado a parceiro.** Quando você passa a diligência, a audiência ou a peça para outro advogado: registra o combinado, o valor e o prazo, e joga o pagamento no financeiro.

**Linha do tempo do caso.** Tudo o que aconteceu, filtrável por tipo.

## 8. Processos e Andamento

**Processos** é a lista de todos os números, com busca.

**Andamento** ordena os processos pelos mais parados e mostra um semáforo por processo: em dia, atenção, parado. Dá para mudar a fase (conhecimento, recurso, execução, suspenso, arquivado), marcar espera e silenciar o alerta de um processo que está corretamente parado. **Arquivado** é o fim de linha: o processo continua guardado e pesquisável, mas sai das contas e para de cobrar providência — tem um botão próprio para listar só os arquivados. A fase também pode ser mudada dentro do caso, na tabela de processos.

## 9. Clientes

Cadastro, ficha completa e histórico. **CPF e endereço são obrigatórios para gerar procuração** — hoje é o que mais falta na base.

**Casos sem cliente** é a tela de pareamento: casos que vieram do acervo antigo e ainda não têm dono. Dá para criar o cliente ali mesmo, marcado como anterior ao sistema, sem passar pela Captação e sem afetar a métrica do mês.

## 10. Captação

O funil de quem chega: novo contato, em análise, proposta, fechado, perdido. Quando fecha, o cliente e o caso são criados sozinhos.

**Viabilidade** — em cada cartão, o botão abre a triagem: dentro do prazo (3), prova documental (3), testemunha (1), a outra parte tem como pagar (2), relato coerente (1). Sai uma nota de 0 a 10 no cartão. Serve para decidir o que aceitar e para saber, depois, o que dava certo e o que não dava.

Registre o contato **na hora em que a pessoa chama**. Sem isso a métrica de origem não existe.

## 11. Parceiros

Quem são os parceiros e o que foi delegado a cada um: tipo de serviço, valor combinado, prazo, situação e pagamento. O acompanhamento aparece também dentro do caso.

## 12. Métricas e Jurimetria

**Métricas** é a produção do escritório: audiências, prazos e tarefas realizados por período e por área. Só conta o que você marcou como concluído.

**Jurimetria** é a leitura da carteira:

- números por **tribunal**, **vara/órgão**, **comarca**, **classe**, **assunto** e **área** — com quantos processos, quantos encerrados, taxa de êxito e duração média;
- **casos análogos**: escreva o assunto, a classe, a vara ou a comarca e ele junta os processos parecidos, com o que aconteceu em cada um;
- **banco de decisões**: decisões de fora, com tribunal, vara, comarca, relator, tema, tese, resultado e link do inteiro teor. Serve para saber como aquele juízo vem decidindo antes de ajuizar, recorrer ou fechar acordo.

### Resultado sugerido pelas movimentações

O robô do DataJud lê o que o juízo registrou e propõe o desfecho de cada caso encerrado que ainda está sem resultado.

- Sugestão com **decisão de mérito** — "Procedência em Parte", "Improcedência", "Homologação de Transação" — vem marcada e entra no botão **"Gravar de uma vez"**.
- Sugestão só de **encerramento** — "Trânsito em julgado", "Arquivamento definitivo" — vem em âmbar, com o aviso de que o mérito não aparece nas movimentações, e **fica de fora** do gravar tudo. Nesses, escolha o resultado no seletor ou pule.
- Você pode corrigir qualquer resultado depois, na ficha do caso.

Conforme o robô sincroniza os processos de madrugada, a lista cresce. Vale voltar aqui de tempos em tempos.

### Quem é o cliente nestes processos

Processos vindos do acervo antigo que ainda não têm o lado definido. Um clique em **é o autor** ou **é o réu**: o nome vira cliente (marcado como anterior ao sistema), o caso ganha o polo certo e a linha some. Há também **nenhum dos dois**, para o processo que não é seu cliente.

### Ressalvas honestas

Número pequeno é indício, não estatística. A taxa de êxito só passa a valer quando os casos encerrados tiverem resultado. E a comarca é deduzida do nome da vara — onde o órgão não traz a cidade, ela fica vazia.

## 13. Financeiro

Contas a receber e a pagar, por caso, cliente e categoria. Honorário por êxito amarrado ao caso. Projeção do mês e do ano. A baixa é manual: marque quando entrar ou sair de verdade.

## 14. Minutas, Aprender, Playbook e Dicionário

**Minutas** — a peça redigida a partir dos fatos do caso e das teses do banco. Sai como minuta, nunca protocolada: a revisão e a assinatura são suas.

**Aprender** — ensina uma peça sua ao banco. Cole a peça que você **protocolou** (não a minuta), diga de onde veio, e o sistema extrai três coisas: teses novas, refinamentos de teses que já existem e os precedentes citados. Nada entra direto — tudo vira candidato na **Fila de aprovação**, e você aprova ou descarta um por um.

**Precedentes.** Cada julgado citado nas suas peças vira uma ficha, com tribunal, número, relator, órgão, data e tema. Em cada ficha:

- **Como você citou** — o trecho da sua própria peça em que aquele julgado aparece. É isto que permite conferir sem sair do sistema: você lê o que escreveu e vê se o julgado sustenta mesmo aquilo. Tem botão para copiar o trecho.
- **Ementa, como está na peça** — quando a peça transcreve a ementa, ela é copiada inteira, literal.
- **Abrir e conferir** — abre os campos para colar a ementa, guardar o link do inteiro teor e marcar a situação da tese: **em vigor**, **superado** ou **em dúvida**.
- **Procurar no Google** e **Procurar no Jusbrasil** — já vão preenchidos com tribunal e número.
- **Marcar conferido** — enquanto não estiver conferido, o sistema trata o precedente com ressalva.

Precedente antigo, absorvido antes desta melhoria, pode aparecer sem o trecho. Basta reensinar aquela peça que ele passa a vir completo.

**Playbook** — as suas teses padrão. É o que faz a peça sair no seu jeito e não num jeito genérico: ao minutar, o sistema puxa as teses do playbook da área daquele caso, aplica só as que os fatos sustentarem e escreve com a sua redação e o seu fundamento, em vez de redigir por conta própria. Ele é proibido de inventar fundamento e de esticar a tese além do que está escrito ali.

O playbook e o banco de teses guardam a mesma tese em dois formatos: aqui mora o texto pronto para colar na peça, lá mora o verbete que alimenta as minutas e as habilidades. Os dois são ligados por uma chave, e o formulário **Guardar uma tese** grava nos dois de uma vez — não existe mais cadastrar duas vezes à mão. No topo da tela aparecem as teses do banco que ainda não têm texto pronto, com um botão que abre o formulário já preenchido; e todo verbete sem tese correspondente ganha um seletor para você ligar.

### Como preencher cada campo

**Tema** — específico o bastante para você achar em três segundos. "Horas extras" é ruim; "horas extras — cartão de ponto britânico" é bom. O tema é o gatilho fático, não o capítulo do livro.

**A tese em uma frase** — a proposição, seca, sem adjetivo: *"ponto com horário uniforme é inválido como prova e inverte o ônus"*. Se não couber em uma linha, provavelmente são duas teses.

**Quando usar** — o campo mais subestimado. É o que impede a tese de vazar para o caso errado. Escreva o fato que a autoriza: *"quando a empresa juntar controle de jornada sem variação de minutos"*.

**Fundamento** — súmula, artigo ou tema repetitivo, com número. É o campo que mais protege você: o sistema usa exatamente o que está aqui e não pode inventar outro.

**Se a defesa alegar** — o ouro do playbook. Toda vez que você ler uma contestação e pensar "de novo essa história", aquilo vira uma linha aqui. É o que faz a réplica sair pronta.

**Texto pronto** — o parágrafo do seu jeito, copiado de uma peça sua que foi bem, sem os dados do caso concreto. Em branco, o sistema escreve com o texto-base do banco de teses; preenchido, ele usa o seu.

### Por onde começar

Pela Jurimetria: veja no bloco **Por parte contrária** quais empresas mais aparecem. São as mesmas defesas, com os mesmos advogados, repetidas. Pegue duas ou três contestações da que mais litiga contra você, veja o que sempre alegam e transforme cada alegação recorrente em uma entrada. Depois vão as teses que você mais usa, seja qual for a parte: horas extras, insalubridade, verbas rescisórias, rescisão indireta.

### A cadência que funciona

Uma entrada por peça. Terminou uma réplica que ficou boa? Antes de fechar, cadastre a tese que a sustentou. Recebeu contestação com argumento novo? Preencha o "se a defesa alegar". Em dois meses são vinte entradas, sem nunca ter parado para "montar o playbook".

**Atenção ao campo Área:** uma tese cadastrada como Trabalhista não aparece em caso de área Administrativo. Deixando a área em branco, ela vale para todos.

### Revisar a carteira

No fim do menu **Aprender** há um bloco que faz uma pergunta que ninguém tem tempo de fazer manualmente: *dos casos que já estão abertos, quais se encaixam numa tese que eu não usei ali?*

Funciona em duas camadas, de propósito.

**A camada barata, dentro do sistema.** Ao clicar em *Rodar a varredura agora*, o sistema relê todos os casos abertos e compara, palavra por palavra, o texto de cada caso com o gatilho, o título e a rubrica de cada tese do banco. O texto do caso não é só o título — o título é processual e não diz nada dos fatos. Entram também o **assunto e a classe do processo** (a classificação do CNJ, que é justamente temática: "Adicional de Insalubridade", "Horas Extras") e os **fatos que você anotou** no caso. Onde houver duas ou mais palavras em comum, e a tese ainda não tiver sido usada numa minuta daquele caso, o par vira uma sugestão. Nada de inteligência artificial aqui: é filtro grosso, rápido e de graça.

**A camada cara, na nossa conversa.** O filtro grosso erra para os dois lados — sugere o que não cabe e às vezes deixa passar o que cabe. Por isso cada achado tem três botões: *Vale analisar*, *Não se aplica* e *voltar para a fila*. O que você descartar não volta a aparecer nas próximas varreduras — a decisão fica gravada. Depois de marcar os que interessam, o botão **Copiar para análise** monta um resumo com o caso, o cliente, a área, o que se sabe dos fatos, a tese sugerida, o "quando usar" e as provas que ela pede. Cole esse resumo na nossa conversa e eu leio caso a caso, com o processo à vista, dizendo onde a tese realmente cabe e o que falta provar.

**Quando rodar.** Uma vez por mês basta, ou sempre que você cadastrar uma tese nova no banco — é aí que a varredura rende mais, porque ela vai procurar essa tese nova em tudo que já está aberto.

**O que melhora o resultado.** Casos sem descrição, sem observações, sem processo vinculado e sem fatos anotados ficam de fora, e o bloco avisa quantos são. Duas linhas de resumo em cada caso mudam completamente o que a varredura encontra.


**Dicionário** — a tradução das movimentações processuais para o português que o cliente entende.

## 15. Documentos e Tutoriais

**Documentos** — as listas do que pedir por área (trabalhista, acidente de trabalho, cível/família, administrativo/concursos). Dentro do caso, a lista vira checklist com data de recebimento e cobrança pronta.

**Tutoriais** — os textos de ajuda para mandar ao cliente: como tirar o extrato do FGTS, como baixar a CTPS digital, como pegar o CNIS. Um clique manda pelo WhatsApp.

## 16. Importar antigos

Para a jurimetria valer, ela precisa do acervo inteiro, inclusive o arquivado.

Três caminhos: baixar a planilha modelo e subir preenchida; colar direto da tela do PJe ou de uma planilha; ou mandar só a lista de números e marcar "o robô do DataJud completa".

As colunas podem vir em qualquer ordem — ele reconhece pelo cabeçalho. O mínimo é o número do processo **ou** o nome do cliente. Quanto mais vara, classe, assunto, datas e resultado, melhor a estatística.

Antes de gravar ele mostra a conferência: quantas linhas leu, quais têm problema, quantas já vêm encerradas. Processo cujo número já existe é pulado — pode rodar de novo sem duplicar, e nesse caso ele só completa as partes que faltavam. Tudo o que entra por aí nasce marcado como anterior ao sistema.

**Colunas de parte.** Se em vez de "cliente" você informar **parte autora** e **parte ré**, o caso entra sem cliente definido e o processo aparece na Jurimetria, em "Quem é o cliente nestes processos", para você marcar o lado depois. É o caminho certo quando você não sabe de cabeça quem é o seu.

## 17. Regras

"Quando acontecer isto, faça aquilo." As regras rodam sobre as publicações quando você clica em "Aplicar as regras", na tela de Prazos.

Gatilhos: virou prazo, marcou audiência, é só ciência, processo não cadastrado, qualquer publicação — com filtro opcional por palavra no texto. Ações: criar tarefa, sugerir prazo, etiquetar o caso, lembrar de escrever ao cliente.

**Nenhuma mensagem sai sozinha para cliente.** A regra cria a tarefa; o texto continua saindo pela sua mão.

## 18. Configurações

- **Equipe e acessos** — convide alguém só com o e-mail; a pessoa recebe o link de entrada.
- **Permissões** — trave por pessoa o que ela pode apagar ou ver (casos, clientes, processos, prazos, financeiro, cadastro). A trava vale no banco, não só na tela.
- **Auditoria** — quem fez o quê: quem confirmou prazo, quem apagou, quem baixou cópia. Registrado por gatilho no banco, não dá para burlar pelo navegador.
- **Cópias automáticas** — backup todo dia às 7h30 e um completo por semana. A lista fica aqui, com link para baixar.
- **Áreas, origens, categorias e colunas** — os campos que alimentam os menus.
- **Cor do dia de hoje** no calendário.

## 19. O que o sistema não faz

Vale saber, para não contar com o que não existe:

- **Não protocola.** Nenhuma peça sai daqui para o PJe. Minuta é minuta.
- **Não envia mensagem sozinho.** WhatsApp e e-mail sempre saem pela sua mão.
- **Não usa o seu certificado digital nem entra no PJe por você.**
- **Não emite boleto nem nota fiscal** — precisaria contratar um gateway.
- **Não tem portal do cliente** — por decisão sua.
- **Não dá parecer.** A confiança que ele mostra é do robô que leu o texto, não do advogado que responde pelo caso.
- **Não busca jurisprudência sozinho.** O banco de precedentes é alimentado pelas suas peças; a conferência do inteiro teor é feita por você, pelos links de busca.
- **Não inventa ementa.** Só transcreve a que estiver na peça.

## 20. Quando der errado

**A tela não mudou depois de uma atualização** — Ctrl+F5 (no Mac, Cmd+Shift+R). O navegador guarda a versão antiga.

**"Não foi possível: new row violates row-level security"** — a sessão perdeu o vínculo com o escritório. Saia e entre de novo pelo link do e-mail.

**O robô não trouxe publicação hoje** — o DJEN só publica em dia útil, e a captura roda às 9h e às 15h. Se passar dois dias úteis sem nada, me avise.

**Um processo aparece "nunca consultado"** — o DataJud não achou aquele número. Costuma ser número digitado errado ou processo em segredo de justiça.

**O prazo sugerido veio com data estranha** — descarte e marque à mão. É exatamente para isso que existe a confirmação.

**A leitura de um PDF grande parou no meio** — ele lê em blocos de 12 páginas; se um bloco falhar, o status diz em quais páginas parou. Mande de novo só aquele intervalo.

**"Onde isto está provado?" não acha nada** — só procura em documentos que passaram pelo "Ler um documento" daquele caso. Documento anexado por outro caminho não entra na busca.

**Um precedente aparece sem o trecho da citação** — foi absorvido antes da melhoria. Reensine a peça no menu Aprender.

**A jurimetria mostra 0% de êxito** — falta preencher o resultado dos casos encerrados. Comece por "Resultado sugerido pelas movimentações".

**Perdi alguma coisa** — as cópias automáticas ficam em Configurações. Todo dia às 7h30.

      const n = h[1].length;
      out.push(n === 1 ? '' : `<h${Math.min(n,3)} class="mh${n}">${inline(h[2])}</h${Math.min(n,3)}>`);
      continue;
    }
    if (/^[-*]\s+/.test(t2)) {
      if (!emLista) { out.push('<ul>'); emLista = true; }
      out.push('<li>' + inline(t2.replace(/^[-*]\s+/,'')) + '</li>');
      continue;
    }
    if (emLista) { out.push('</ul>'); emLista = false; }
    out.push('<p>' + inline(t2) + '</p>');
  }
  if (emLista) out.push('</ul>');
  return out.join('\n');
}

const semAcento = t => String(t||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().trim();
function acharCol(cab){
  const idx = {};
  cab.forEach((c, i) => {
    const t = semAcento(c);
    if (/numero|processo|cnj/.test(t) && idx.numero == null) idx.numero = i;
    else if (/\bre[u]?\b|reclamad|passiv|contrari/.test(t) && idx.reu == null) idx.reu = i;
    else if (/autor|reclamante|ativa|requerente/.test(t) && idx.autor == null) idx.autor = i;
    else if (/cliente|nome/.test(t) && idx.cliente == null) idx.cliente = i;
    else if (/area/.test(t) && idx.area == null) idx.area = i;
    else if (/tribunal/.test(t) && idx.tribunal == null) idx.tribunal = i;
    else if (/vara|orgao|juizo|comarca/.test(t) && idx.vara == null) idx.vara = i;
    else if (/classe|acao|tipo/.test(t) && idx.classe == null) idx.classe = i;
    else if (/assunto|objeto|pedido/.test(t) && idx.assunto == null) idx.assunto = i;
    else if (/ajuiz|distrib|entrada|inicio/.test(t) && idx.ajuizado == null) idx.ajuizado = i;
    else if (/encerr|baixa|arquiv|fim|termino/.test(t) && idx.encerrado == null) idx.encerrado = i;
    else if (/resultado|desfecho|sentenca/.test(t) && idx.resultado == null) idx.resultado = i;
    else if (/valor/.test(t) && idx.valor == null) idx.valor = i;

function dataBr(v){
  const t = String(v||'').trim(); if (!t) return null;
  let m = t.match(/^(\d{2})[\/\-.](\d{2})[\/\-.](\d{4})$/);
  if (m) return `${m[3]}-${m[2]}-${m[1]}`;
  m = t.match(/^(\d{4})-(\d{2})-(\d{2})/);
  if (m) return `${m[1]}-${m[2]}-${m[3]}`;
  return null;
}
function numeroBr(v){
  const t = String(v||'').replace(/[^\d,.-]/g,'').replace(/\./g,'').replace(',','.');
  const n = Number(t); return isNaN(n) || !n ? null : n;
}
function lerLinhas(linhas){
  if (!linhas.length) return [];
  const idx = acharCol(linhas[0]);
  const temCabecalho = Object.keys(idx).length >= 2;
  const corpo = temCabecalho ? linhas.slice(1) : linhas;
  const mapa = temCabecalho ? idx : { numero:0, cliente:1, area:2, tribunal:3, vara:4, classe:5,
                                      assunto:6, ajuizado:7, encerrado:8, resultado:9, valor:10 };
  return corpo.map(l => {
    const g = k => mapa[k] != null ? String(l[mapa[k]] ?? '').trim() : '';
    const dig = g('numero').replace(/\D/g,'');
    return { numero: dig, formatado: dig.length===20 ? cnjFormata(dig) : g('numero'),
      cliente: g('cliente'), autor: g('autor'), reu: g('reu'),
      area: g('area'), tribunal: g('tribunal'), vara: g('vara'),
      classe: g('classe'), assunto: g('assunto'),
      ajuizado: dataBr(g('ajuizado')), encerrado: dataBr(g('encerrado')),
      resultado: g('resultado').toLowerCase(), valor: numeroBr(g('valor')),
      erro: (dig && dig.length !== 20) ? 'número não tem 20 dígitos'
          : (!dig && !g('cliente') && !g('autor')) ? 'sem número e sem parte' : null };
  }).filter(r => r.numero || r.cliente || r.autor);
}

let JUR = { procs: [], casos: [], decisoes: [], busca: '', aba: 'carteira' };

function comarcaDe(orgao){
  const t = String(orgao||'').trim();
  if (!t) return '';
  const m = t.match(/(?:Vara|Juizado|Turma|Gabinete|Fórum|Foro)[^,]*?\sde\s(.+)$/i)
        || t.match(/\bComarca\s+de\s+(.+)$/i);
  return (m ? m[1] : '').replace(/\s*[-–].*$/,'').trim();
}
function nomeParte(t){
  return String(t||'').replace(/\s+E\s+OUTRO(S)?\.?$/i,'').replace(/\s*-\s*(EM RECUPERACAO JUDICIAL|ME|EPP)$/i,'')
    .replace(/\s+/g,' ').trim();
}
function agrupa(lista, chave){
  const m = new Map();
  for (const p of lista) {
    const k = (chave(p) || '—').trim() || '—';
    if (!m.has(k)) m.set(k, []);
    m.get(k).push(p);
  }
  return [...m.entries()].sort((a,b)=>b[1].length-a[1].length);
}

    const dur = enc.map(p=>{

      return isNaN(a)||isNaN(b) ? null : Math.round((b-a)/DIA_MS);
    }).filter(x=>x!=null);
    const media = dur.length ? Math.round(dur.reduce((a,b)=>a+b,0)/dur.length) : null;
    return `<tr><td><b>${esc(k)}</b></td><td>${itens.length}</td>

const CODRES = {
  219:'procedente', 218:'procedente',
  221:'parcialmente procedente', 238:'parcialmente procedente',
  220:'improcedente', 239:'improcedente',
  466:'acordo', 12649:'acordo', 11373:'acordo',
  198:'desistência', 471:'desistência',
};
/* Movimentos que só dizem que o processo acabou, sem dizer como. Servem de último recurso. */
const FIM = m => {

  return /transito em julgado|arquivamento definitivo|\bdefinitivo\b|baixa definitiva|extincao da execucao/.test(t);
};
function lerResultado(m){
  const c = Number(m.codigo);
  if (CODRES[c]) return CODRES[c];
  const t = semAcento(m.descricao);
  if (/homolog.*(acordo|transacao|conciliacao)|acordo homologado/.test(t)) return 'acordo';
  if (/procedencia em parte|parcialmente procedente|provimento em parte/.test(t)) return 'parcialmente procedente';
  if (/improcedenc|nao provimento|nego provimento/.test(t)) return 'improcedente';
  if (/\bprocedencia\b|julgo procedente|\bprovimento\b/.test(t)) return 'procedente';
  if (/desistenc|renuncia/.test(t)) return 'desistência';
  if (/extincao sem resolucao de merito|julgo extinto sem/.test(t)) return 'arquivado';
  return null;
}

async function telaMetricas(){
  const ano = new Date().getUTCFullYear();
  const [pr, ar, cs, tot] = await Promise.all([
    sb.from('processo').select('id,caso_id,data_ajuizamento,tribunal_sigla,numero_formatado,numero_cnj,orgao,classe,grau,caso:caso_id(titulo, cliente:cliente_id(nome))').not('data_ajuizamento','is',null),
    sb.from('area_atuacao').select('id,nome'),
    sb.from('caso').select('id,area_id'),
    sb.from('processo').select('id', { count:'exact', head:true }),
  ]);
  if (pr.error) return erro(pr.error.message);
  const rotArea = new Map((ar.data||[]).map(x=>[x.id,x.nome]));
  const areaDoCaso = new Map((cs.data||[]).map(c=>[c.id, rotArea.get(c.area_id) || 'não informada']));
  const doAno = (pr.data||[]).filter(p => String(p.data_ajuizamento).slice(0,4) === String(ano));
  const anterior = (pr.data||[]).filter(p => String(p.data_ajuizamento).slice(0,4) === String(ano-1)).length;

  const meses = MES.map((m,i) => [m, doAno.filter(p =>
    Number(String(p.data_ajuizamento).slice(5,7)) === i+1).length]);
  const porArea = contar(doAno.map(p=>({a: areaDoCaso.get(p.caso_id) || 'não informada'})), 'a');
  const porTrib = contar(doAno.map(p=>({t: p.tribunal_sigla || '—'})), 't');
  const mesAtual = new Date().getUTCMonth() + 1;
  const media = mesAtual ? (doAno.length / mesAtual) : 0;
  const projecao = Math.round(media * 12);
  PROCANO = (pr.data||[]).map(p => ({ ...p, _area: areaDoCaso.get(p.caso_id) || 'não informada' }));
  ANOSDISP = [...new Set(PROCANO.map(p => String(p.data_ajuizamento).slice(0,4)))]
    .filter(Boolean).sort().reverse();
  if (!ANOSDISP.includes(String(ano))) ANOSDISP.unshift(String(ano));
  ANOSEL = String(ano);
  const listaAno = [...doAno].sort((a,b) =>
    String(b.data_ajuizamento).localeCompare(String(a.data_ajuizamento)));
  ANOLISTA = listaAno.map(p => ({
    ajuizado: br(p.data_ajuizamento),
    numero: p.numero_formatado || p.numero_cnj || '',
    cliente: p.caso?.cliente?.nome || p.caso?.titulo || '',
    orgao: p.orgao || '', tribunal: p.tribunal_sigla || '', grau: p.grau || '',
    classe: p.classe || '', area: areaDoCaso.get(p.caso_id) || 'não informada',
  }));
  ANOROT = ano;

  app.innerHTML = menu('metricas') + `
  <main><h1>Processos ajuizados em ${ano}</h1>
  <div class="card"><h2>Relatórios</h2>
    <p class="nota">Escolha o período e gere o documento. O PDF sai pela janela de impressão —
      escolha "Salvar como PDF" no destino. A planilha abre no Excel.</p>
    <div style="padding:0 18px 18px;display:flex;gap:9px;flex-wrap:wrap;align-items:flex-end">
      <label style="display:flex;flex-direction:column;gap:3px">
        <span class="sub" style="margin:0">De</span>
        <input type="date" id="rel-de" value="${new Date(Date.now()-180*864e5).toISOString().slice(0,10)}"></label>
      <label style="display:flex;flex-direction:column;gap:3px">
        <span class="sub" style="margin:0">Até</span>
        <input type="date" id="rel-ate" value="${hoje()}"></label>
      <button class="btn ok" onclick="relatorioProducaoPdf()">Produção (PDF)</button>
      <button class="btn" onclick="relatorioProducaoXlsx()">Produção (Excel)</button>
      <button class="btn ok" onclick="relatorioFinanceiroPdf()">Financeiro (PDF)</button>
      <button class="btn" onclick="relatorioPlanilhaGeral()">Planilha completa (Excel)</button>
      <span class="sub" id="rel-st" style="margin:0"></span>
    </div></div>
  <p class="meta">Pela data de distribuição informada pelo CNJ. É o número que fecha o ano.</p>
  <div class="kpis">
    <div class="kpi"><div class="n">${doAno.length}</div><div class="l">ajuizados em ${ano}</div></div>
    <div class="kpi"><div class="n">${media.toFixed(1)}</div><div class="l">média por mês</div></div>
    <div class="kpi"><div class="n">${projecao}</div><div class="l">projeção para o ano</div></div>
    <div class="kpi"><div class="n">${anterior}</div><div class="l">ajuizados em ${ano-1}</div></div>
  </div>
  ${barras('Mês a mês', `Distribuições de janeiro a dezembro de ${ano}.`, meses)}
  <div class="duas">
    ${barras('Por área', 'Área do caso ligado ao processo.', porArea)}
    ${barras('Por tribunal', null, porTrib)}
  </div>
  <div class="aviso" style="border-color:var(--ln);margin-top:18px">
    Só entram processos com data de distribuição vinda do CNJ — hoje
    <b>${(pr.data||[]).length} de ${tot.count ?? '—'}</b> processos já têm essa data.
    Conforme a varredura noturna avança, o número do ano se completa sozinho.</div>

  <div class="card" style="margin-top:18px"><h2>Processos protocolados</h2>
    <p class="nota">Um a um, do mais recente para o mais antigo. Clique no número para abrir o processo
      ou no cliente para abrir o caso.</p>
    <div style="padding:0 18px 12px;display:flex;gap:8px;flex-wrap:wrap;align-items:center">
      <span class="sub" style="margin:0">Ano</span>
      ${ANOSDISP.map(a=>`<button class="fchip ${a===ANOSEL?'on':''}" data-ano="${a}"
        onclick="mudarAnoProc('${a}')">${a}</button>`).join('')}
    </div>
    <div id="protoc"></div>
    <div style="padding:12px 18px 18px;display:flex;gap:8px;flex-wrap:wrap;align-items:center">
      <button class="btn ok" onclick="listaAnoPdf()">Lista em PDF</button>
      <button class="btn" onclick="listaAnoXlsx()">Lista em Excel</button>
    </div></div>
  </main>` + rodape();
  pintarProtocolados();
}

function linhaLanc(l, aberto){
  const d = dias(l.vencimento);
  const k = !aberto ? 'good' : (d < 0 ? 'crit' : (d <= 7 ? 'ser' : 'cin'));
  const rot = !aberto ? 'liquidado' : (d < 0 ? 'atrasado '+(-d)+'d' : (d===0?'vence hoje':'em '+d+' dias'));
  return `<tr>
    <td class="dt"><b>${br(l.vencimento)}</b><span class="sub"><span class="pill ${k}">${rot}</span></span></td>
    <td>${l.tipo==='entrada'?'↑ entrada':'↓ saída'}<span class="sub">${esc(l.categoria?.nome||'sem categoria')}</span></td>
    <td><b>${esc(l.descricao||'—')}</b><span class="sub">${esc(l.cliente?.nome || l.contraparte || '')}</span></td>
    <td class="dt" style="font-weight:600;color:${l.tipo==='entrada'?'var(--good)':'var(--ink)'}">${rs(l.valor)}</td>
    <td>${aberto?`<button class="btn ok" onclick="baixar('${l.id}')">${l.tipo==='entrada'?'Recebido':'Pago'}</button>`
                :`<span class="sub">${br(l.pagamento)}</span>`}</td></tr>`;
}
async function telaFinanceiro(){

  ]);
  if (lc.error) return erro(lc.error.message);
  LANC = lc.data||[]; CATS = ct.data||[]; CLI2 = cl.data||[];
  const abertos = LANC.filter(l => l.situacao==='previsto' || l.situacao==='atrasado');
  const pagos   = LANC.filter(l => l.situacao==='pago').sort((a,b)=>String(b.pagamento).localeCompare(String(a.pagamento)));
  const soma = a => a.reduce((t,l)=>t+Number(l.valor||0), 0);
  const mes = hoje().slice(0,7);
  const recMes = soma(pagos.filter(l=>l.tipo==='entrada' && String(l.pagamento).slice(0,7)===mes));
  const pagMes = soma(pagos.filter(l=>l.tipo==='saida'   && String(l.pagamento).slice(0,7)===mes));

  const porMesTipo = (tipo) => {
    const h = new Date(), out = [];
    for (let i=5;i>=0;i--){
      const d = new Date(Date.UTC(h.getUTCFullYear(), h.getUTCMonth()-i, 1)), ch = d.toISOString().slice(0,7);
      out.push([MES[d.getUTCMonth()]+'/'+String(d.getUTCFullYear()).slice(2),
        Math.round(soma(pagos.filter(l=>l.tipo===tipo && String(l.pagamento).slice(0,7)===ch)))]);
    }
    return out;
  };
  const opt = (lista, vazio) => `<option value="">${vazio}</option>` +

    <div class="kpi"><div class="n">${rs(soma(abertos.filter(l=>l.tipo==='saida')))}</div><div class="l">a pagar</div></div>
    <div class="kpi"><div class="n">${rs(recMes)}</div><div class="l">recebido neste mês</div></div>
    <div class="kpi ${recMes-pagMes<0?'al':''}"><div class="n">${rs(recMes-pagMes)}</div><div class="l">saldo do mês</div></div>
  </div>
  ${atras.length?`<div class="aviso"><b>${atras.length} lançamento(s) vencido(s) e em aberto</b>, somando ${rs(soma(atras))}.</div>`:''}

  <div class="card"><h2>Novo lançamento</h2>
    <p class="nota">Uma linha por vencimento. Para honorário parcelado, lance cada parcela na data dela.</p>
    <form onsubmit="novoLancamento(event)" style="display:flex;gap:8px;flex-wrap:wrap;padding:0 18px 18px;align-items:center">
      <select name="tipo" required><option value="entrada">Entrada</option><option value="saida">Saída</option></select>
      <input name="descricao" type="text" placeholder="descrição" required style="min-width:190px">
      <select name="cliente_id">${opt(CLI2,'cliente (opcional)')}</select>
      <select name="categoria_id">${opt(CATS,'categoria')}</select>
      <input name="contraparte" type="text" placeholder="de / para" style="width:130px">
      <input name="valor" type="text" inputmode="decimal" placeholder="0,00" required style="width:95px">
      <input name="vencimento" type="date" required value="${hoje()}">
      <button class="btn ok" type="submit">Lançar</button>
    </form></div>

  <div class="card"><h2>Em aberto</h2><p class="nota">Dê baixa quando o dinheiro entrar ou sair de fato.</p>
    <table><thead><tr><th>Vencimento</th><th>Tipo</th><th>Descrição</th><th>Valor</th><th></th></tr></thead>
    <tbody>${abertos.map(l=>linhaLanc(l,true)).join('') || '<tr><td colspan="5" class="vazio">Nada em aberto.</td></tr>'}</tbody></table></div>

  <div class="duas">
    ${barras('Entradas por mês','Só o que já foi recebido, em reais.', porMesTipo('entrada'))}
    ${barras('Saídas por mês','Só o que já foi pago, em reais.', porMesTipo('saida'))}
  </div>

  <div class="card" style="margin-top:18px"><h2>Categorias</h2>
    <p class="nota">Acrescente as categorias que o escritório usa de verdade.</p>
    <div style="padding:0 18px 16px">
      <form onsubmit="novoItem(event,'categoria_financeira')" style="display:flex;gap:8px;flex-wrap:wrap">
        <select name="tipo"><option value="entrada">Entrada</option><option value="saida">Saída</option></select>
        <input name="nome" type="text" placeholder="nova categoria" required style="flex:1;min-width:170px">

  ${pagos.length?`<div class="card" style="margin-top:18px"><h2>Últimos liquidados</h2>
    <table><thead><tr><th>Vencimento</th><th>Tipo</th><th>Descrição</th><th>Valor</th><th>Baixa</th></tr></thead>
    <tbody>${pagos.slice(0,20).map(l=>linhaLanc(l,false)).join('')}</tbody></table></div>`:''}

let MSG = [], MSGF = 'novidade', MSGFOCO = null, ESCRITORIO = null;
async function escId(){ if (!ESC_ID) { const { data } = await sb.from('escritorio').select('id').limit(1).single(); ESC_ID = data?.id ?? null; } return ESC_ID; }
async function escritorioId(){

const semContato = c => c.ultimo_contato
  ? Math.round((Date.now() - Date.parse(c.ultimo_contato))/864e5) : null;
const zero = n => String(n).padStart(2,'0');
const linkWa = (fone, texto) => {
  const f = so(fone); if (!f) return null;
  return 'https://wa.me/' + (f.length<=11 ? '55'+f : f) + '?text=' + encodeURIComponent(texto);
};

/* Monta a mensagem de atualização de um caso. */
function montarInformativo(c){
  const proc = c.procs?.[0];
  const numero = proc ? (proc.numero_formatado || proc.numero_cnj) : '';
  const nome = nomeProprio((c.nome||'').split(' ')[0]);
  const abertura = `Olá, ${nome}. Segue a atualização do seu processo.`;
  const corpo = c.rascunho?.corpo
    ? c.rascunho.corpo
    : ((c.movs||[]).length
      ? c.movs.map(m => `• ${br(m.data)} — ${m.texto_cliente}`).join('\n')
      : '• Nenhuma decisão nova no período. O processo segue tramitando normalmente.');
  return `Atualização do processo ${numero}\n\n${abertura}\n\n${corpo}\n\n`
       + `Continuo acompanhando e aviso assim que houver novidade. `
       + `Qualquer dúvida, é só responder por aqui.`;
}

window.filtroMsg = v => { MSGF = v; pintaMsg(); };
function pintaMsg(){
  let f = MSG;
  if (MSGF === 'novidade') f = MSG.filter(c => c.novidades > 0);
  if (MSGF === 'parados')  f = MSG.filter(c => { const d = semContato(c); return d === null || d > 30; });
  if (MSGF === 'semfone')  f = MSG.filter(c => !c.fone);
  document.getElementById('cm').innerHTML = f.map(linhaMsg).join('')
    || '<tr><td colspan="5" class="vazio">Ninguém neste filtro.</td></tr>';

    const lin = document.getElementById('lin' + MSGFOCO);
    if (lin) {
      lin.style.boxShadow = 'inset 0 0 0 2px var(--serie)';
      lin.scrollIntoView({ block:'center', behavior:'smooth' });
      if (!document.getElementById('box' + MSGFOCO)) verTexto(MSGFOCO);
    }
    MSGFOCO = null;
  }
}

window.verTexto = (casoId) => {

async function telaMensageria(foco){
  const [mp, pr] = await Promise.all([
    sb.from('mensageria_painel').select('*'),
    sb.from('processo').select('id,caso_id,numero_formatado,numero_cnj').not('caso_id','is',null),
  ]);
  if (mp.error) return erro(mp.error.message);
  const mv = await sb.from('movimentacao_traduzida')
    .select('processo_id,data,texto_cliente').eq('relevante', true).order('data');
  const rs = await sb.from('informativo_rascunho')
    .select('caso_id,corpo,relevancia,revisar,motivo_revisar,criado_em')
    .eq('status','rascunho').order('criado_em');
  const rascCaso = new Map((rs.data||[]).map(r => [r.caso_id, r]));
  const porCaso = new Map();
  for (const p of (pr.data||[])) {
    if (!porCaso.has(p.caso_id)) porCaso.set(p.caso_id, []);
    porCaso.get(p.caso_id).push(p);
  }
  const casoDoProc = new Map((pr.data||[]).map(p => [p.id, p.caso_id]));
  const movsCaso = new Map();
  for (const m of (mv.data||[])) {
    const k = casoDoProc.get(m.processo_id); if (!k) continue;
    if (!movsCaso.has(k)) movsCaso.set(k, []);
    movsCaso.get(k).push(m);
  }
  MSG = (mp.data||[]).map(c => {
    const corte = c.ultimo_contato || new Date(Date.now() - 90*864e5).toISOString();
    c.procs = porCaso.get(c.caso_id) || [];
    c.movs = (movsCaso.get(c.caso_id) || []).filter(m => String(m.data) > String(corte));
    c.rascunho = rascCaso.get(c.caso_id) || null;
    c.texto = montarInformativo(c);
    return c;
  }).sort((a,b) => (b.novidades||0) - (a.novidades||0)
    || String(a.ultimo_contato||'').localeCompare(String(b.ultimo_contato||'')));

  const comNov = MSG.filter(c=>c.novidades>0).length;
  const parados = MSG.filter(c=>{const d=semContato(c); return d===null||d>30;}).length;
  const semFone = MSG.filter(c=>!c.fone).length;
  app.innerHTML = menu('mensageria') + `
  <main><h1>Mensagens</h1>
  <p class="meta">Uma mensagem de atualização por cliente. O link já vai com o texto pronto — um clique abre o WhatsApp.</p>
  <div class="kpis">
    <div class="kpi"><div class="n">${MSG.length}</div><div class="l">casos ativos</div></div>
    <div class="kpi"><div class="n">${comNov}</div><div class="l">com novidade desde o último contato</div></div>
    <div class="kpi ${parados?'al':''}"><div class="n">${parados}</div><div class="l">sem contato há mais de 30 dias</div></div>
    <div class="kpi"><div class="n">${semFone}</div><div class="l">sem telefone cadastrado</div></div>
  </div>
  <div class="aviso" style="border-color:var(--ln)">
    O texto usa só as movimentações marcadas como <b>relevantes</b> no dicionário. A numeração avança
    quando você registra o envio — por isso vale registrar sempre. <b>Leia antes de enviar</b>: quem assina é você.</div>
  <div class="card"><h2>Casos</h2>
    <div class="filtros" id="fm">
      <button class="btn" data-f="novidade" onclick="filtroMsg('novidade')">Com novidade</button>
      <button class="btn" data-f="parados"  onclick="filtroMsg('parados')">Sem contato há +30 dias</button>
      <button class="btn" data-f="semfone"  onclick="filtroMsg('semfone')">Sem telefone</button>
      <button class="btn" data-f="todos"    onclick="filtroMsg('todos')">Todos</button>
    </div>
    <table><thead><tr><th>Cliente</th><th>Telefone</th><th>Última atualização</th><th>Última movimentação</th><th></th></tr></thead>
    <tbody id="cm"></tbody></table></div></main>`;
  if (foco) {
    MSGFOCO = foco;
    MSGF = 'todos';
    const alvo = MSG.find(c => c.caso_id === foco);
    if (!alvo) {
      const av = document.createElement('div');
      av.className = 'aviso';
      av.innerHTML = '<b>O caso desta publicação não aparece na lista de mensagens.</b> ' +
        'Isso acontece quando o caso ainda não tem cliente ou telefone cadastrado.';
      app.querySelector('main')?.prepend(av);
    }
  }
  pintaMsg();
}

  Number(v).toLocaleString('pt-BR', { style:'currency', currency:'BRL' });
function valorDel(d){
  if (d.honorario_tipo === 'percentual' && d.honorario_percentual != null)
    return String(d.honorario_percentual).replace('.', ',') + '% do êxito';

/* semáforo da delegação: atraso do retorno e pendência de pagamento */
function semDel(d){
  if (d.situacao === 'cancelada') return { cor:'cin', peso:0, texto:'Cancelada' };
  if (d.situacao === 'entregue') {
    if (d.pago_em) return { cor:'good', peso:0, texto:'Entregue e paga' };
    const temValor = d.honorario_valor != null || d.honorario_percentual != null;
    return temValor
      ? { cor:'warn', peso:2, texto:'Entregue — falta pagar' }
      : { cor:'good', peso:0, texto:'Entregue' };
  }
  const alvo = d.prazo_retorno || (d.data_ato ? String(d.data_ato).slice(0,10) : null);
  if (!alvo) return { cor:'cin', peso:1, texto:'Sem data de retorno' };
  const n = diasDesde(alvo);
  if (n > 0)  return { cor:'crit', peso:5, texto:'Atrasada há ' + humano(n) };
  if (n === 0) return { cor:'crit', peso:4, texto:'Vence hoje' };
  if (n >= -3) return { cor:'ser',  peso:3, texto:'Faltam ' + Math.abs(n) + ' dia(s)' };
  return { cor:'good', peso:1, texto:'Faltam ' + humano(Math.abs(n)) };
}

    caso:'um caso inteiro', parceria:'uma parceria num caso' };

  l.push('');
  l.push('• O quê: ' + d.titulo);
  if (pr) l.push('• Processo: ' + pr);
  if (d.processo?.orgao) l.push('• Vara: ' + d.processo.orgao);
  if (c) l.push('• Caso: ' + c);
  if (d.data_ato) l.push('• Quando: ' + br(String(d.data_ato).slice(0,10)) +
    (String(d.data_ato).slice(11,16) !== '00:00' ? ' às ' + String(d.data_ato).slice(11,16) : ''));
  if (d.local_ato) l.push('• Onde: ' + d.local_ato);

let SOLTOS = [], CASOSLISTA = [];
const areaDoTribunal = t => {
  const s = String(t || '').toUpperCase();
  if (s.startsWith('TRT') || s === 'TST') return 'Trabalhista';
  if (s.startsWith('TRF') || s.startsWith('JF') || s === 'STJ') return 'Federal';
  if (s.startsWith('TJ')) return 'Cível';
  return null;
};
async function carregarSoltos(){
  const { data } = await sb.from('processo')
    .select('id,numero_formatado,numero_cnj,classe,orgao,tribunal_sigla')
    .is('caso_id', null).order('numero_cnj').limit(500);
  SOLTOS = data || [];
  return SOLTOS;
}
const rotuloProc = p => (p.numero_formatado || cnjFormata(p.numero_cnj))
  + ' · ' + (p.classe || 'sem classe') + ' · ' + (p.orgao || p.tribunal_sigla || '');
function pickerHtml(casoId){
  return `<div style="padding:0 18px 16px">
    <p class="nota" style="padding:0">Vincular processo que já está cadastrado e ainda não pertence a caso nenhum.</p>
    <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">
      <input id="bs-${casoId}" type="search" placeholder="número, vara ou classe"
             oninput="filtrarSoltos('${casoId}')" style="min-width:220px">
      <select id="ss-${casoId}" style="min-width:330px"></select>
      <button class="btn ok" onclick="vincularProc('${casoId}')">Vincular ao caso</button>
      <span class="sub" id="vs-${casoId}" style="margin:0"></span>
    </div></div>`;
}
window.filtrarSoltos = casoId => {
  const s = document.getElementById('ss-' + casoId); if (!s) return;
  const t = (document.getElementById('bs-' + casoId)?.value || '').toLowerCase().trim();
  const l = SOLTOS.filter(p => !t ||
    String(p.numero_formatado || p.numero_cnj || '').toLowerCase().includes(t) ||
    String(p.orgao || '').toLowerCase().includes(t) ||
    String(p.classe || '').toLowerCase().includes(t) ||
    String(p.tribunal_sigla || '').toLowerCase().includes(t));
  s.innerHTML = l.length
    ? l.slice(0, 300).map(p => `<option value="${p.id}">${esc(rotuloProc(p))}</option>`).join('')
    : '<option value="">— nenhum processo solto com esse termo —</option>';
};
window.vincularProc = async casoId => {
  const s = document.getElementById('ss-' + casoId), st = document.getElementById('vs-' + casoId);
  const pid = s?.value; if (!pid) return;
  if (st) st.textContent = 'vinculando…';
  const { error } = await sb.from('processo').update({ caso_id: casoId }).eq('id', pid);
  if (error) { if (st) st.textContent = 'erro: ' + error.message; return; }
  SOLTOS = SOLTOS.filter(p => p.id !== pid);
  if (typeof CASO !== 'undefined' && CASO && CASO.id === casoId) return telaCaso(casoId);
  if (st) st.textContent = 'vinculado ✓';
  filtrarSoltos(casoId);
};
/* usado na aba Processos: escolher o caso de um processo solto */
window.vincularCaso = async (procId, casoId, el) => {
  const st = el.parentElement.querySelector('.sub');
  if (!casoId) return;
  if (st) st.textContent = 'vinculando…';
  const { error } = await sb.from('processo').update({ caso_id: casoId }).eq('id', procId);
  if (st) st.textContent = error ? 'erro: ' + error.message : 'vinculado ✓';
  if (!error) setTimeout(() => telaProcessos(), 700);
};
window.criarCasosSoltos = async () => {
  const st = document.getElementById('cs-st');
  const eid = await escId();
  st.textContent = 'lendo os processos…'; st.style.color = 'var(--i3)';
  const { data: procs, error } = await sb.from('processo')
    .select('id,numero_formatado,numero_cnj,classe,tribunal_sigla,orgao,data_ajuizamento')
    .is('caso_id', null).limit(500);
  if (error) { st.textContent = 'erro: ' + error.message; st.style.color = 'var(--crit)'; return; }
  if (!procs.length) { st.textContent = 'nenhum processo solto — está tudo vinculado.'; return; }
  if (!confirm('Criar ' + procs.length + ' casos, um para cada processo sem caso?\n\n' +
    'O título vai ser o número e a classe, com o nome quando a intimação permitir identificar sem dúvida. ' +
    'Você renomeia depois, caso a caso.')) { st.textContent = ''; return; }

  const ids = procs.map(p => p.id);
  let intim = [];
  for (let i = 0; i < ids.length; i += 40) {
    const { data } = await sb.from('intimacao').select('processo_id,destinatarios')
      .in('processo_id', ids.slice(i, i + 40)).limit(500);
    intim = intim.concat(data || []);
  }
  const ENT = /(LTDA|S\/A|EIRELI|MUNICIPIO|ESTADO DE|SECRETARIA|FUNDACAO|INSTITUTO|COOPERATIV|PROCURADORIA|\bPGE\b|BANCO|HOSPITAL|PREFEITURA|UNIAO|\bINSS\b|CAIXA|MINISTERIO|EMPRESA|COMERCIO|INDUSTRIA|SERVICOS|ASSOCIACAO|SINDICATO|CONSELHO|AGENCIA|DEPARTAMENTO)/i;
  const MEU = /BRENO\s+DA\s+SILVA\s+AMORIM|BRENO\s+S\.?\s*AMORIM/i;
  const porProc = {};
  for (const it of intim) {
    porProc[it.processo_id] ||= new Set();
    for (const d of (it.destinatarios || [])) if (d?.nome) porProc[it.processo_id].add(d.nome);
  }
  const freq = {};
  for (const c of Object.values(porProc)) for (const n of c) freq[n] = (freq[n] || 0) + 1;
  const nomeDe = pid => {
    const c = porProc[pid]; if (!c) return null;
    const cand = [...c].filter(n => !ENT.test(n) && !MEU.test(n) && freq[n] === 1);
    return cand.length === 1 ? cand[0] : null;
  };

  let feitos = 0, falhas = 0, comNome = 0;
  for (const p of procs) {
    const nome = nomeDe(p.id); if (nome) comNome++;
    const titulo = [nome, p.numero_formatado || cnjFormata(p.numero_cnj), p.classe].filter(Boolean).join(' — ');
    const linha = { escritorio_id: eid, titulo, area: areaDoTribunal(p.tribunal_sigla),
      observacoes: 'Caso criado automaticamente a partir do processo importado. Confira o cliente e ajuste o título.'
        + (nome ? ' O nome veio de uma intimação do DJEN e ainda precisa ser confirmado.' : '') };
    if (p.data_ajuizamento) linha.criado_em = p.data_ajuizamento + 'T12:00:00Z';
    const { data: novo, error: e1 } = await sb.from('caso').insert(linha).select('id').single();
    if (e1) { falhas++; continue; }
    const { error: e2 } = await sb.from('processo').update({ caso_id: novo.id }).eq('id', p.id);
    if (e2) { falhas++; continue; }
    feitos++;
    if (feitos % 5 === 0) st.textContent = 'criando… ' + feitos + ' de ' + procs.length;
  }
  st.textContent = feitos + ' caso(s) criados' + (comNome ? ', ' + comNome + ' com nome vindo de intimação' : '')
    + (falhas ? ' · ' + falhas + ' falha(s)' : '') + '. Atualizando a tela…';
  st.style.color = falhas ? 'var(--warn)' : 'var(--good)';
  setTimeout(() => telaProcessos(), 1800);
};

/* --------------------------------------------- tempo de trâmite e paralisação */
const DIA_MS = 864e5;
const FASES = { conhecimento:'Conhecimento', recurso:'Recurso', execucao:'Execução',
                suspenso:'Suspenso', arquivado:'Arquivado' };
/* Arquivado é fim de linha: o processo não cobra mais nada e sai das contas
   de andamento. Continua guardado e pesquisável — só para de pedir providência. */
const arquivado = p => p.fase === 'arquivado';
const diasDesde = d => {
  if (!d) return null;
  const s = String(d);
  const t = Date.parse(s.length <= 10 ? s + 'T12:00:00' : s);
  return isNaN(t) ? null : Math.floor((Date.now() - t) / DIA_MS);
};
function humano(n){
  if (n == null) return '—';
  if (n < 0) return 'em ' + Math.abs(n) + ' dias';
  if (n < 60) return n + (n === 1 ? ' dia' : ' dias');
  const meses = Math.round(n / 30.44);
  const a = Math.floor(meses / 12), m = meses % 12;
  if (!a) return m + (m === 1 ? ' mês' : ' meses');
  return a + (a === 1 ? ' ano' : ' anos') + (m ? ' e ' + m + (m === 1 ? ' mês' : ' meses') : '');
}
/* data do último sinal de vida do processo */
const ultimoSinal = p => p.ultima_movimentacao || p.ultima_intimacao || p.data_ajuizamento || null;
/* Devolve { cor, peso, titulo, acao, silenciado } para um processo. */
function semaforo(p){
  const hoje = new Date().toISOString().slice(0,10);
  if (p.aguardando_ate && p.aguardando_ate >= hoje)
    return { cor:'cin', peso:0, silenciado:true, titulo:'Aguardando ' + br(p.aguardando_ate),
             acao: p.aguardando_obs || 'alerta silenciado até essa data' };
  if (p.fase === 'arquivado')
    return { cor:'cin', peso:-1, silenciado:true, titulo:'Arquivado',
             acao:'processo encerrado — fica guardado, mas não cobra mais nada' };
  if (p.fase === 'suspenso')
    return { cor:'cin', peso:0, silenciado:true, titulo:'Suspenso', acao:'sem cobrança enquanto estiver suspenso' };

  if (p.fase === 'execucao') {
    if (!p.marco_intercorrente)
      return { cor:'cin', peso:1, titulo:'Execução sem marco',
               acao:'marque a data da intimação do art. 11-A para o relógio começar' };
    const d = diasDesde(p.marco_intercorrente), m = Math.floor(d / 30.44);
    const limite = new Date(Date.parse(p.marco_intercorrente + 'T12:00:00') + 1096 * DIA_MS)
      .toISOString().slice(0,10);
    const venceu = limite < new Date().toISOString().slice(0,10);
    if (venceu) return { cor:'crit', peso:6, titulo:'Prazo do art. 11-A já vencido — ' + m + ' meses',
      acao:'os três anos se completaram em ' + br(limite) + '. Confira se houve intimação regular e ato interruptivo' };
    if (m >= 30) return { cor:'crit', peso:5, titulo:'Prescrição intercorrente perto — ' + m + ' meses',
      acao:'o biênio se completa em ' + br(limite) + '. Peticione diligência útil agora' };
    if (m >= 24) return { cor:'ser', peso:4, titulo:'Biênio correndo — ' + m + ' meses',
      acao:'prescreve em ' + br(limite) + '. Indique meios efetivos de persecução patrimonial' };
    if (m >= 12) return { cor:'warn', peso:3, titulo:'Suspensão vencida — ' + m + ' meses',
      acao:'acabou o ano de suspensão; a partir daqui o prazo do art. 11-A corre' };
    return { cor:'good', peso:0, titulo:'Suspensão em curso — ' + m + ' meses',
      acao:'no primeiro ano a prescrição não corre (art. 921, §1º, do CPC)' };
  }

  const base = p.ultima_movimentacao || p.ultima_intimacao;
  if (!base) {
    if (!p.ultima_sync) return { cor:'cin', peso:1, titulo:'Ainda não consultado',
      acao:'o robô do DataJud ainda não trouxe nada deste número — confira se está correto' };
    const d0 = diasDesde(p.data_ajuizamento);
    if (d0 == null) return { cor:'cin', peso:1, titulo:'Sem data de ajuizamento',
      acao:'preencha a data para o contador funcionar' };
    return { cor: d0 >= 180 ? 'ser' : 'cin', peso: d0 >= 180 ? 4 : 1,
      titulo:'Nenhuma movimentação em ' + humano(d0),
      acao:'o DataJud não devolveu andamento nenhum; confira direto no PJe' };
  }
  const d = diasDesde(base);
  if (d == null) return { cor:'cin', peso:1, titulo:'Sem andamento registrado',
    acao:'confira se o número está certo e se o robô já consultou' };
  if (d >= 180) return { cor:'crit', peso:5, titulo:'Parado há ' + humano(d),
    acao:'já cabe reclamação à Corregedoria do tribunal' };
  if (d >= 90)  return { cor:'ser', peso:4, titulo:'Parado há ' + humano(d),
    acao:'peticione pedindo impulso ou cobre a secretaria da vara' };
  if (d >= 60)  return { cor:'warn', peso:3, titulo:'Parado há ' + humano(d),
    acao:'confira o que está pendente de cumprimento' };
  return { cor:'good', peso:0, titulo:'Parado há ' + humano(d), acao:'dentro do normal' };
}

    .replace(/[^\wçãáéíóúâêô\s-]/g,' ').split(/\s+/)
    .filter(w => w.length > 3 && !['para','como','pelo','pela','que','dos','das','com','sem','nos','nas','uma','este','esta','isso'].includes(w));

async function carregarPdfLib(){
  if (window.PDFLib) return window.PDFLib;
  await new Promise((ok, err) => {
    const s = document.createElement('script');
    s.src = 'https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js';
    s.onload = ok; s.onerror = () => err(new Error('não consegui carregar o divisor de PDF'));
    document.head.appendChild(s);
  });
  return window.PDFLib;
}
async function fatiarPdf(file, porBloco){
  const { PDFDocument } = await carregarPdfLib();
  const doc = await PDFDocument.load(await file.arrayBuffer(), { ignoreEncryption: true });
  const n = doc.getPageCount();
  const partes = [];
  for (let i = 0; i < n; i += porBloco) {
    const novo = await PDFDocument.create();
    const idx = [];
    for (let k = 0; k < porBloco && i + k < n; k++) idx.push(i + k);
    const pgs = await novo.copyPages(doc, idx);
    pgs.forEach(pg => novo.addPage(pg));
    partes.push({ b64: await novo.saveAsBase64(), de: i + 1, ate: i + idx.length });
  }
  return { paginas: n, partes };
}

window.lerDocumento = async (input) => {
  const f = input.files?.[0]; if (!f) return;
  const st = document.getElementById('ld-st');
  const alvo = document.getElementById('ldres');
  const ehPdf = /pdf/i.test(f.type) || /\.pdf$/i.test(f.name);
  if (!ehPdf && f.size > 6*1024*1024) { st.style.color='var(--crit)';
    st.textContent = 'foto grande demais (máx. 6 MB). Reduza a imagem.'; return; }
  if (f.size > 60*1024*1024) { st.style.color='var(--crit)';
    st.textContent = 'PDF acima de 60 MB. Divida em duas partes.'; return; }
  st.style.color='var(--i3)'; st.textContent = 'lendo o documento…'; alvo.innerHTML = '';
  let j;
  try {
    if (ehPdf && f.size > 3*1024*1024) {
      st.textContent = 'PDF grande: dividindo em blocos de páginas…';
      const { paginas, partes } = await fatiarPdf(f, 12);
      const juntos = { tipo: null, campos: {}, fatos: [], transcricao: '', observacao: '', arquivo: f.name };
      for (let i = 0; i < partes.length; i++) {
        const parte = partes[i];
        st.textContent = `lendo páginas ${parte.de} a ${parte.ate} de ${paginas}…`;
        const r = await mandarAoLeitor(parte.b64, 'application/pdf', `${f.name} (p. ${parte.de}-${parte.ate})`);
        if (r.erro) { st.style.color='var(--crit)';
          st.textContent = `erro nas páginas ${parte.de}-${parte.ate}: ${r.erro}`; return; }
        juntos.tipo = juntos.tipo || r.tipo;
        for (const [k, v] of Object.entries(r.campos || {})) if (juntos.campos[k] == null) juntos.campos[k] = v;
        for (const ft of (r.fatos || []))
          juntos.fatos.push({ ...ft, pagina: (Number(ft.pagina) || 1) + parte.de - 1 });
        if (r.transcricao) juntos.transcricao += (juntos.transcricao ? '\n\n' : '')
          + `--- páginas ${parte.de} a ${parte.ate} ---\n` + r.transcricao;
        if (r.observacao) juntos.observacao += (juntos.observacao ? ' ' : '') + r.observacao;
      }
      juntos.paginas = paginas;
      j = juntos;
    } else {
      const b64 = await new Promise(res => {
        const r = new FileReader();
        r.onload = () => res(String(r.result).split(',')[1]);
        r.readAsDataURL(f);
      });
      j = await mandarAoLeitor(b64, f.type, f.name);

  } catch (e) { st.style.color='var(--crit)'; st.textContent = 'não consegui ler: ' + e.message; return; }
  if (j.erro) { st.style.color='var(--crit)'; st.textContent = 'erro: ' + j.erro; return; }
  LIDO = j;
  st.style.color='var(--good)';
  st.textContent = 'lido: ' + (j.tipo || 'documento') + (j.paginas ? ` · ${j.paginas} páginas` : '') + ' — confira antes de gravar';
  const campos = Object.entries(j.campos || {});
  alvo.innerHTML = `
    ${j.observacao ? `<p class="nota"><b>Ressalva da leitura:</b> ${esc(j.observacao)}</p>` : ''}
    ${campos.length ? `<h3 style="font-size:13px;margin:10px 0 4px">Campos lidos</h3>
      <table><thead><tr><th style="width:44px">Usar</th><th>Campo</th><th>O que estava escrito</th></tr></thead><tbody>
      ${campos.map(([k,v])=>`<tr><td style="text-align:center"><input type="checkbox" checked data-lk="${esc(k)}"></td>
        <td>${esc(k)}</td><td><b>${esc(String(v))}</b></td></tr>`).join('')}</tbody></table>` : ''}
    ${(j.fatos||[]).length ? `<h3 style="font-size:13px;margin:14px 0 4px">Fatos encontrados</h3>
      <table><thead><tr><th style="width:44px">Usar</th><th>Quando</th><th>O quê</th><th>Trecho / página</th></tr></thead><tbody>
      ${j.fatos.map((x,i)=>`<tr><td style="text-align:center"><input type="checkbox" checked data-lf="${i}"></td>
        <td class="dt">${x.data?br(x.data):'—'}</td><td><b>${esc(x.descricao)}</b></td>
        <td><span class="sub" style="margin:0">${esc(x.trecho||'')}${x.pagina?' · p. '+x.pagina:''}</span></td></tr>`).join('')}
      </tbody></table>` : ''}
    ${campos.length || (j.fatos||[]).length ? `<div style="margin-top:10px;display:flex;gap:8px;align-items:center">
      <button class="btn ok" onclick="gravarLeitura()">Gravar o que está marcado</button>
      <span class="sub" style="margin:0">nada é gravado sem você marcar</span></div>`
      : '<div class="vazio">Não consegui extrair nada legível deste arquivo.</div>'}`;
  input.value = '';

/* ---------- FINANCEIRO PESSOAL DO SÓCIO ----------
   Aba privada. A trava não é o menu: é a regra do banco (dono_id = auth.uid()).
   Ninguém mais do escritório lê estas tabelas. O que atravessa a fronteira é só
   a distribuição — um lançamento de saída do escritório marcado com o seu nome. */
let PESMES = new Date().toISOString().slice(0,7);
let PESEDIT = null;   /* id do lançamento aberto para edição */
let PES = null;
const mesBr = m => { const [a,b]=m.split('-'); return ['','janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'][+b] + ' de ' + a; };
const mesMais = (m,n) => { const [a,b]=m.split('-').map(Number); const d=new Date(a, b-1+n, 1); return d.toISOString().slice(0,7); };
const pct = (a,b) => b>0 ? Math.min(100, Math.round(a/b*100)) : 0;

/* Tabela de amortização. PRICE tem parcela fixa; SAC amortiza sempre igual e a
   parcela cai com o tempo. O saldo devedor é o que sobra depois de cada parcela. */
function tabelaFin(f, aporteExtra){
  const i = Number(f.taxa_mes||0)/100, n = Number(f.parcelas), P = Number(f.valor_financiado);
  const seg = Number(f.seguro_mes||0) + Number(f.taxa_adm||0), extra = Number(aporteExtra||0);
  const linhas = []; let saldo = P;
  const parcPrice = i > 0 ? P*i/(1-Math.pow(1+i,-n)) : P/n;
  for (let k = 1; k <= n && saldo > 0.005; k++){
    const juros = saldo*i;
    let amort = f.sistema === 'SAC' ? P/n : parcPrice - juros;
    if (amort + extra > saldo) amort = saldo - extra > 0 ? saldo - extra : saldo;
    const abate = Math.min(saldo, amort + extra);
    linhas.push({ k, parcela: amort + juros + seg, juros, amort, extra: abate - amort, saldo: saldo - abate });
    saldo -= abate;
  }
  return linhas;
}
/* Enquanto a obra corre, o banco libera aos poucos e você paga só juros sobre o
   que já saiu, mais seguro e taxa. Nada disso abate o saldo: é custo puro. */
function emObra(f, mes){
  if (f.obra_ate) return (mes+'-01') < f.obra_ate;
  /* Sem data de entrega informada: continua em obra enquanto o extrato só trouxer
     parcelas de fase "obra". Melhor assumir o que o banco disse do que inventar prazo. */
  return (PES?.parcelasFin || []).some(x => x.financiamento_id === f.id && x.fase === 'obra');
}
function parcelaLida(f, mes){
  const L = (PES?.parcelasFin || []).filter(x => x.financiamento_id === f.id);
  if (!L.length) return null;
  if (mes) { const exata = L.find(x => String(x.competencia||'').slice(0,7) === mes); if (exata) return exata; }
  return L.slice().sort((a,b) => String(a.competencia).localeCompare(String(b.competencia))).pop();
}
/* O extrato manda. A conta abaixo é só estimativa para o mês que ainda não chegou:
   ela não sabe a correção monetária, que em agosto sozinha valeu R$ 424,23. */
function jurosDeObraEstimado(f){
  const i = Number(f.taxa_mes||0)/100;
  const liberado = Number(f.liberado||0);
  return liberado * i + Number(f.seguro_mes||0) + Number(f.taxa_adm||0);
}
function jurosDeObra(f, mes){
  const lida = parcelaLida(f, mes);
  if (lida && Number(lida.valor_pago)) return Number(lida.valor_pago);
  return jurosDeObraEstimado(f);
}
function mesesDeObra(f, mes){
  if (!f.obra_ate) return 0;
  const [ay,am] = f.primeira.slice(0,7).split('-').map(Number);
  const [by,bm] = mes.split('-').map(Number);
  return Math.max(0, (by-ay)*12 + (bm-am) + 1);
}
function parcelasPagas(f, ate){
  const [ay,am] = f.primeira.slice(0,7).split('-').map(Number);
  const [by,bm] = ate.split('-').map(Number);
  return Math.max(0, Math.min(Number(f.parcelas), (by-ay)*12 + (bm-am) + 1));
}

async function carregarPessoal(){
  const { data:{ user } } = await sb.auth.getUser();
  const uid = user.id;
  const ini = PESMES + '-01';
  const fim = mesMais(PESMES,1) + '-01';
  const [ct, cg, fi, pj, rc, mt, lc, ds] = await Promise.all([
    sb.from('pessoal_conta').select('*').eq('ativo',true).order('nome'),
    sb.from('pessoal_categoria').select('*').eq('ativo',true).order('grupo').order('ordem').order('nome'),
    sb.from('pessoal_financiamento').select('*').eq('ativo',true).order('nome'),
    sb.from('pessoal_projeto').select('*').order('situacao').order('nome'),
    sb.from('pessoal_recorrente').select('*').eq('ativo',true).order('dia'),
    sb.from('pessoal_meta').select('*').order('tipo').order('nome'),
    sb.from('pessoal_lancamento').select('*').gte('data',ini).lt('data',fim).order('data',{ascending:false}),
    sb.from('lancamento').select('id,descricao,valor,vencimento,pagamento,situacao')
      .eq('distribuicao_para', uid).gte('vencimento', ini).lt('vencimento', fim),
  ]);
  /* Saídas do escritório ainda não marcadas: é daqui que a distribuição vira receita sua. */
  const { data: cand } = await sb.from('lancamento')
    .select('id,descricao,valor,vencimento,contraparte,situacao')
    .eq('tipo','saida').is('distribuicao_para', null)
    .gte('vencimento', ini).lt('vencimento', fim).order('vencimento');
  /* Projeto não cabe num mês: o realizado é a soma de tudo, desde o começo. */
  const { data: tp } = await sb.from('pessoal_lancamento').select('projeto_id,valor')
    .not('projeto_id','is',null).limit(5000);
  const { data: fp } = await sb.from('pessoal_fin_parcela').select('*').order('competencia');
  const projTot = {};
  (tp||[]).forEach(l => { projTot[l.projeto_id] = (projTot[l.projeto_id]||0) + Number(l.valor); });
  PES = { uid, contas: ct.data||[], cats: cg.data||[], fins: fi.data||[], projs: pj.data||[],
          recs: rc.data||[], metas: mt.data||[], lancs: lc.data||[], distrib: ds.data||[],
          candidatos: cand||[], parcelasFin: fp||[], __projTot: projTot };
  return PES;
}

function contasPessoal(){
  const L = PES.lancs;
  const distribuicao = PES.distrib.filter(d=>d.situacao!=='cancelado').reduce((a,d)=>a+Number(d.valor),0)
    + L.filter(l=>l.tipo==='entrada').reduce((a,l)=>a+Number(l.valor),0);
  const mesRef = PESMES;
  const parcelasMes = PES.fins.map(f => {
    if (emObra(f, mesRef)) {
      const j = jurosDeObra(f, mesRef);
      return j > 0 ? { f, k: mesesDeObra(f, mesRef), obra: true, linha: { parcela: j, juros: j, amort: 0 } } : null;
    }
    const k = parcelasPagas(f, mesRef);
    if (k < 1 || k > f.parcelas) return null;
    const t = tabelaFin(f);
    return { f, k, linha: t[k-1] };
  }).filter(Boolean);
  const dividas = parcelasMes.reduce((a,x)=>a+x.linha.parcela,0);
  const catDe = id => PES.cats.find(c=>c.id===id);
  const saidas = L.filter(l=>l.tipo==='saida');

  /* Uma saída pertence a UM balde só, nesta ordem. Antes, o que não tinha categoria
     caía em "variáveis" — e uma despesa fixa lançada sem categoria aparecia como
     variável que não existia em lugar nenhum. Agora sem categoria é balde próprio. */
  const balde = l => {
    if (l.meta_id)        return 'guardado';
    if (l.projeto_id)     return 'projeto';
    if (l.financiamento_id) return 'divida';
    const c = catDe(l.categoria_id);
    if (c && c.grupo === 'fixa')     return 'fixa';
    if (c && c.grupo === 'variavel') return 'variavel';
    if (l.origem === 'recorrente')   return 'fixa';
    return 'sem';
  };
  const soma = nome => saidas.filter(l=>balde(l)===nome).reduce((a,l)=>a+Number(l.valor),0);

  /* Fixa do mês = o que já foi lançado + as recorrentes ativas ainda não lançadas.
     Assim, editar o lançamento muda o total; e nada é contado duas vezes. */
  const fixasLancadas = soma('fixa');
  const pendentes = recorrentesDoMes(mesRef).filter(r => !lancamentoDaRecorrente(r));
  const fixas = fixasLancadas + pendentes.reduce((a,r)=>a+Number(r.valor),0);

  const variaveis = soma('variavel');
  const semCategoria = soma('sem');
  const emProjeto = soma('projeto');
  const guardado = soma('guardado');
  const comprometido = dividas + fixas;
  const gastoTotal = saidas.reduce((a,l)=>a+Number(l.valor),0);
  return { distribuicao, dividas, fixas, fixasLancadas, pendentes, comprometido, variaveis,
           semCategoria, emProjeto, guardado, gastoTotal,
           sobra: distribuicao - comprometido - variaveis - semCategoria - emProjeto - guardado,
           parcelasMes };
}
/* Recorrentes que valem no mês: ativas e dentro da janela de início/fim. */
function recorrentesDoMes(mes){
  return PES.recs.filter(r => r.ativo !== false && r.inicio <= mes+'-28' && (!r.fim || r.fim >= mes+'-01'));
}
/* O lançamento gerado por uma recorrente neste mês, se existir. */
function lancamentoDaRecorrente(r){
  return PES.lancs.find(l => l.origem === 'recorrente' && l.descricao === r.descricao);
}

/* ---------- CAPACIDADE DE INVESTIMENTO ----------
   Antes de existir histórico, a pergunta não é "qual o retorno" — é "quanto posso
   arriscar sem furar o caixa". Retorno é medição; capacidade é decisão. */
let INV = null;
async function carregarInvestir(){
  const { data: e } = await sb.from('escritorio').select('id').limit(1).single();
  const { data } = await sb.from('plano_investimento').select('*').maybeSingle();
  INV = data || { escritorio_id: e.id, caixa_atual:0, entrada_media:0, saida_media:0,
    reserva_minima:0, investimento_mes:0, meses_teste:6, ticket_medio:0,
    meses_ate_receber:12, cen_baixo:1, cen_medio:2, cen_alto:4 };
  INV.escritorio_id = e.id;
  return INV;
}
/* Projeta 24 meses. O detalhe cruel da advocacia: o cliente entra hoje e o
   honorário cai um ou dois anos depois — o teste consome caixa antes de devolver. */
function projetar(clientesMes){
  const p = INV, meses = 24, linhas = [];
  let caixa = Number(p.caixa_atual);
  const entradas = [];
  for (let m = 1; m <= meses; m++){
    const investe = m <= Number(p.meses_teste) ? Number(p.investimento_mes) : 0;
    if (investe) entradas[m] = clientesMes;
    const recebeDe = m - Number(p.meses_ate_receber);
    const recebimento = (entradas[recebeDe] || 0) * Number(p.ticket_medio);
    caixa += Number(p.entrada_media) - Number(p.saida_media) - investe + recebimento;
    linhas.push({ m, investe, recebimento, caixa });
  }
  const fundo = linhas.reduce((a,b) => b.caixa < a.caixa ? b : a, linhas[0]);
  const total = Number(p.investimento_mes) * Number(p.meses_teste);
  let acum = 0, payback = null;
  for (const l of linhas){ acum += l.recebimento; if (payback === null && acum >= total) payback = l.m; }
  return { linhas, fundo, total, payback, recebido: acum };
}
async function telaInvestir(){
  await carregarInvestir();
  const p = INV;
  const sobra = Number(p.entrada_media) - Number(p.saida_media);
  const colchao = Number(p.caixa_atual) - Number(p.reserva_minima);
  const tetoMes = sobra + (Number(p.meses_teste) > 0 ? colchao/Number(p.meses_teste) : 0);
  const equilibrio = Number(p.ticket_medio) > 0 ? Number(p.investimento_mes)/Number(p.ticket_medio) : 0;
  const cen = [['pessimista', Number(p.cen_baixo)], ['realista', Number(p.cen_medio)], ['otimista', Number(p.cen_alto)]]
    .map(([nome, q]) => ({ nome, q, r: projetar(q) }));

  app.innerHTML = menu('investir') + `

  <p class="meta">Sem histórico de anúncio não dá para prometer retorno — e quem promete está chutando.

    e quantos clientes o investimento precisa trazer só para empatar.</p>

  <div class="card"><h2>Os números do escritório</h2>
  <p class="meta">Só isto. Não precisa de histórico de tráfego nenhum.</p>
  <div style="padding:0 18px 16px;display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end">
    ${campo('iv-caixa','Caixa hoje', p.caixa_atual)}
    ${campo('iv-ent','Entrada média por mês', p.entrada_media)}
    ${campo('iv-sai','Saída média por mês', p.saida_media)}
    ${campo('iv-res','Reserva que não posso furar', p.reserva_minima)}
    ${campo('iv-tic','Honorário médio por caso', p.ticket_medio)}
    ${campo('iv-rec','Meses até o honorário cair', p.meses_ate_receber, '1')}
    ${campo('iv-inv','Quanto investir por mês', p.investimento_mes)}
    ${campo('iv-mes','Por quantos meses testar', p.meses_teste, '1')}
    <button class="btn ok" onclick="salvarInvestir()">Calcular</button>
  </div>
  <div style="padding:0 18px 16px;display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end">
    <span class="sub" style="margin:0 6px 8px 0">Clientes novos por mês em cada cenário:</span>
    ${campo('iv-b','pessimista', p.cen_baixo, '0.5')}
    ${campo('iv-m','realista', p.cen_medio, '0.5')}
    ${campo('iv-a','otimista', p.cen_alto, '0.5')}
  </div></div>

  <div class="kpis">
    <div class="kpi ${sobra<0?'al':''}"><div class="n">${rs(sobra)}</div><div class="l">sobra por mês hoje</div></div>
    <div class="kpi"><div class="n">${rs(Math.max(0,colchao))}</div><div class="l">acima da reserva</div></div>
    <div class="kpi"><div class="n">${rs(Math.max(0,tetoMes))}</div><div class="l">teto por mês de teste</div></div>
    <div class="kpi ${equilibrio>Number(p.cen_medio)?'al':''}"><div class="n">${equilibrio.toFixed(1)}</div>
      <div class="l">clientes/mês para empatar</div></div>
  </div>

  ${Number(p.investimento_mes) > tetoMes && tetoMes >= 0 ? `<div class="card"><p class="nota" style="color:var(--crit)">
    <b>O investimento pretendido passa do que o caixa aguenta.</b> Investindo ${rs(p.investimento_mes)} por mês
    durante ${p.meses_teste} meses, você fura a reserva de ${rs(p.reserva_minima)} antes do fim do teste.
    O teto, com esses números, é ${rs(Math.max(0,tetoMes))} por mês.</p></div>` : ''}

  <div class="card"><h2>O que precisa acontecer para empatar</h2>
  <p class="meta">Investindo ${rs(p.investimento_mes)} por mês com honorário médio de ${rs(p.ticket_medio)},
    o anúncio precisa trazer <b>${equilibrio.toFixed(1)} cliente(s) por mês</b> só para devolver o que custou.
    Essa é a conta inteira — o resto é opinião sobre se esse número é plausível no seu mercado.</p>
  ${Number(p.meses_ate_receber) > 0 ? `<p class="nota">E há a defasagem: o cliente que o anúncio trouxer neste mês
    só vira dinheiro daqui a ${p.meses_ate_receber} meses. Até lá, o teste é só despesa.</p>` : ''}

async function listarBackups(){
  const alvo = document.getElementById('bklista'); if (!alvo) return;
  const { data, error } = await sb.storage.from('backup').list('', { limit: 120, sortBy: { column:'name', order:'desc' } });
  if (error) return alvo.innerHTML = '<div class="vazio">Não consegui listar: ' + esc(error.message) + '</div>';
  const fs = (data||[]).filter(f => f.name.endsWith('.json'));
  if (!fs.length) return alvo.innerHTML = '<div class="vazio">Nenhuma cópia automática ainda. A primeira sai na próxima madrugada.</div>';
  const mb = b => (Number(b||0)/1048576).toFixed(1).replace('.', ',') + ' MB';
  alvo.innerHTML = `<p class="sub" style="margin:0 0 8px">${fs.length} cópia${fs.length>1?'s':''} guardada${fs.length>1?'s':''}.</p>
    <table><thead><tr><th>Dia</th><th>Tamanho</th><th></th></tr></thead><tbody>
    ${fs.map(f=>`<tr><td class="dt">${br(f.name.replace('.json',''))}</td>
      <td class="proc">${mb(f.metadata?.size)}</td>
      <td><button class="btn" onclick="baixarCopia('${f.name}')">Baixar</button>
          <span class="sub" id="bx${f.name.replace(/\W/g,'')}"></span></td></tr>`).join('')}
    </tbody></table>`;
  aplicarRotulos(alvo);
}
window.baixarCopia = async nome => {
  const st = document.getElementById('bx' + nome.replace(/\W/g,''));
  if (st) st.textContent = 'preparando…';
  const { data, error } = await sb.storage.from('backup').createSignedUrl(nome, 120, { download: 'backup-' + nome });
  if (error) { if (st) st.textContent = 'erro: ' + error.message; return; }
  if (st) st.textContent = '';
  window.open(data.signedUrl, '_blank');
};
const TABELAS_BACKUP = ['escritorio','usuario','cliente','caso','processo','parte','prazo',
  'movimentacao','intimacao','evento','lancamento','honorario','interacao','lead','documento',
  'tese','tese_candidata','precedente','minuta','informativo_rascunho','preferencia',
  'area_atuacao','origem_captacao','categoria_financeira'];
window.baixarBackup = async () => {
  registrarAcao('baixou', 'backup', 'cópia completa baixada pela tela');
  const st = document.getElementById('bk-st');
  st.style.color = 'var(--i3)';
  const pacote = { gerado_em: new Date().toISOString(), sistema: ESC_NOME, tabelas: {} };
  const falhas = [];
  for (const t of TABELAS_BACKUP) {
    st.textContent = 'lendo ' + t + '…';
    const { data, error } = await sb.from(t).select('*').limit(50000);
    if (error) { falhas.push(t + ' (' + error.message + ')'); continue; }
    pacote.tabelas[t] = data || [];
  }
  const total = Object.values(pacote.tabelas).reduce((n, a) => n + a.length, 0);
  pacote.total_registros = total;
  if (falhas.length) pacote.nao_lidas = falhas;
  const nome = 'backup-' + hoje() + '.json';
  const b = new Blob([JSON.stringify(pacote, null, 1)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(b); a.download = nome; a.click();
  URL.revokeObjectURL(a.href);
  st.style.color = 'var(--good)';
  st.textContent = total.toLocaleString('pt-BR') + ' registros salvos em ' + nome +
    (falhas.length ? ' — não consegui ler: ' + falhas.join(', ') : '');
};

let USER_ATUAL = null;
sb.auth.onAuthStateChange((evento, sessao) => {
  if (evento === 'TOKEN_REFRESHED' || evento === 'USER_UPDATED') return;
  const uid = sessao?.user?.id ?? null;
