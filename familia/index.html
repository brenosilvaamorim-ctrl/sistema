<div id="app"><div class="vazio">Carregando…</div></div>
<script>
const SB_URL = "https://wrdfyudabvvpvfcrvvzd.supabase.co";
const SB_KEY = "sb_publishable_EfdAshQdw1P1-lAXtlO9Hw_O8yoP3y5";
const sb = window.supabase.createClient(SB_URL, SB_KEY);
const app = document.getElementById('app');
const br = s => s ? String(s).slice(0,10).split('-').reverse().join('/') : '—';
const hoje = () => new Date().toISOString().slice(0,10);
const dias = d => Math.round((Date.parse(d+'T00:00:00Z') - Date.parse(hoje()+'T00:00:00Z'))/864e5);
const esc = s => String(s??'').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const so = s => String(s??'').replace(/\D/g,'');
const nomeProprio = s => String(s||'').toLowerCase().replace(/(^|\s|')\p{L}/gu, c => c.toUpperCase());
const rs = v => Number(v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
function sit(r){ if(r<0) return ['crit','▲','Vencido']; if(r<=2) return ['crit','▲','Urgente'];
  if(r<=5) return ['ser','●','Atenção']; if(r<=10) return ['warn','●','Próximo']; return ['good','●','No prazo']; }
let USER = null, ESC_CARREGADO = false;

/* ------------------------------------------------------------------ login */

/* =========================================================== A NOSSA CASA
   Área da família: o dinheiro de casa e a obra, fora do sistema do escritório.
   Mesma estrutura, mesma entrada por link de e-mail — mas quem entra aqui não
   vê processo nenhum, e quem entra no escritório não vê nada daqui.
   A regra do banco é uma só: a linha pertence à família, e quem é da família vê. */
let FAM = { id:null, nome:'Nossa casa', uid:null, membros:[] };

const numOuNulo = v => { const t = String(v ?? '').replace(/\./g,'').replace(',', '.').trim();
  return t === '' || isNaN(Number(t)) ? null : Number(t); };

function telaLogin(msg){
  app.innerHTML = `<div class="login">
    <h1 style="font-family:Georgia,'Times New Roman',serif">Nossa casa</h1>
    <p>As contas da casa e a obra. Entre com seu e-mail — enviamos um link de acesso,
      sem senha para decorar.</p>
    <input id="em" type="email" placeholder="seu@email.com" autocomplete="email">
    <button class="btn ok" id="go">Receber link de acesso</button>
    <p id="msg" style="margin-top:12px">${msg||''}</p></div>`;
  document.getElementById('go').onclick = async () => {
    const email = document.getElementById('em').value.trim();
    if (!email) return;
    document.getElementById('msg').textContent = 'Enviando…';
    const { error } = await sb.auth.signInWithOtp({ email,
      options:{ emailRedirectTo: location.origin + location.pathname }});
    document.getElementById('msg').textContent = error ? ('Erro: ' + error.message)
      : 'Link enviado. Confira seu e-mail.';
  };
}

const MENUCASA = [['dinheiro','Dinheiro'],['casa','A casa'],['familia','Quem somos']];
function menu(atual){
  return `<nav>
    <div class="marca"><div class="sigla">🏠</div><div><span class="nome">${esc(FAM.nome)}</span>
      <span class="sub2">contas e obra da família</span></div></div>
    ${MENUCASA.map(([k,r]) => `<a class="${atual===k?'on':''}" href="#/${k}"
      style="padding:11px 13px;text-decoration:none">${r}</a>`).join('')}
    <span class="dir">${esc(USER?.email||'')} · <a onclick="sb.auth.signOut().then(()=>location.reload())">sair</a></span></nav>`;
}
function rodape(){
  return `<footer><b>${esc(FAM.nome)}</b> · área da família.
    Separada do sistema do escritório: aqui não há processo, cliente nem prazo, e nada daqui
    aparece lá. Cada lançamento guarda quem o fez.</footer>`;
}
const erro = m => app.innerHTML = menu('') + '<main><div class="card"><div class="vazio">Erro ao carregar: '+esc(m)+'</div></div></main>';

async function carregarFamilia(){
  const { data:{ user } } = await sb.auth.getUser();
  FAM.uid = user.id;
  /* Gruda o login no convite, se for o primeiro acesso desta pessoa. */
  const { data: fid } = await sb.rpc('entrar_na_familia');
  const [f, m] = await Promise.all([
    sb.from('familia').select('*').limit(1).maybeSingle(),
    sb.from('familia_membro').select('*').order('criado_em'),
  ]);
  if (f.data) { FAM.id = f.data.id; FAM.nome = f.data.nome || 'Nossa casa'; }
  else if (fid) FAM.id = fid;
  FAM.membros = m.data || [];
  return FAM;

async function carregarPdfLib(){
  if (window.PDFLib) return window.PDFLib;
  await new Promise((ok, err) => {
    const s = document.createElement('script');
    s.src = 'https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js';
    s.onload = ok; s.onerror = () => err(new Error('não consegui carregar o divisor de PDF'));
    document.head.appendChild(s);
  });
  return window.PDFLib;
}
async function fatiarPdf(file, porBloco){
  const { PDFDocument } = await carregarPdfLib();
  const doc = await PDFDocument.load(await file.arrayBuffer(), { ignoreEncryption: true });
  const n = doc.getPageCount();
  const partes = [];
  for (let i = 0; i < n; i += porBloco) {
    const novo = await PDFDocument.create();
    const idx = [];
    for (let k = 0; k < porBloco && i + k < n; k++) idx.push(i + k);
    const pgs = await novo.copyPages(doc, idx);
    pgs.forEach(pg => novo.addPage(pg));
    partes.push({ b64: await novo.saveAsBase64(), de: i + 1, ate: i + idx.length });
  }
  return { paginas: n, partes };
}

/* ---------- FINANCEIRO PESSOAL DO SÓCIO ----------
   Aba privada. A trava não é o menu: é a regra do banco (dono_id = auth.uid()).
   Ninguém mais do escritório lê estas tabelas. O que atravessa a fronteira é só
   a distribuição — um lançamento de saída do escritório marcado com o seu nome. */
let PESMES = new Date().toISOString().slice(0,7);
let PESEDIT = null;   /* id do lançamento aberto para edição */
let PES = null;
const mesBr = m => { const [a,b]=m.split('-'); return ['','janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'][+b] + ' de ' + a; };
const mesMais = (m,n) => { const [a,b]=m.split('-').map(Number); const d=new Date(a, b-1+n, 1); return d.toISOString().slice(0,7); };
const pct = (a,b) => b>0 ? Math.min(100, Math.round(a/b*100)) : 0;

/* Tabela de amortização. PRICE tem parcela fixa; SAC amortiza sempre igual e a
   parcela cai com o tempo. O saldo devedor é o que sobra depois de cada parcela. */
function tabelaFin(f, aporteExtra){
  const i = Number(f.taxa_mes||0)/100, n = Number(f.parcelas), P = Number(f.valor_financiado);
  const seg = Number(f.seguro_mes||0) + Number(f.taxa_adm||0), extra = Number(aporteExtra||0);
  const linhas = []; let saldo = P;
  const parcPrice = i > 0 ? P*i/(1-Math.pow(1+i,-n)) : P/n;
  for (let k = 1; k <= n && saldo > 0.005; k++){
    const juros = saldo*i;
    let amort = f.sistema === 'SAC' ? P/n : parcPrice - juros;
    if (amort + extra > saldo) amort = saldo - extra > 0 ? saldo - extra : saldo;
    const abate = Math.min(saldo, amort + extra);
    linhas.push({ k, parcela: amort + juros + seg, juros, amort, extra: abate - amort, saldo: saldo - abate });
    saldo -= abate;
  }
  return linhas;
}
/* Enquanto a obra corre, o banco libera aos poucos e você paga só juros sobre o
   que já saiu, mais seguro e taxa. Nada disso abate o saldo: é custo puro. */
function emObra(f, mes){
  if (f.obra_ate) return (mes+'-01') < f.obra_ate;
  /* Sem data de entrega informada: continua em obra enquanto o extrato só trouxer
     parcelas de fase "obra". Melhor assumir o que o banco disse do que inventar prazo. */
  return (PES?.parcelasFin || []).some(x => x.financiamento_id === f.id && x.fase === 'obra');
}
function parcelaLida(f, mes){
  const L = (PES?.parcelasFin || []).filter(x => x.financiamento_id === f.id);
  if (!L.length) return null;
  if (mes) { const exata = L.find(x => String(x.competencia||'').slice(0,7) === mes); if (exata) return exata; }
  return L.slice().sort((a,b) => String(a.competencia).localeCompare(String(b.competencia))).pop();
}
/* O extrato manda. A conta abaixo é só estimativa para o mês que ainda não chegou:
   ela não sabe a correção monetária, que em agosto sozinha valeu R$ 424,23. */
function jurosDeObraEstimado(f){
  const i = Number(f.taxa_mes||0)/100;
  const liberado = Number(f.liberado||0);
  return liberado * i + Number(f.seguro_mes||0) + Number(f.taxa_adm||0);
}
function jurosDeObra(f, mes){
  const lida = parcelaLida(f, mes);
  if (lida && Number(lida.valor_pago)) return Number(lida.valor_pago);
  return jurosDeObraEstimado(f);
}
function mesesDeObra(f, mes){
  if (!f.obra_ate) return 0;
  const [ay,am] = f.primeira.slice(0,7).split('-').map(Number);
  const [by,bm] = mes.split('-').map(Number);
  return Math.max(0, (by-ay)*12 + (bm-am) + 1);
}
function parcelasPagas(f, ate){
  const [ay,am] = f.primeira.slice(0,7).split('-').map(Number);
  const [by,bm] = ate.split('-').map(Number);
  return Math.max(0, Math.min(Number(f.parcelas), (by-ay)*12 + (bm-am) + 1));
}

    .not('projeto_id','is',null).limit(5000);

          recs: rc.data||[], metas: mt.data||[], lancs: lc.data||[], distrib: ds.data||[],

function contasPessoal(){
  const L = PES.lancs;
  const distribuicao = PES.distrib.filter(d=>d.situacao!=='cancelado').reduce((a,d)=>a+Number(d.valor),0)
    + L.filter(l=>l.tipo==='entrada').reduce((a,l)=>a+Number(l.valor),0);
  const mesRef = PESMES;
  const parcelasMes = PES.fins.map(f => {
    if (emObra(f, mesRef)) {
      const j = jurosDeObra(f, mesRef);
      return j > 0 ? { f, k: mesesDeObra(f, mesRef), obra: true, linha: { parcela: j, juros: j, amort: 0 } } : null;
    }
    const k = parcelasPagas(f, mesRef);
    if (k < 1 || k > f.parcelas) return null;
    const t = tabelaFin(f);
    return { f, k, linha: t[k-1] };
  }).filter(Boolean);
  const dividas = parcelasMes.reduce((a,x)=>a+x.linha.parcela,0);
  const catDe = id => PES.cats.find(c=>c.id===id);
  const saidas = L.filter(l=>l.tipo==='saida');

  /* Uma saída pertence a UM balde só, nesta ordem. Antes, o que não tinha categoria
     caía em "variáveis" — e uma despesa fixa lançada sem categoria aparecia como
     variável que não existia em lugar nenhum. Agora sem categoria é balde próprio. */
  const balde = l => {
    if (l.meta_id)        return 'guardado';
    if (l.projeto_id)     return 'projeto';
    if (l.financiamento_id) return 'divida';
    const c = catDe(l.categoria_id);
    if (c && c.grupo === 'fixa')     return 'fixa';
    if (c && c.grupo === 'variavel') return 'variavel';
    if (l.origem === 'recorrente')   return 'fixa';
    return 'sem';
  };
  const soma = nome => saidas.filter(l=>balde(l)===nome).reduce((a,l)=>a+Number(l.valor),0);

  /* Fixa do mês = o que já foi lançado + as recorrentes ativas ainda não lançadas.
     Assim, editar o lançamento muda o total; e nada é contado duas vezes. */
  const fixasLancadas = soma('fixa');
  const pendentes = recorrentesDoMes(mesRef).filter(r => !lancamentoDaRecorrente(r));
  const fixas = fixasLancadas + pendentes.reduce((a,r)=>a+Number(r.valor),0);

  const variaveis = soma('variavel');
  const semCategoria = soma('sem');
  const emProjeto = soma('projeto');
  const guardado = soma('guardado');
  const comprometido = dividas + fixas;
  const gastoTotal = saidas.reduce((a,l)=>a+Number(l.valor),0);
  return { distribuicao, dividas, fixas, fixasLancadas, pendentes, comprometido, variaveis,
           semCategoria, emProjeto, guardado, gastoTotal,
           sobra: distribuicao - comprometido - variaveis - semCategoria - emProjeto - guardado,
           parcelasMes };
}
/* Recorrentes que valem no mês: ativas e dentro da janela de início/fim. */
function recorrentesDoMes(mes){
  return PES.recs.filter(r => r.ativo !== false && r.inicio <= mes+'-28' && (!r.fim || r.fim >= mes+'-01'));
}
/* O lançamento gerado por uma recorrente neste mês, se existir. */
function lancamentoDaRecorrente(r){
  return PES.lancs.find(l => l.origem === 'recorrente' && l.descricao === r.descricao);
}


/* ============================================================ EXTRATOS
   Ler extrato bancário e fatura de cartão, separar entrada de saída, e só
   então — depois de você conferir linha a linha — virar lançamento.

   A regra de ouro deste bloco: NADA entra na sua conta sozinho. O leitor
   devolve o que está escrito no arquivo; o que decide é você, na tela. Foi
   assim que o financiamento da Caixa entrou certo, e é o único jeito de o
   sistema não passar a inventar número. */

let EXT = null, EXTMARCA = new Set(), EXTCAT = {}, EXTRATOS = [];

/* Impressão digital de um movimento: mesma data, mesmo valor, mesma descrição
   reduzida ao essencial. Serve para AVISAR que a linha já foi lançada — nunca
   para bloquear, porque duas compras iguais no mesmo dia acontecem. */
const digital = (data, valor, desc) =>
  String(data) + '|' + Number(valor).toFixed(2) + '|' +
  String(desc||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'')
    .replace(/[^a-z0-9]/g,'').slice(0,28);

/* Preço do Sonnet 5 em 04/09/2026 e câmbio do dia. Se qualquer um dos dois mudar,
   é aqui que se corrige — em um lugar só. */
const PRECO_ENTRADA = 2, PRECO_SAIDA = 10, DOLAR = 5.10;
function custoLeitura(uso){
  const usd = (Number(uso.entrada||0)/1e6)*PRECO_ENTRADA + (Number(uso.saida||0)/1e6)*PRECO_SAIDA;
  return 'US$ ' + usd.toFixed(4) + ' (cerca de ' + rs(usd * DOLAR) + ')';
}
async function mandarAoLeitorExtrato(b64, mime, nome){
  const { data: { session } } = await sb.auth.getSession();
  const cats = (PES?.cats || []).filter(c=>c.ativo!==false).map(c=>c.nome);
  const r = await fetch(SB_URL + '/functions/v1/ler-extrato', {
    method: 'POST',
    headers: { 'content-type': 'application/json', apikey: SB_KEY,
               Authorization: 'Bearer ' + session.access_token },
    body: JSON.stringify({ arquivo: b64, mime, nome, categorias: cats }),
  });
  return r.json();
}

window.lerExtrato = async (input) => {
  const f = input.files?.[0]; if (!f) return;
  const st = document.getElementById('ex-st');
  const ehPdf = /pdf/i.test(f.type) || /\.pdf$/i.test(f.name);
  if (!ehPdf && f.size > 6*1024*1024) { st.style.color='var(--crit)';
    return st.textContent = 'foto grande demais (máx. 6 MB). Reduza a imagem.'; }
  if (f.size > 60*1024*1024) { st.style.color='var(--crit)';
    return st.textContent = 'arquivo acima de 60 MB. Divida em duas partes.'; }
  st.style.color='var(--i3)'; st.textContent = 'lendo o arquivo…';

  try {
    let doc = null, linhas = [], obs = [], descartadas = 0;
    const uso = { entrada: 0, saida: 0 };
    if (ehPdf && f.size > 3*1024*1024) {
      const { paginas, partes } = await fatiarPdf(f, 10);
      for (let i = 0; i < partes.length; i++) {
        const p = partes[i];
        st.textContent = `lendo páginas ${p.de} a ${p.ate} de ${paginas}…`;
        const r = await mandarAoLeitorExtrato(p.b64, 'application/pdf', `${f.name} (p. ${p.de}-${p.ate})`);
        if (r.erro) { st.style.color='var(--crit)';
          return st.textContent = `erro nas páginas ${p.de}-${p.ate}: ${r.erro}`; }
        doc = doc || r.documento;
        if (r.documento?.total_fatura && !doc.total_fatura) doc.total_fatura = r.documento.total_fatura;
        if (r.documento?.saldo_final) doc.saldo_final = r.documento.saldo_final;
        linhas = linhas.concat(r.lancamentos || []);
        descartadas += Number(r.descartadas || 0);
        uso.entrada += Number(r.uso?.entrada || 0); uso.saida += Number(r.uso?.saida || 0);
        if (r.observacao) obs.push(`p. ${p.de}-${p.ate}: ${r.observacao}`);
      }
    } else {
      const b64 = await new Promise(res => {
        const rd = new FileReader();
        rd.onload = () => res(String(rd.result).split(',')[1]);
        rd.readAsDataURL(f);
      });
      st.textContent = 'lendo…';
      const r = await mandarAoLeitorExtrato(b64, f.type || 'application/pdf', f.name);
      if (r.erro) { st.style.color='var(--crit)'; return st.textContent = 'erro: ' + r.erro; }
      doc = r.documento; linhas = r.lancamentos || [];
      descartadas = Number(r.descartadas || 0);
      uso.entrada = Number(r.uso?.entrada || 0); uso.saida = Number(r.uso?.saida || 0);
      if (r.observacao) obs.push(r.observacao);
    }

    if (!linhas.length) { st.style.color='var(--crit)';
      return st.textContent = 'não encontrei nenhuma linha de movimento neste arquivo.'; }

    st.textContent = 'guardando o arquivo…';
    /* O arquivo fica guardado para você poder voltar e comparar. */
    const reg = (await sb.from('pessoal_extrato').insert({
      dono_id: PES.uid, familia_id: PES.fam, arquivo_nome: f.name, tipo: doc?.tipo || 'extrato',
      banco: doc?.banco || null, conta: doc?.conta || null,
      periodo_ini: doc?.periodo_inicio || null, periodo_fim: doc?.periodo_fim || null,
      saldo_final: doc?.saldo_final ?? null, total_fatura: doc?.total_fatura ?? null,
      vencimento: doc?.vencimento || null,
      linhas, observacao: obs.join(' · ') || null,
    }).select('id').maybeSingle()).data;

    if (reg) {
      const caminho = `${PES.fam}/${reg.id}/${Date.now()}-${f.name.replace(/[^A-Za-z0-9._-]/g,'-').slice(-70)}`;
      const up = await sb.storage.from('financeiro').upload(caminho, f, { upsert:false });
      if (!up.error) await sb.from('pessoal_extrato').update({ arquivo_path: caminho }).eq('id', reg.id);
    }
    st.textContent = '';
    telaExtrato(reg?.id, { doc, linhas, obs: obs.join(' · '), descartadas, arquivo: f.name, uso });
  } catch (e) {
    st.style.color='var(--crit)'; st.textContent = 'erro: ' + (e.message || e);
  }
};

window.marcarLinha = (i, el) => { if (el.checked) EXTMARCA.add(i); else EXTMARCA.delete(i); pintarResumoExt(); };
window.catLinha    = (i, v) => { EXTCAT[i] = v || null; };
window.marcarTodas = (quais) => {
  EXT.linhas.forEach((l, i) => {
    const limpa = !EXT.jaLancado[i] && !EXT.choque[i];
    const cabe = quais === 'tudo' ? limpa
               : quais === 'saidas'   ? (l.tipo === 'saida'   && limpa)
               : quais === 'entradas' ? (l.tipo === 'entrada' && limpa) : false;
    if (cabe) EXTMARCA.add(i);
  });
  telaExtrato(EXT.id, EXT.bruto, true);
};
window.desmarcarTodas = () => { EXTMARCA.clear(); telaExtrato(EXT.id, EXT.bruto, true); };

function pintarResumoExt(){
  const alvo = document.getElementById('ex-resumo'); if (!alvo || !EXT) return;
  const m = [...EXTMARCA].map(i => EXT.linhas[i]).filter(Boolean);
  const ent = m.filter(l=>l.tipo==='entrada').reduce((a,l)=>a+Number(l.valor),0);
  const sai = m.filter(l=>l.tipo==='saida').reduce((a,l)=>a+Number(l.valor),0);
  alvo.innerHTML = `<b>${m.length}</b> linha(s) marcada(s) · entradas ${rs(ent)} · saídas ${rs(sai)}`;
}

window.importarExtrato = async () => {
  if (!EXTMARCA.size) return alert('Marque as linhas que você quer lançar.');
  const st = document.getElementById('ex-imp');
  st.style.color='var(--i3)'; st.textContent = 'lançando…';
  const catId = nome => (PES.cats.find(c=>c.nome===nome) || {}).id || null;
  const novos = [...EXTMARCA].map(i => {
    const l = EXT.linhas[i]; if (!l) return null;
    return { dono_id: PES.uid, familia_id: PES.fam, data: l.data, tipo: l.tipo, valor: l.valor,
             descricao: l.descricao,
             categoria_id: EXTCAT[i] !== undefined ? EXTCAT[i] : catId(l.categoria_sugerida),
             situacao: 'pago', origem: 'extrato', extrato_id: EXT.id || null,
             hash_origem: digital(l.data, l.valor, l.descricao) };
  }).filter(Boolean);
  const { error } = await sb.from('pessoal_lancamento').insert(novos);
  if (error) { st.style.color='var(--crit)'; return st.textContent = 'erro: ' + error.message; }
  if (EXT.id) await sb.from('pessoal_extrato').update({ situacao:'importado' }).eq('id', EXT.id);
  st.style.color='var(--ok)';
  st.textContent = `${novos.length} lançamento(s) entraram. Abrindo o mês…`;
  const primeiro = novos.map(n=>n.data).sort()[0];
  if (primeiro) PESMES = primeiro.slice(0,7);
  setTimeout(()=>{ location.hash = '#/dinheiro'; }, 900);
};

window.desfazerImportacao = async (id) => {
  const n = (await sb.from('pessoal_lancamento').select('id').eq('extrato_id', id)).data?.length || 0;
  if (!n) return alert('Nenhum lançamento deste arquivo para desfazer.');
  if (!confirm(`Apagar os ${n} lançamento(s) que vieram deste arquivo?\n\nO arquivo continua guardado.`)) return;
  await sb.from('pessoal_lancamento').delete().eq('extrato_id', id);
  await sb.from('pessoal_extrato').update({ situacao:'lido' }).eq('id', id);
  abrirExtrato(id);
};

async function telaExtrato(id, bruto, manterMarcas){
  if (!PES) await carregarPessoal();
  if (!manterMarcas) { EXTMARCA = new Set(); EXTCAT = {}; }
  const linhas = bruto.linhas || [];

  /* O que já está lançado no seu financeiro, para avisar antes de duplicar. */
  const datas = linhas.map(l=>l.data).sort();
  const ja = datas.length ? (await sb.from('pessoal_lancamento')
      .select('hash_origem,data,valor,descricao')
      .gte('data', datas[0]).lte('data', datas[datas.length-1])).data || [] : [];
  const vistos = new Set(ja.map(x => x.hash_origem || digital(x.data, x.valor, x.descricao)));
  const jaLancado = linhas.map(l => vistos.has(digital(l.data, l.valor, l.descricao)));

  /* ------------------------------------------------------------------
     O painel já conta sozinho duas coisas que TAMBÉM aparecem no extrato:
     a parcela do financiamento (que vem da tabela de parcelas, não de
     lançamento) e as despesas recorrentes ativas ainda não lançadas.
     Importar essas linhas conta a mesma despesa duas vezes. Aqui elas são
     reconhecidas pelo valor e avisadas — e ficam de fora do "marcar tudo". */
  const perto = (a,b) => b > 0 && Math.abs(a-b) / b < 0.02;
  const choque = linhas.map(l => {
    if (l.tipo !== 'saida') return null;
    const mes = String(l.data).slice(0,7);
    for (const f of (PES.fins || [])) {
      const v = emObra(f, mes) ? jurosDeObra(f, mes)
              : (tabelaFin(f)[parcelasPagas(f, mes) - 1] || {}).parcela;
      if (v && perto(Number(l.valor), Number(v)))
        return { tipo:'financiamento', nome: f.nome, valor: Number(v) };
    }
    for (const r of (PES.recs || [])) {
      if (r.ativo === false) continue;
      if (perto(Number(l.valor), Number(r.valor)))
        return { tipo:'recorrente', nome: r.descricao, valor: Number(r.valor) };
    }
    return null;
  });

  EXT = { id, linhas, bruto, jaLancado, choque };
  const d = bruto.doc || {};
  const ent = linhas.filter(l=>l.tipo==='entrada').reduce((a,l)=>a+Number(l.valor),0);
  const sai = linhas.filter(l=>l.tipo==='saida').reduce((a,l)=>a+Number(l.valor),0);
  const dup = jaLancado.filter(Boolean).length;
  const nChoque = choque.filter(Boolean).length;
  const ehFatura = d.tipo === 'fatura';
  const cats = PES.cats.filter(c=>c.ativo!==false);

  app.innerHTML = menu('dinheiro') + `
  <main>
  <p class="meta"><a class="lnk" href="#/dinheiro">← voltar para o Dinheiro</a></p>
  <h1>${ehFatura ? 'Fatura de cartão' : 'Extrato'} — conferência</h1>
  <p class="meta">${esc(bruto.arquivo || '')}${d.banco?' · '+esc(d.banco):''}${d.conta?' · '+esc(d.conta):''}
    ${d.periodo_inicio?' · '+br(d.periodo_inicio)+' a '+br(d.periodo_fim||d.periodo_inicio):''}</p>

  <div class="aviso"><b>Nada foi lançado ainda.</b> O sistema leu o arquivo e separou as linhas;
    quem decide o que entra na sua conta é você. Marque o que for lançar, ajuste a categoria,
    e só então clique em importar.</div>

  <div class="kpis">
    <div class="kpi"><div class="n">${linhas.length}</div><div class="l">linhas lidas</div></div>
    <div class="kpi"><div class="n">${rs(ent)}</div><div class="l">créditos</div></div>
    <div class="kpi"><div class="n">${rs(sai)}</div><div class="l">débitos</div></div>
    <div class="kpi ${dup?'al':''}"><div class="n">${dup}</div><div class="l">já parecem lançados</div></div>
    ${nChoque?`<div class="kpi al"><div class="n">${nChoque}</div><div class="l">o painel já conta sozinho</div></div>`:''}
  </div>

  ${nChoque?`<div class="aviso" style="border-color:var(--crit)">
    <b>${nChoque} linha(s) o painel já conta por outro caminho</b> — a parcela do financiamento vem da tabela
    de parcelas, e as despesas recorrentes entram sozinhas todo mês. Elas ficam <b>fora</b> do "marcar tudo";
    se você marcar mesmo assim, a despesa vai contar em dobro.</div>`:''}

  ${ehFatura ? `<div class="aviso" style="border-color:var(--warn)">
    <b>Isto é uma fatura de cartão.</b> As linhas abaixo são as compras. Quando a fatura for paga na
    conta corrente, o extrato do banco vai trazer <i>um</i> débito com o total
    ${d.total_fatura ? 'de <b>'+rs(d.total_fatura)+'</b> ' : ''}— é o mesmo dinheiro.
    Lance as compras <b>ou</b> o pagamento da fatura, nunca os dois, senão a despesa conta em dobro.</div>` : ''}

  ${bruto.uso && bruto.uso.entrada ? `<div class="card">
    <div style="padding:12px 18px" class="sub">Esta leitura custou
      <b>${custoLeitura(bruto.uso)}</b> — ${bruto.uso.entrada.toLocaleString('pt-BR')} tokens de entrada e
      ${bruto.uso.saida.toLocaleString('pt-BR')} de saída, ao preço do Sonnet 5
      (US$ 2 e US$ 10 por milhão), convertidos a R$ 5,10 por dólar.
      É o valor real desta chamada, não estimativa.</div></div>` : ''}
  ${bruto.obs ? `<div class="card" style="border-left:3px solid var(--warn)">
    <div style="padding:12px 18px" class="sub"><b>O que o leitor não conseguiu ler:</b> ${esc(bruto.obs)}</div></div>` : ''}
  ${bruto.descartadas ? `<div class="card" style="border-left:3px solid var(--crit)">
    <div style="padding:12px 18px" class="sub"><b>${bruto.descartadas} linha(s) foram descartadas</b> por virem
      sem data, sem valor ou sem descrição legível. Confira o arquivo original: elas não estão na lista abaixo.</div></div>` : ''}

  <div class="card"><div style="padding:12px 18px;display:flex;gap:8px;flex-wrap:wrap;align-items:center">
    <button class="btn" onclick="marcarTodas('tudo')">Marcar tudo</button>
    <button class="btn" onclick="marcarTodas('saidas')">Só os débitos</button>
    <button class="btn" onclick="marcarTodas('entradas')">Só os créditos</button>
    <button class="btn" onclick="desmarcarTodas()">Desmarcar</button>
    <span class="sub" id="ex-resumo" style="margin:0"></span>
    <span style="flex:1"></span>
    ${bruto.path ? `<button class="btn" onclick="verArquivoExtrato('${esc(bruto.path)}')">Ver o arquivo</button>` : ''}
    ${bruto.situacao === 'importado' ? `<button class="btn" onclick="desfazerImportacao('${id}')">Desfazer a importação</button>` : ''}
    <button class="btn ok" onclick="importarExtrato()">Importar os marcados</button>
    <span class="sub" id="ex-imp" style="margin:0"></span>
  </div></div>

  ${bruto.situacao === 'importado' ? `<div class="aviso" style="border-color:var(--ok)">
    Este arquivo já foi importado uma vez. Marcar de novo cria lançamentos repetidos —
    use <i>Desfazer a importação</i> antes, se quiser refazer.</div>` : ''}

  <div class="card"><h2>Linha a linha</h2>
    <table><thead><tr><th style="width:40px"></th><th style="width:100px">Data</th><th>Descrição</th>
      <th style="width:120px">Valor</th><th style="width:90px">Tipo</th><th style="width:210px">Categoria</th></tr></thead>
    <tbody>${linhas.map((l,i)=>`<tr${jaLancado[i]?' style="background:var(--f2)"':''}>
      <td style="text-align:center"><input type="checkbox" ${EXTMARCA.has(i)?'checked':''}
        onchange="marcarLinha(${i}, this)"></td>
      <td class="dt">${br(l.data)}</td>
      <td>${esc(l.descricao)}
        ${l.parcela?`<span class="sub">parcela ${l.parcela}${l.total_parcelas?' de '+l.total_parcelas:''}</span>`:''}
        ${jaLancado[i]?'<span class="sub" style="color:var(--warn)">▲ já existe um lançamento igual neste dia e valor</span>':''}
        ${choque[i]?`<span class="sub" style="color:var(--crit)">▲ o painel já conta isto sozinho:
          ${choque[i].tipo==='financiamento' ? 'parcela do financiamento <b>'+esc(choque[i].nome)+'</b>'
            : 'despesa recorrente <b>'+esc(choque[i].nome)+'</b>'} (${rs(choque[i].valor)}).
          Lançar aqui conta a mesma despesa duas vezes.</span>`:''}</td>
      <td class="dt" style="text-align:right;white-space:nowrap">${rs(l.valor)}</td>
      <td><span class="pill ${l.tipo==='entrada'?'good':'ser'}">${l.tipo==='entrada'?'crédito':'débito'}</span></td>
      <td><select onchange="catLinha(${i}, this.value)" style="font-size:12px;width:100%">
        <option value="">— sem categoria —</option>
        ${cats.map(c=>`<option value="${c.id}" ${c.nome===l.categoria_sugerida?'selected':''}>${esc(c.nome)}</option>`).join('')}
      </select></td></tr>`).join('')}
    </tbody></table></div>
  </main>` + rodape();
  linhas.forEach((l,i)=>{ if (EXTCAT[i] === undefined) {
    const c = cats.find(x=>x.nome===l.categoria_sugerida); if (c) EXTCAT[i] = c.id; } });
  pintarResumoExt();
}

async function telaPessoal(){
  await carregarPessoal();
  const c = contasPessoal();
  const compPct = pct(c.comprometido, c.distribuicao);
  const catDe = id => PES.cats.find(x=>x.id===id);
  const gastoCat = id => PES.lancs.filter(l=>l.tipo==='saida'&&l.categoria_id===id).reduce((a,l)=>a+Number(l.valor),0);
  const gastoProj = id => PES.lancs.filter(l=>l.projeto_id===id).reduce((a,l)=>a+Number(l.valor),0);
  const vars = PES.cats.filter(x=>x.grupo==='variavel' && x.tipo!=='entrada');

    ${EXTRATOS.length ? `<table><thead><tr><th>Arquivo</th><th>Tipo</th><th>Período</th>
      <th>Linhas</th><th>Situação</th><th></th></tr></thead><tbody>
      ${EXTRATOS.map(x=>`<tr>

  <div class="bars">

      <div class="kpis" style="margin:10px 0 6px">
        <div class="kpi"><div class="n">${rs(obra ? jurosDeObra(f, PESMES) : (atual?atual.parcela:0))}</div>

window.salvarEntrega = async function(id){
  const v = document.getElementById('ob-'+id).value || null;

  if (error) { alert('Não deu para guardar: ' + error.message); return; }

window.simularAmortizacao = function(id){
  const f = PES.fins.find(x=>x.id===id);
  const extra = Number(document.getElementById('ap-'+id).value||0);
  const st = document.getElementById('sim-'+id);
  if (!extra) { st.textContent = 'informe o valor extra'; return; }
  const semExtra = tabelaFin(f), comExtra = tabelaFin(f, extra);
  const jurosA = semExtra.reduce((a,x)=>a+x.juros,0), jurosB = comExtra.reduce((a,x)=>a+x.juros,0);
  st.innerHTML = `<b>${semExtra.length - comExtra.length} parcelas a menos</b> — quita em
    ${comExtra.length} em vez de ${semExtra.length}, e economiza ${rs(jurosA-jurosB)} de juros.`;
};

/* ================================================================== A CASA
   Reforma, mobília e tudo o que ainda falta na casa nova.
   Três perguntas mandam aqui, e elas são diferentes entre si:
     quanto custa       → comparar propostas lado a lado, não só o número;
     quanto já saiu     → o que foi pago de verdade, por item e por ambiente;
     até quando se paga → parcela e mês da última, porque é isso que aperta.
   O que já foi contratado ou comprado aparece em verde: bate o olho e você vê
   o que já está resolvido e o que ainda está no ar. */
const SITAMB = { a_fazer:'a fazer', andamento:'em andamento', pronto:'pronto' };
const SITITEM = { a_orcar:'a orçar', orcado:'orçado', contratado:'contratado',
                  comprado:'comprado', entregue:'entregue', pronto:'pronto', cancelado:'cancelado' };
const TIPOITEM = { servico:'serviço', movel:'móvel', material:'material', eletro:'eletro', outro:'outro' };
const FORMAS = ['à vista','cartão de crédito','boleto','pix','financiado','a combinar'];
/* Fechado = decidido e com dinheiro comprometido. É o que fica verde. */
const FECHADO = ['contratado','comprado','entregue','pronto'];
const fechado = i => FECHADO.includes(i.situacao);
const corItem = s => ['pronto','entregue'].includes(s) ? 'good'
  : s === 'cancelado' ? 'cin' : s === 'a_orcar' ? 'warn' : s === 'orcado' ? 'serie' : 'good';
const VERDE = 'background:rgba(12,163,12,.10);border-left:3px solid var(--good)';

let CASA = { amb:[], itens:[], orc:[], gastos:{}, lancs:{} }, CASAFILTRO = null;

const addMeses = (d, n) => {
  if (!d) return null;
  const [y,m,dd] = String(d).slice(0,10).split('-').map(Number);
  const t = new Date(Date.UTC(y, m - 1 + n, 1));
  const ultimo = new Date(Date.UTC(t.getUTCFullYear(), t.getUTCMonth()+1, 0)).getUTCDate();
  t.setUTCDate(Math.min(dd, ultimo));
  return t.toISOString().slice(0,10);
};
/* O total de uma proposta parcelada é entrada + parcelas — e quase nunca é
   igual ao "valor à vista". Comparar sem isso é comparar coisas diferentes. */
const totalOrc = o => (o.parcelas && o.valor_parcela)
  ? Number(o.entrada || 0) + Number(o.parcelas) * Number(o.valor_parcela)
  : Number(o.valor || 0);
const ultimaOrc = o => (o.primeira_parcela && o.parcelas) ? addMeses(o.primeira_parcela, Number(o.parcelas) - 1) : null;
const parcelaTexto = x => (x.parcelas && x.valor_parcela)
  ? `${x.parcelas}× ${rs(x.valor_parcela)}` : 'à vista';

async function carregarCasa(){
  const [am, it, or_, ga] = await Promise.all([
    sb.from('casa_ambiente').select('*').order('ordem').order('nome'),
    sb.from('casa_item').select('*').order('criado_em'),
    sb.from('casa_orcamento').select('*').order('valor'),
    sb.from('pessoal_lancamento').select('id,casa_item_id,valor,data,descricao')
      .not('casa_item_id','is',null).order('data',{ascending:false}).limit(5000),
  ]);
  const gastos = {}, lancs = {};
  (ga.data||[]).forEach(l => {
    gastos[l.casa_item_id] = (gastos[l.casa_item_id]||0) + Number(l.valor);
    (lancs[l.casa_item_id] = lancs[l.casa_item_id] || []).push(l);
  });
  CASA = { amb: am.data||[], itens: it.data||[], orc: or_.data||[], gastos, lancs };
  return CASA;
}
const orcDoItem = id => CASA.orc.filter(o => o.item_id === id);
const gastoItem  = id => CASA.gastos[id] || 0;
function previstoItem(i){
  const e = orcDoItem(i.id).find(o => o.escolhido);
  if (e) return totalOrc(e);
  if (i.valor_previsto != null) return Number(i.valor_previsto);
  const l = orcDoItem(i.id).map(totalOrc).sort((a,b)=>a-b);
  return l.length ? l[0] : 0;
}
const itensDoAmb = id => CASA.itens.filter(i => i.ambiente_id === id && i.situacao !== 'cancelado');
const atrasadoItem = i => i.entrega_prevista && !i.entregue_em
  && !['entregue','pronto','cancelado'].includes(i.situacao) && i.entrega_prevista < hoje();
/* Parcelamento ainda correndo: é o que compromete os meses à frente. */
const pagando = i => i.parcelas && i.valor_parcela && i.ultima_parcela && i.ultima_parcela >= hoje();

window.novoAmbiente = async (ev) => {
  ev.preventDefault();
  const f = ev.target, nome = (f.elements.nome.value||'').trim(); if (!nome) return;
  const st = document.getElementById('ca-st'); st.textContent = 'gravando…';

    familia_id: FAM.id, nome, ordem: (CASA.amb.length + 1) * 10 });

};

  if (!confirm('Apagar o ambiente "' + a.nome + '"?')) return;
  await sb.from('casa_ambiente').delete().eq('id', id);
  telaCasa();
};
window.novoItemCasa = async (ev) => {
  ev.preventDefault();
  const f = ev.target, v = n => (f.elements[n]?.value || '').trim() || null;

/* ------------------------------------------------------------ orçamentos */
window.novoOrcamento = async (ev, itemId) => {
  ev.preventDefault();
  const f = ev.target, v = n => (f.elements[n]?.value || '').trim() || null;
  const st = document.getElementById('or-st');
  st.style.color = 'var(--i3)'; st.textContent = 'gravando…';
  const arq = f.elements['arquivo']?.files?.[0] || null;
  if (arq && arq.size > 15 * 1024 * 1024) { st.style.color='var(--crit)';
    return st.textContent = 'arquivo grande demais (máximo 15 MB)'; }
  const { data, error } = await sb.from('casa_orcamento').insert({
    familia_id: FAM.id, item_id: itemId, fornecedor: v('fornecedor'), contato: v('contato'),
    valor: numOuNulo(v('valor')) || 0, entrada: numOuNulo(v('entrada')),
    parcelas: v('parcelas') ? Number(v('parcelas')) : null,
    valor_parcela: numOuNulo(v('valor_parcela')),
    primeira_parcela: v('primeira_parcela'), forma: v('forma'),
    prazo_dias: v('prazo') ? Number(v('prazo')) : null,
    validade: v('validade'), condicoes: v('condicoes'), link: v('link') }).select('id').single();
  if (error) { st.style.color='var(--crit)'; st.textContent = 'erro: ' + error.message; return; }
  if (arq) {
    st.textContent = 'enviando ' + arq.name + '…';
    const caminho = `${FAM.id}/orcamentos/${data.id}-${arq.name.replace(/[^A-Za-z0-9._-]/g,'-').slice(-70)}`;
    const up = await sb.storage.from('casa').upload(caminho, arq, { upsert:true });
    if (up.error) { st.style.color='var(--crit)';
      st.textContent = 'o orçamento foi gravado, mas o arquivo falhou: ' + up.error.message; return; }
    await sb.from('casa_orcamento').update({ arquivo_path: caminho, arquivo_nome: arq.name }).eq('id', data.id);
  }
  /* Pediu orçamento: o item deixa de estar "a orçar". */
  const i = CASA.itens.find(x => x.id === itemId);
  if (i && i.situacao === 'a_orcar') await sb.from('casa_item').update({ situacao:'orcado' }).eq('id', itemId);
  telaItemCasa(itemId);
};
window.verOrcamento = async (id) => {
  const o = CASA.orc.find(x => x.id === id); if (!o?.arquivo_path) return;
  const { data, error } = await sb.storage.from('casa').createSignedUrl(o.arquivo_path, 120);
  if (error) return alert('Não consegui abrir: ' + error.message);
  window.open(data.signedUrl, '_blank', 'noreferrer');
};
/* Escolher é fechar: o item vira contrato e herda as condições da proposta —
   inclusive em quantas vezes e quando cai a última parcela. */
window.escolherOrc = async (id, itemId) => {
  const o = CASA.orc.find(x => x.id === id); if (!o) return;
  await sb.from('casa_orcamento').update({ escolhido:false }).eq('item_id', itemId);
  await sb.from('casa_orcamento').update({ escolhido:true }).eq('id', id);
  const i = CASA.itens.find(x => x.id === itemId);
  const campos = {
    valor_previsto: totalOrc(o), fornecedor: o.fornecedor, contato: o.contato,
    orcamento_id: o.id, parcelas: o.parcelas, valor_parcela: o.valor_parcela,
    entrada: o.entrada, primeira_parcela: o.primeira_parcela,
    ultima_parcela: ultimaOrc(o), forma: o.forma,
    contratado_em: i?.contratado_em || hoje(),
    atualizado_em: new Date().toISOString(),
  };
  if (i && ['a_orcar','orcado'].includes(i.situacao)) campos.situacao = 'contratado';
  if (o.prazo_dias && i && !i.entrega_prevista) campos.entrega_prevista = addDias(hoje(), Number(o.prazo_dias));
  await sb.from('casa_item').update(campos).eq('id', itemId);
  telaItemCasa(itemId);
};
const addDias = (d, n) => new Date(Date.parse(d + 'T00:00:00Z') + n*864e5).toISOString().slice(0,10);
window.desfazerEscolha = async (itemId) => {
  if (!confirm('Desfazer a escolha? O item volta a "orçado" e as condições de pagamento saem.')) return;
  await sb.from('casa_orcamento').update({ escolhido:false }).eq('item_id', itemId);
  await sb.from('casa_item').update({ situacao:'orcado', orcamento_id:null, parcelas:null,
    valor_parcela:null, entrada:null, primeira_parcela:null, ultima_parcela:null,
    forma:null, contratado_em:null, atualizado_em: new Date().toISOString() }).eq('id', itemId);
  telaItemCasa(itemId);
};
window.tirarOrc = async (id, itemId) => {

window.gastoCasa = async (ev, itemId) => {

window.tirarGastoCasa = async (id, itemId) => {

  telaItemCasa(itemId);
};
window.filtrarAmb = (id) => { CASAFILTRO = (CASAFILTRO === id ? null : id); telaCasa(); };

/* ------------------------------------------------- um item por dentro */
async function telaItemCasa(id){
  await carregarCasa();
  const i = CASA.itens.find(x => x.id === id);
  if (!i) return erro('item não encontrado');
  const orcs = orcDoItem(id);
  const amb = CASA.amb.find(a => a.id === i.ambiente_id);
  const esc_ = orcs.find(o => o.escolhido);
  const pago = gastoItem(id), prev = previstoItem(i);
  const menor = orcs.length ? Math.min(...orcs.map(totalOrc)) : null;
  const menorParc = orcs.filter(o => o.valor_parcela).length
    ? Math.min(...orcs.filter(o => o.valor_parcela).map(o => Number(o.valor_parcela))) : null;
  const pagamentos = (CASA.lancs[id] || []);

  const cartao = o => {
    const tot = totalOrc(o), ult = ultimaOrc(o);
    const eMenor = menor !== null && Math.abs(tot - menor) < 0.005;
    const eMenorParc = menorParc !== null && o.valor_parcela && Math.abs(Number(o.valor_parcela) - menorParc) < 0.005;
    return `<div class="card" style="margin:0;${o.escolhido ? VERDE : ''}">
      <div style="padding:13px 15px">
        <div style="display:flex;justify-content:space-between;gap:8px;align-items:flex-start">
          <div><b style="font-size:15px">${esc(o.fornecedor)}</b>
            ${o.contato ? `<span class="sub">${esc(o.contato)}</span>` : ''}
            ${o.link ? `<span class="sub"><a class="lnk" href="${esc(o.link)}" target="_blank" rel="noreferrer">página</a></span>` : ''}</div>
          ${o.escolhido ? '<span class="pill good">escolhido</span>' : ''}
        </div>
        <div style="font-size:22px;margin:9px 0 2px"><b>${rs(tot)}</b></div>
        <div class="sub" style="margin:0">${parcelaTexto(o)}${
          o.entrada ? ' · entrada ' + rs(o.entrada) : ''}${
          o.valor && Math.abs(Number(o.valor) - tot) > 0.005 ? ' · à vista ' + rs(o.valor) : ''}</div>
        <div style="margin:8px 0;display:flex;gap:5px;flex-wrap:wrap">
          ${eMenor ? '<span class="pill good">menor total</span>' : ''}
          ${eMenorParc && orcs.length > 1 ? '<span class="pill serie">menor parcela</span>' : ''}
          ${o.validade && o.validade < hoje() ? '<span class="pill crit">proposta vencida</span>' : ''}
        </div>
        <table style="font-size:12.6px"><tbody>
          <tr><td class="sub" style="margin:0;padding:4px 0;border:0">entrega</td><td style="padding:4px 0;border:0;text-align:right">${o.prazo_dias ? o.prazo_dias + ' dias' : '—'}</td></tr>
          <tr><td class="sub" style="margin:0;padding:4px 0;border:0">última parcela</td><td style="padding:4px 0;border:0;text-align:right">${ult ? br(ult) : '—'}</td></tr>
          <tr><td class="sub" style="margin:0;padding:4px 0;border:0">forma</td><td style="padding:4px 0;border:0;text-align:right">${esc(o.forma||'—')}</td></tr>
          <tr><td class="sub" style="margin:0;padding:4px 0;border:0">vale até</td><td style="padding:4px 0;border:0;text-align:right">${o.validade ? br(o.validade) : '—'}</td></tr>
        </tbody></table>
        ${o.condicoes ? `<div class="sub" style="margin-top:6px">${esc(o.condicoes)}</div>` : ''}
        <div style="margin-top:10px;display:flex;gap:6px;flex-wrap:wrap">
          ${o.arquivo_path ? `<button class="btn" style="font-size:11.6px" onclick="verOrcamento('${o.id}')">Ver o papel</button>`
            : '<span class="sub" style="margin:0;align-self:center">sem anexo</span>'}
          ${o.escolhido ? `<button class="btn" style="font-size:11.6px" onclick="desfazerEscolha('${i.id}')">Desfazer</button>`
            : `<button class="btn ok" style="font-size:11.6px" onclick="escolherOrc('${o.id}','${i.id}')">Escolher esta</button>`}
          <button class="btn" style="font-size:11.6px" onclick="tirarOrc('${o.id}','${i.id}')">×</button>
        </div></div></div>`;
  };

  app.innerHTML = menu('casa') + `
  <main><p class="meta"><a class="lnk" href="#/casa">← voltar para a casa</a></p>
  <h1>${esc(i.nome)} <span class="pill ${corItem(i.situacao)}" style="vertical-align:middle">${SITITEM[i.situacao]||i.situacao}</span></h1>
  <p class="meta">${TIPOITEM[i.tipo]||i.tipo}${amb ? ' · ' + esc(amb.nome) : ' · a casa toda'}${
    i.descricao ? ' · ' + esc(i.descricao) : ''}</p>

  <div class="kpis">
    <div class="kpi" ${fechado(i)?`style="${VERDE}"`:''}><div class="n" style="font-size:19px">${prev ? rs(prev) : '—'}</div><div class="l">${esc_ ? 'fechado por' : 'previsto'}</div></div>
    <div class="kpi"><div class="n" style="font-size:19px">${pago ? rs(pago) : '—'}</div><div class="l">já pago</div></div>
    <div class="kpi"><div class="n" style="font-size:19px">${i.valor_parcela ? rs(i.valor_parcela) : '—'}</div><div class="l">${i.parcelas ? 'parcela (de ' + i.parcelas + ')' : 'sem parcelamento'}</div></div>
    <div class="kpi ${atrasadoItem(i)?'al':''}"><div class="n" style="font-size:19px">${i.ultima_parcela ? br(i.ultima_parcela) : (i.entrega_prevista ? br(i.entrega_prevista) : '—')}</div><div class="l">${i.ultima_parcela ? 'última parcela' : 'entrega prevista'}</div></div>
  </div>

  <div class="card"><h2>As propostas ${orcs.length ? `<span class="sub" style="display:inline;margin:0">(${orcs.length})</span>` : ''}</h2>
    <p class="nota">Lado a lado, pelo que importa: o <b>total</b> (entrada + parcelas, não o preço de vitrine),
      a parcela, o prazo de entrega e até quando a proposta vale. A escolhida fica verde.</p>
    ${orcs.length ? `<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(255px,1fr));gap:12px;padding:0 18px 16px">
      ${orcs.slice().sort((a,b)=>totalOrc(a)-totalOrc(b)).map(cartao).join('')}</div>

  await carregarCasa();
  const vivos = CASA.itens.filter(i => i.situacao !== 'cancelado');
  const prevTotal = vivos.reduce((a,i)=>a+previstoItem(i),0);
  const gastoTotal = vivos.reduce((a,i)=>a+gastoItem(i.id),0);
  const atrasados = vivos.filter(atrasadoItem);
  const aOrcar = vivos.filter(i => i.situacao === 'a_orcar');
  const emParcelas = vivos.filter(pagando);
  const mensal = emParcelas.reduce((a,i)=>a+Number(i.valor_parcela),0);
  const ultimaGeral = emParcelas.map(i=>i.ultima_parcela).sort().pop();
  const lista = CASAFILTRO ? CASA.itens.filter(i => i.ambiente_id === CASAFILTRO) : CASA.itens;
  const compras = vivos.filter(i => (i.comprar_ate || i.entrega_prevista) && !['entregue','pronto'].includes(i.situacao))
    .sort((a,b) => String(a.entrega_prevista||a.comprar_ate).localeCompare(String(b.entrega_prevista||b.comprar_ate)));

  const linha = i => {
    const prev = previstoItem(i), gas = gastoItem(i.id), orcs = orcDoItem(i.id);

    return `<tr style="${fechado(i)?VERDE:''}${i.situacao==='cancelado'?';opacity:.45':''}">

    <form onsubmit="novoAmbiente(event)" style="display:flex;gap:8px;flex-wrap:wrap;padding:10px 18px 18px;align-items:flex-end">
      <input name="nome" required placeholder="Ex.: cozinha, quarto do casal, área externa" style="flex:1;min-width:260px">

      <label style="display:flex;flex-direction:column;gap:3px;min-width:140px">
        <span class="sub" style="margin:0">Tipo</span>
        <select name="tipo">${Object.entries(TIPOITEM).map(([k,r])=>`<option value="${k}">${r}</option>`).join('')}</select></label>
      <label style="display:flex;flex-direction:column;gap:3px;min-width:180px">
        <span class="sub" style="margin:0">Ambiente</span>
        <select name="ambiente"><option value="">— a casa toda —</option>

      <label style="display:flex;flex-direction:column;gap:3px;width:130px">

        <input name="previsto" inputmode="decimal" placeholder="se já tiver"></label>
      <label style="display:flex;flex-direction:column;gap:3px;min-width:150px">
        <span class="sub" style="margin:0">Comprar até</span>
        <input name="comprar_ate" type="date"></label>

/* ------------------------------------------------------------------ rota */
async function rota(){
  const { data:{ user } } = await sb.auth.getUser();
  if (!user) return telaLogin();
  USER = user;
  if (!FAM.id) {
    try { await carregarFamilia(); } catch(e) { return erro(e.message); }
    if (!FAM.id) return app.innerHTML = `<div class="login"><h1>Sem acesso</h1>
      <p>O e-mail <b>${esc(user.email)}</b> ainda não faz parte desta área da família.
      Peça a quem administra para cadastrar este endereço em <i>Quem somos</i>.</p>
      <button class="btn" onclick="sb.auth.signOut().then(()=>location.reload())">Sair</button></div>`;
  }
  const h = location.hash || '#/dinheiro';
  if (h.startsWith('#/item/'))    return telaItemCasa(h.slice('#/item/'.length));
  if (h.startsWith('#/casa'))     return telaCasa();
  if (h.startsWith('#/familia'))  return telaFamiliaTela();
  if (h.startsWith('#/extrato'))  return telaPessoal();
  return telaPessoal();
}
window.addEventListener('hashchange', rota);
sb.auth.onAuthStateChange((e) => { if (e === 'SIGNED_IN' || e === 'SIGNED_OUT') rota(); });
rota();

</script></body></html>
