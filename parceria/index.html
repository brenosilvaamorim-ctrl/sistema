/* Fechar o lead é criar cliente e caso — os mesmos que o escritório vê, já carimbados.
   O lead guarda o caso_id, para a Captação e o quadro contarem a mesma história. */
window.leadViraCaso = async (id) => {
  const l = LEADS.find(x => x.id === id);
  if (!l) return;
  if (!confirm(`Abrir um caso para ${l.nome}? O cliente é criado junto, se ainda não existir.`)) return;
  try {
    let cliente_id = null;
    const achado = await sb.from('cliente').select('id').eq('parceria_id', PAR.id)
      .ilike('nome', l.nome).limit(1);
    if (achado.data?.length) cliente_id = achado.data[0].id;
    else {
      const novo = await sb.from('cliente').insert({
        parceria_id: PAR.id, nome: l.nome, telefone: l.telefone, email: l.email,
      }).select('id').single();
      if (novo.error) throw novo.error;
      cliente_id = novo.data.id;
    }
    const caso = await sb.from('caso').insert({
      parceria_id: PAR.id, cliente_id, titulo: l.nome,
      area_id: l.area_id || null, area: nomeArea(l.area_id) || l.area || null,
    }).select('id').single();
    if (caso.error) throw caso.error;
    const up = await sb.from('lead').update({ etapa: 'fechado', caso_id: caso.data.id,
      atualizado_em: new Date().toISOString() }).eq('id', id);
    if (up.error) throw up.error;
    /* A ficha do atendimento passa a ser a ficha DO CASO. Sem isto ela ficava presa ao
       lead: não aparecia na tela do caso, o papel anexado não chegava lá, e "levar as
       respostas para os fatos" nunca tinha caso a que levar. É o que o escritório faz
       na mesma hora (index.html, ao fechar o lead). */
    const fi = await sb.from('ficha')
      .update({ caso_id: caso.data.id, cliente_id, atualizado_em: new Date().toISOString() })
      .eq('lead_id', id);
    if (fi.error) alert('O caso foi aberto, mas a ficha não ficou amarrada a ele: '
      + fi.error.message + '\n\nAvise o Dr. Breno.');
    location.hash = '#/caso/' + caso.data.id;
  } catch (e) { alert('Não deu certo: ' + e.message); }
};

const MAX_FICHA = 15 * 1024 * 1024;

/* O papel do atendimento presencial. Ele não pendura no lead direto: pendura numa
   FICHA, que é onde o relato mora. É o mesmo caminho do escritório, e por isso o
   papel anexado aqui aparece lá, no caso, quando o lead fechar.

   A ficha vem do `garantirFicha`, a mesma que o botão "Ficha" usa — se já houver
   uma do atendimento, o papel entra NELA. Antes esta função criava uma ficha vazia
   própria, e um atendimento com papel e questionário acabava com duas. */
async function subirPapel(leadId, arquivo){
  const fichaId = await garantirFicha(leadId);
  if (!fichaId) return { erro: 'não foi possível abrir a ficha deste atendimento' };
  return await subirPapelNaFicha(fichaId, arquivo);
}

async function subirPapelNaFicha(fichaId, arquivo){
  if (arquivo.size > MAX_FICHA)
    return { erro: 'O arquivo tem ' + (arquivo.size/1048576).toFixed(1) + ' MB. O limite é 15 MB.' };
  const limpo = arquivo.name.normalize('NFD').replace(/[\u0300-\u036f]/g,'')
    .replace(/[^A-Za-z0-9._-]/g,'-').slice(-80);
  /* A pasta é o escritório; a segunda, a ficha — é a segunda que a regra do banco/57
     confere. Mudar a ordem aqui tranca o arquivo lá. */
  const caminho = `${PAR.esc}/${fichaId}/${Date.now()}-${limpo}`;
  const up = await sb.storage.from('fichas').upload(caminho, arquivo, { upsert: false });
  if (up.error) return { erro: up.error.message };
  const { error } = await sb.from('ficha').update({ arquivo_path: caminho,
    arquivo_nome: arquivo.name, arquivo_em: new Date().toISOString(),
    atualizado_em: new Date().toISOString() }).eq('id', fichaId);
  return error ? { erro: error.message } : { caminho };
}

window.novoLead = async (ev, abrirAFicha) => {
  ev.preventDefault();
  /* Pelo "Anotar e abrir a ficha" o clique vem do botão, não do formulário. */
  const f = ev.target.closest('form'), st = document.getElementById('lead-st');
  if (!(f.elements['nome']?.value || '').trim()) { f.elements['nome'].focus(); return; }
  const v = n => (f.elements[n]?.value || '').trim() || null;
  const arq = f.elements['arquivo']?.files?.[0] || null;
  st.style.color = 'var(--i2)'; st.textContent = 'anotando…';
  const { data, error } = await sb.from('lead').insert({
    parceria_id: PAR.id, nome: v('nome'), telefone: v('telefone'), email: v('email'),
    area_id: v('area_id'), area: nomeArea(v('area_id')) || null,
    origem_id: v('origem_id'), origem2_id: v('origem2_id'),
    resumo: v('resumo'), proximo_contato: v('proximo_contato'), etapa: 'novo',
  }).select('id').single();
  if (error) { st.style.color = 'var(--crit)'; st.textContent = error.message; return; }
  if (arq) {
    st.textContent = 'enviando ' + arq.name + '…';
    const r = await subirPapel(data.id, arq);
    if (r.erro) { st.style.color = 'var(--crit)';
      st.textContent = 'o lead foi anotado, mas o papel não subiu: ' + r.erro; return; }
  }
  if (abrirAFicha) return abrirFicha(data.id);
  telaCaptacao();
};

/* O prazo nasce SUGERIDO: quem o leu foi o robô, lendo a publicação do Diário.
   Confirmar é ato de advogado, e é o que o torna um compromisso do escritório —
   por isso a tela separa o que ainda não foi conferido do que já foi. */
async function telaPrazos(){
  const [pz, cs, pr] = await Promise.all([
    sb.from('prazo').select('*').eq('parceria_id', PAR.id).order('data_fatal'),
    sb.from('caso').select('id,titulo').eq('parceria_id', PAR.id),
    sb.from('processo').select('id,numero_cnj').eq('parceria_id', PAR.id),
  ]);
  if (pz.error) return erro(pz.error.message);
  const todos = pz.data || [], casos = cs.data || [], procs = pr.data || [];
  const tituloCaso = id => casos.find(c => c.id === id)?.titulo || '';
  const numero = id => procs.find(p => p.id === id)?.numero_cnj || '';

  const vivos = todos.filter(z => !['cumprido','cancelado'].includes(z.situacao));
  const cumpridos = todos.filter(z => z.situacao === 'cumprido');
  const sugeridos = vivos.filter(z => z.situacao === 'sugerido');
  const vencidos = vivos.filter(z => dias(z.data_fatal) < 0);
  const emCinco = vivos.filter(z => { const d = dias(z.data_fatal); return d >= 0 && d <= 5; });

  const linha = z => { const d = dias(z.data_fatal), [cor, rot] = sit(d);
    return `<tr>
    <td class="dt" style="width:150px"><b>${br(z.data_fatal)}</b>
      <span class="sub">${d < 0 ? Math.abs(d) + ' dias atrás' : (d === 0 ? 'hoje' : 'em ' + d + ' dias')}</span></td>
    <td>${esc(z.descricao)}
      <span class="sub">${z.dias ? z.dias + (z.dias_uteis ? ' dias úteis' : ' dias corridos') : ''}${
        z.caso_id ? ' · ' + esc(tituloCaso(z.caso_id)) : ''}${
        z.processo_id ? ' · ' + esc(numero(z.processo_id)) : ''}</span></td>
    <td style="width:120px"><span class="pill ${cor}">${rot}</span></td>
    <td style="width:150px">${z.situacao === 'sugerido'
      ? '<span class="pill warn">a conferir</span>'
      : '<span class="pill good">confirmado</span>'}
      ${z.confianca != null ? `<span class="sub">leitura ${Math.round(z.confianca*100)}%</span>` : ''}</td>
    <td style="width:230px;white-space:nowrap">
      <input type="date" value="${String(z.data_fatal).slice(0,10)}" style="font-size:11.6px"
        onchange="mudarFatal('${z.id}', this.value)" title="corrigir a data">
      ${z.situacao === 'sugerido'
        ? `<button class="btn ok" style="font-size:11.4px;padding:4px 8px" onclick="confirmarPrazo('${z.id}')">Confirmar</button>`
        : ''}
      <button class="btn" style="font-size:11.4px;padding:4px 8px" onclick="cumprirPrazo('${z.id}')">Cumprido</button>
    </td></tr>`; };

  const bloco = (titulo, lista, nota) => lista.length ? `<div class="card"><h2>${titulo} — ${lista.length}</h2>
    ${nota ? `<p class="nota">${nota}</p>` : ''}
    <table><tbody>${lista.map(linha).join('')}</tbody></table></div>` : '';

  const adiante = vivos.filter(z => dias(z.data_fatal) > 5);

  app.innerHTML = menu('prazos') + `<main>
  <h1>Prazos</h1>
  <p class="meta">Os prazos dos casos em parceria. O robô lê a publicação do Diário e sugere a
    data; <b>conferir é ato de advogado</b> — enquanto não for confirmado, o prazo fica marcado
    como a conferir. A data pode ser corrigida aqui, e a correção vale nos dois lados.</p>
  <div class="kpis">
    <div class="kpi ${vencidos.length?'al':''}"><div class="n">${vencidos.length}</div><div class="l">vencidos</div></div>
    <div class="kpi ${emCinco.length?'al':''}"><div class="n">${emCinco.length}</div><div class="l">vencem em até 5 dias</div></div>
    <div class="kpi ${sugeridos.length?'al':''}"><div class="n">${sugeridos.length}</div><div class="l">esperando conferência</div></div>
    <div class="kpi"><div class="n">${cumpridos.length}</div><div class="l">cumpridos</div></div>
  </div>
  ${bloco('Vencidos', vencidos, 'Vencido não some sozinho: ou foi cumprido e falta marcar, ou precisa de providência hoje.')}
  ${bloco('Até cinco dias', emCinco)}
  ${bloco('Mais à frente', adiante)}
  ${vivos.length ? '' : `<div class="card">${vazio('Nenhum prazo em aberto.')}</div>`}
  ${cumpridos.length ? `<div class="card"><h2>Cumpridos — ${cumpridos.length}</h2>
    <table><tbody>${cumpridos.slice(0,25).map(z=>`<tr>
      <td class="dt" style="width:150px">${br(z.data_fatal)}</td>
      <td>${esc(z.descricao)}<span class="sub">${z.caso_id ? esc(tituloCaso(z.caso_id)) : ''}</span></td>
      <td style="width:150px"><span class="pill good">cumprido ${br(z.cumprido_em)}</span></td>
    </tr>`).join('')}</tbody></table></div>` : ''}
  </main>` + rodape();
}

/* -------------------------------------------------------------- andamento */

/* Dois relógios, como no escritório: há quanto tempo o processo tramita e há
   quanto tempo está parado. O segundo é o que importa — processo calado por
   muito tempo é processo que alguém precisa cutucar. Quem está aguardando uma
   data já marcada não entra na conta: não está parado, está esperando. */
const humanoDias = n => n == null ? '—'
  : n < 30 ? n + ' dias'
  : n < 365 ? Math.round(n/30) + ' meses'
  : (Math.floor(n/365) + ' a ' + (Math.round((n%365)/30) ? Math.round((n%365)/30) + ' m' : '')).trim();

async function telaAndamento(){
  const pr = await sb.from('processo').select('*').eq('parceria_id', PAR.id).order('numero_cnj');
  if (pr.error) return erro(pr.error.message);
  const procs = pr.data || [];
  const ids = procs.map(p => p.id);
  const [mv, cs] = await Promise.all([
    ids.length ? sb.from('movimentacao').select('processo_id,data,descricao')
      .in('processo_id', ids).order('data', { ascending: false }).limit(1500) : { data: [] },
    sb.from('caso').select('id,titulo').eq('parceria_id', PAR.id),
  ]);
  const movs = mv.data || [], casos = cs.data || [];
  const tituloCaso = id => casos.find(c => c.id === id)?.titulo || '';
  const ultima = {};
  for (const m of movs) if (!ultima[m.processo_id]) ultima[m.processo_id] = m;

  const paradoHa = p => { const u = ultima[p.id];
    return u ? Math.round((Date.now() - Date.parse(u.data)) / 864e5) : null; };
  const emTramite = p => p.data_ajuizamento
    ? Math.round((Date.now() - Date.parse(p.data_ajuizamento + 'T00:00:00Z')) / 864e5) : null;
  const esperando = p => p.aguardando_ate && dias(p.aguardando_ate) >= 0;

  const lista = procs.slice().sort((a,b) => (paradoHa(b) ?? -1) - (paradoHa(a) ?? -1));
  const vivos = lista.filter(p => !esperando(p));
  const limite = p => p.fase === 'execucao' ? 30 : 90;
  const pedem = vivos.filter(p => (paradoHa(p) ?? 0) > limite(p) * 2).length;
  const conferir = vivos.filter(p => { const d = paradoHa(p) ?? 0;
    return d > limite(p) && d <= limite(p) * 2; }).length;
  const idades = procs.map(emTramite).filter(x => x != null);
  const medio = idades.length ? Math.round(idades.reduce((a,b)=>a+b,0)/idades.length) : null;

  app.innerHTML = menu('andamento') + `<main>
  <h1>Andamento</h1>
  <p class="meta">Dois relógios: há quanto tempo cada processo tramita, e há quanto tempo está
    parado. Na fase de conhecimento a demora costuma ser do juízo — 90 dias pedem conferência,
    180 pedem impulso. Na execução o relógio é mais curto. Quem está aguardando uma data já
    marcada sai desta conta: não está parado, está esperando.</p>
  <div class="kpis">
    <div class="kpi ${pedem?'al':''}"><div class="n">${pedem}</div><div class="l">pedindo providência</div></div>
    <div class="kpi"><div class="n">${conferir}</div><div class="l">merecendo conferência</div></div>
    <div class="kpi"><div class="n">${procs.length}</div><div class="l">processos</div></div>
    <div class="kpi"><div class="n">${humanoDias(medio)}</div><div class="l">tempo médio em trâmite</div></div>
  </div>
  <div class="card"><h2>Os mais parados primeiro</h2>
    <p class="nota">A fase muda a régua, e por isso dá para corrigi-la aqui. "Aguardando até"
      tira o processo da lista enquanto a data não chega — serve para audiência já marcada.</p>
    ${lista.length ? `<table><thead><tr><th>Processo</th><th>Caso</th><th>Fase</th>
      <th>Parado há</th><th>Em trâmite</th><th>Último andamento</th><th>Aguardando até</th></tr></thead>
    <tbody>${lista.map(p => { const d = paradoHa(p); const esp = esperando(p);
      const cor = esp ? 'cin' : d == null ? 'cin' : d > limite(p)*2 ? 'crit' : d > limite(p) ? 'ser' : 'good';
      return `<tr>
      <td><a class="lnk" href="#/processo/${p.id}">${esc(p.numero_formatado || p.numero_cnj)}</a>
        <span class="sub">${esc(p.tribunal_sigla || '')}${p.orgao ? ' · ' + esc(p.orgao) : ''}</span></td>
      <td>${p.caso_id ? `<a class="lnk" href="#/caso/${p.caso_id}">${esc(tituloCaso(p.caso_id))}</a>` : '—'}</td>
      <td style="width:150px"><select onchange="mudarFase('${p.id}', this.value)" style="font-size:11.6px">
        <option value="conhecimento" ${p.fase==='conhecimento'?'selected':''}>conhecimento</option>
        <option value="recursal" ${p.fase==='recursal'?'selected':''}>recursal</option>
        <option value="execucao" ${p.fase==='execucao'?'selected':''}>execução</option>
        <option value="arquivado" ${p.fase==='arquivado'?'selected':''}>arquivado</option></select></td>
      <td style="width:130px"><span class="pill ${cor}">${esp ? 'aguardando' : humanoDias(d)}</span></td>
      <td class="dt" style="width:110px">${humanoDias(emTramite(p))}</td>
      <td class="sub" style="margin:0">${ultima[p.id]
        ? br(ultima[p.id].data) + ' — ' + esc(String(ultima[p.id].descricao || '').slice(0,70))
        : 'nenhum andamento lido ainda'}</td>
      <td style="width:150px"><input type="date" style="font-size:11.6px"
        value="${p.aguardando_ate ? String(p.aguardando_ate).slice(0,10) : ''}"
        onchange="mudarEspera('${p.id}', this.value)"></td>
      </tr>`; }).join('')}</tbody></table>`
    : vazio('Nenhum processo cadastrado na parceria.')}
  </div></main>` + rodape();
}

/* ------------------------------------------------------------- mensageria */

/* Quem está há mais tempo sem notícia nossa, e de quem há novidade para contar.
   A conta de "novidades" é do banco: andamento relevante que chegou depois do
   último contato. Serve para o cliente não descobrir pelo processo antes de nós. */
async function telaMensageria(){
  const cs = await sb.from('caso').select('id').eq('parceria_id', PAR.id);
  if (cs.error) return erro(cs.error.message);
  const ids = (cs.data || []).map(c => c.id);
  /* A visão não tem parceria_id, e deixar a RLS filtrar sozinha mostraria o
     escritório inteiro para quem é do escritório. O filtro vai na consulta. */
  const mp = ids.length
    ? await sb.from('mensageria_painel').select('*').in('caso_id', ids)
    : { data: [] };
  if (mp.error) return erro(mp.error.message);
  const linhas = (mp.data || []).slice().sort((a,b) =>
    (b.novidades - a.novidades) ||
    String(a.ultimo_contato || '').localeCompare(String(b.ultimo_contato || '')));

  const semContato = linhas.filter(l => !l.ultimo_contato).length;
  const comNovidade = linhas.filter(l => l.novidades > 0).length;
  const velhos = linhas.filter(l => l.ultimo_contato &&

/* `interacao.usuario_id` aponta para `usuario`, e a parceira não está lá: fica em
   branco, como nos outros campos de autoria. Quem anotou está na auditoria. */
window.anotarContato = async (ev, casoId) => {
  ev.preventDefault();
  const f = ev.target;
  const descricao = (f.elements['descricao']?.value || '').trim();
  if (!descricao) return;
  const { error } = await sb.from('interacao').insert({
    caso_id: casoId, tipo: 'contato', descricao, data: new Date().toISOString(),
  });
  if (error) return alert('Não deu certo: ' + error.message);
  telaMensageria();
};

/* ---------------------------------------------------------------- números */

/* Os números da parceria, contados só sobre o que é dela. Nenhum número do
   escritório entra aqui — nem para comparar: comparar seria misturar. */
function barras(titulo, pares){
  const total = Math.max(1, ...pares.map(([,n]) => n));
  return `<div class="card"><h2>${esc(titulo)}</h2>
    <div style="padding:0 18px 16px">${pares.length ? pares.map(([rot, n]) => `<div class="barra">
      <span class="rot">${esc(rot)}</span>
      <span class="tr"><i style="width:${Math.round(n/total*100)}%"></i></span>
      <span class="n">${n}</span></div>`).join('') : '<div class="sub" style="margin:0">nada ainda</div>'}</div></div>`;
}

/* De onde vem o atendimento da parceria, e o que cada origem rende. Quem tem duas
   origens — o canal e quem indicou — conta nas duas linhas, e por isso a coluna não
   soma o total: somar obrigaria a escolher uma das duas respostas, que é justamente
   o que o segundo campo existe para não fazer.

   Aqui não há a coluna "em parceria" que o escritório tem: desta porta, tudo é. */
function porOrigem(leads){
  if (!leads.length) return '';
  const linhas = new Map();
  const pega = (id) => {
    const nome = nomeOrigem(id);
    if (!nome) return null;
    if (!linhas.has(nome)) linhas.set(nome, { nome, entraram:0, viraram:0, perdidos:0, honor:[] });
    return linhas.get(nome);
  };
  let semOrigem = 0;
  for (const l of leads) {
    const alvos = [pega(l.origem_id), pega(l.origem2_id)].filter(Boolean);
    if (!alvos.length) { semOrigem++; continue; }
    for (const a of alvos) {
      a.entraram++;
      if (l.etapa === 'fechado') { a.viraram++; if (Number(l.honorario) > 0) a.honor.push(Number(l.honorario)); }
      if (l.etapa === 'perdido') a.perdidos++;
    }
  }
  if (!linhas.size) return '';
  const lista = [...linhas.values()].sort((a,b) => b.entraram - a.entraram);
  const maior = Math.max(1, ...lista.map(x => x.entraram));
  const media = v => v.length ? rs(v.reduce((a,b)=>a+b,0)/v.length) : '—';

  return `<div class="card"><h2>De onde vem, e o que rende</h2>
    <p class="nota">Quem tem <b>duas origens</b> — o canal e quem indicou — conta nas duas
      linhas. Por isso a coluna não soma o total.${semOrigem
      ? ` <b>${semOrigem}</b> atendimento(s) sem origem nenhuma ficaram de fora.` : ''}</p>
    <table><thead><tr><th>Origem</th><th>Entraram</th><th>Viraram caso</th><th>Taxa</th>
      <th>Honorário médio</th></tr></thead>
    <tbody>${lista.map(x => { const decididos = x.viraram + x.perdidos;
      const taxa = decididos ? Math.round(x.viraram/decididos*100) : null;
      return `<tr>
      <td>${esc(x.nome)}
        <span class="sub"><span style="display:inline-block;height:6px;border-radius:99px;background:var(--serie);width:${Math.round(x.entraram/maior*120)}px;vertical-align:middle"></span></span></td>
      <td>${x.entraram}</td><td>${x.viraram}</td>
      <td>${taxa === null ? '<span class="sub" style="margin:0">ainda decidindo</span>' : taxa + '%'}</td>
      <td>${media(x.honor)}</td>
    </tr>`; }).join('')}</tbody></table>
  </div>`;
}

async function telaMetricas(){
  /* `timesheet` não tem parceria_id — pendura no caso. Por isso ele não entra aqui:
     somar horas exigiria a lista de casos antes, e o número ainda não tem uso. */
  const [cs, pr, pz, le, la] = await Promise.all([
    sb.from('caso').select('id,area_id,area,coluna_id,encerrado_em,criado_em,resultado').eq('parceria_id', PAR.id),
    sb.from('processo').select('id,tribunal_sigla,fase,caso_id').eq('parceria_id', PAR.id),
    sb.from('prazo').select('id,situacao,data_fatal,cumprido_em').eq('parceria_id', PAR.id),
    sb.from('lead').select('id,etapa,criado_em,origem_id,origem2_id,honorario').eq('parceria_id', PAR.id),
    sb.from('lancamento').select('tipo,valor,situacao').eq('parceria_id', PAR.id),
  ]);
  if (cs.error) return erro(cs.error.message);
  const casos = cs.data || [], procs = pr.data || [], prazos = pz.data || [],
        leads = le.data || [], lancs = la.data || [];
  const abertos = casos.filter(c => !c.encerrado_em);
  const encerrados = casos.filter(c => c.encerrado_em);

  const conta = (lista, chave) => {
    const m = new Map();
    for (const x of lista) { const k = chave(x) || '— não informado —'; m.set(k, (m.get(k)||0)+1); }
    return [...m.entries()].sort((a,b) => b[1]-a[1]);
  };
  const nomeColuna = id => COLUNAS.find(k => k.id === id)?.nome || null;

  /* Prazo cumprido depois do fatal é prazo perdido na prática, ainda que marcado
     como cumprido. A conta diz a verdade, não o rótulo. */
  const cumpridos = prazos.filter(z => z.cumprido_em);
  const noPrazo = cumpridos.filter(z => String(z.cumprido_em).slice(0,10) <= String(z.data_fatal).slice(0,10)).length;
  const atrasados = cumpridos.length - noPrazo;
  const emAberto = prazos.filter(z => !['cumprido','cancelado'].includes(z.situacao));
  const vencidos = emAberto.filter(z => dias(z.data_fatal) < 0).length;

  /* Vários marcados no mesmo dia, com fatais de dias diferentes, é mutirão de
     arrumação — não é prazo perdido. Dizer isso é a diferença entre um número
     que informa e um que assusta à toa. */
  const porDia = new Map();
  for (const z of cumpridos) { const d = String(z.cumprido_em).slice(0,10);
    porDia.set(d, (porDia.get(d)||0)+1); }
  const maior = [...porDia.entries()].sort((a,b) => b[1]-a[1])[0];
  const mutirao = maior && maior[1] >= 3 && maior[1] >= cumpridos.length * 0.6
    ? { dia: maior[0], quantos: maior[1] } : null;

  const fechados = leads.filter(l => l.etapa === 'fechado').length;
  const perdidos = leads.filter(l => l.etapa === 'perdido').length;
  const decididos = fechados + perdidos;
  const conversao = decididos ? Math.round(fechados / decididos * 100) : null;

  const aReceber = lancs.filter(l => l.tipo === 'entrada' && l.situacao !== 'pago')
    .reduce((t,l) => t + Number(l.valor||0), 0);
  const recebido = lancs.filter(l => l.tipo === 'entrada' && l.situacao === 'pago')
    .reduce((t,l) => t + Number(l.valor||0), 0);

  app.innerHTML = menu('metricas') + `<main>
  <h1>Números</h1>
  <p class="meta">Só o que é da parceria. Nenhum número do escritório entra aqui — nem para
    comparar, porque comparar já seria misturar.</p>
  <div class="kpis">
    <div class="kpi"><div class="n">${abertos.length}</div><div class="l">casos abertos</div></div>
    <div class="kpi"><div class="n">${procs.length}</div><div class="l">processos</div></div>
    <div class="kpi ${vencidos?'al':''}"><div class="n">${vencidos}</div><div class="l">prazos vencidos em aberto</div></div>
    <div class="kpi"><div class="n">${conversao === null ? '—' : conversao + '%'}</div>
      <div class="l">dos atendimentos viraram caso</div></div>
  </div>

  <div class="card"><h2>Prazos: quando foram marcados</h2>
    <p class="nota">A data que o sistema guarda é a do <b>clique</b>, não a do ato: ela diz
      quando alguém marcou como cumprido, e não quando a providência foi tomada. Por isso a
      barra de baixo não acusa ninguém — quem marca uma pilha atrasada num dia só está
      arrumando o quadro, não perdendo prazo. ${mutirao ? `<b>É o caso aqui:
      ${mutirao.quantos} marcados no mesmo dia, ${br(mutirao.dia)}.</b>` : ''}</p>
    <div style="padding:0 18px 16px">
      <div class="barra"><span class="rot">marcados até o fatal</span>
        <span class="tr"><i style="width:${cumpridos.length?Math.round(noPrazo/cumpridos.length*100):0}%"></i></span>
        <span class="n">${noPrazo}</span></div>
      <div class="barra"><span class="rot">marcados depois do fatal</span>
        <span class="tr"><i style="width:${cumpridos.length?Math.round(atrasados/cumpridos.length*100):0}%;background:${mutirao?'var(--warn)':'var(--crit)'}"></i></span>
        <span class="n">${atrasados}</span></div>
      <div class="sub" style="margin-top:8px">${emAberto.length} em aberto${vencidos?`, dos quais ${vencidos} já vencidos — <b>esses sim</b> pedem olhada`:''}.</div>
    </div>
  </div>

  ${barras('Casos abertos por etapa', conta(abertos, c => nomeColuna(c.coluna_id)))}
  ${barras('Casos por área', conta(casos, c => nomeArea(c.area_id) || c.area))}
  ${barras('Processos por tribunal', conta(procs, p => p.tribunal_sigla))}
  ${barras('Processos por fase', conta(procs, p => p.fase))}
  ${leads.length ? barras('Atendimentos por etapa', conta(leads, l => {
      const e = ETAPAS.find(([k]) => k === l.etapa);
      return e ? e[1] : (l.etapa === 'fechado' ? 'Virou caso' : l.etapa === 'perdido' ? 'Não fechou' : l.etapa);
    })) : ''}
  ${encerrados.length ? barras('Como os casos terminaram', conta(encerrados, c => c.resultado)) : ''}

  ${porOrigem(leads)}

  <div class="card"><h2>Dinheiro da parceria</h2>
    <div style="padding:0 18px 16px">
      <div class="barra"><span class="rot">já recebido</span>
        <span class="tr"><i style="width:${(recebido+aReceber)?Math.round(recebido/(recebido+aReceber)*100):0}%"></i></span>
        <span class="n">${rs(recebido)}</span></div>
      <div class="barra"><span class="rot">a receber</span>
        <span class="tr"><i style="width:${(recebido+aReceber)?Math.round(aReceber/(recebido+aReceber)*100):0}%"></i></span>
        <span class="n">${rs(aReceber)}</span></div>
      ${(recebido+aReceber) ? '' : '<div class="sub" style="margin-top:8px">Nenhum lançamento na parceria ainda.</div>'}
    </div>
  </div>
  </main>` + rodape();
}

/* ---------------------------------------------------------------- whatsapp */

async function telaWhatsapp(){
  const ld = await sb.from('lead').select('id,nome,telefone,etapa,caso_id').eq('parceria_id', PAR.id);
  if (ld.error) return erro(ld.error.message);
  const leads = ld.data || [];
  /* Mesmo cuidado do quadro: pedir sem filtro traria, para um login do escritório,
     a caixa de entrada inteira. A conversa só entra aqui pelo lead que é nosso. */
  const ids = leads.map(l => l.id);
  const cv = ids.length ? await sb.from('bot_conversa')
    .select('id,telefone,wa_nome,lead_id,estado,urgencia,criado_em')
    .in('lead_id', ids)
    .order('criado_em', { ascending: false }).limit(60) : { data: [] };
  const conversas = cv.data || [];
  const lead = id => leads.find(l => l.id === id);

  app.innerHTML = menu('whatsapp') + `<main>
  <h1>WhatsApp</h1>
  <p class="meta">A conversa da pessoa com a assistente do escritório, <b>só dos atendimentos
    que são nossos</b> — a caixa de entrada inteira não vem para cá: quem escreve ainda não sabe
    que existe parceria, e o que conta ali é dela, não do escritório. Aqui é leitura: responder
    sai pelo número do escritório, e por isso continua sendo de lá.</p>
  <div class="card"><h2>Conversas — ${conversas.length}</h2>
    ${conversas.length ? `<table><thead><tr><th>Quem</th><th>Atendimento</th><th>Estado</th><th></th></tr></thead>
      <tbody>${conversas.map(c => { const l = lead(c.lead_id); return `<tr>
        <td>${esc(c.wa_nome || c.telefone)}<span class="sub">${esc(c.telefone)}</span></td>
        <td>${l ? esc(l.nome) : '—'}${l?.caso_id ? `<span class="sub"><a class="lnk" href="#/caso/${l.caso_id}">ver o caso</a></span>` : ''}</td>
        <td><span class="pill ${c.urgencia === 'urgente' ? 'crit' : c.urgencia === 'alta' ? 'ser' : 'good'}">${esc(c.estado)}</span></td>
        <td style="width:120px"><a class="btn" href="#/conversa/${c.id}">Ler</a></td>
      </tr>`; }).join('')}</tbody></table>`
      : vazio('Nenhuma conversa de atendimento nosso ainda.')}
  </div></main>` + rodape();
}

async function telaConversa(id){
  const [cv, ms] = await Promise.all([
    sb.from('bot_conversa').select('*').eq('id', id).maybeSingle(),
    sb.from('bot_mensagem').select('*').eq('conversa_id', id).order('criado_em'),
  ]);
  if (cv.error) return erro(cv.error.message);
  if (!cv.data) return erro('conversa não encontrada, ou não é de um atendimento da parceria');
  const c = cv.data, msgs = ms.data || [];
  /* Digitar o endereço de uma conversa não pode abrir o que não é da parceria —
     a RLS já barra a parceira, mas um login do escritório passaria por aqui. */
  const dono = c.lead_id ? (await sb.from('lead').select('id')
    .eq('id', c.lead_id).eq('parceria_id', PAR.id).maybeSingle()).data : null;
  if (!dono) return erro('esta conversa não é de um atendimento da parceria');
  app.innerHTML = menu('whatsapp') + `<main>
  <a class="volta" href="#/whatsapp">← Conversas</a>
  <h1>${esc(c.wa_nome || c.telefone)}</h1>
  <p class="meta">${esc(c.telefone)} · ${esc(c.estado)}${c.origem ? ' · veio de ' + esc(c.origem) : ''}</p>
  <div class="card"><div class="fio">${msgs.length ? msgs.map(m => `
    <div class="bolha ${m.direcao === 'saida' ? 'meu' : ''}">${esc(m.texto || '(' + m.tipo + ')')}
      <span class="quem">${m.direcao === 'saida' ? 'escritório' : 'pessoa'} · ${horaBr(m.criado_em)}</span>
    </div>`).join('') : vazio('Sem mensagens guardadas nesta conversa.')}</div></div>
  </main>` + rodape();
}

/* ---------------------------------------------------------------- roteador */

async function rota(){
  const { data:{ user } } = await sb.auth.getUser();
  if (!user) return telaLogin();
  if (!PAR.id) {
    try { await carregarParceria(); }
    catch (e) { return erro(e.message); }
    if (!PAR.id) {
      app.innerHTML = `<div class="login"><h1>Parceria</h1>
        <p>Você entrou, mas este e-mail ainda não foi convidado para nenhuma parceria.
          Peça o convite e tente de novo.</p>
        <button class="btn" onclick="sb.auth.signOut().then(()=>location.reload())">Sair</button></div>`;
      return;
    }
  }
  const h = location.hash || '#/inicio';
  const q = new URLSearchParams((h.split('?')[1] || ''));
  if (h.startsWith('#/caso/'))      return telaCaso(h.slice('#/caso/'.length).split('?')[0]);
  if (h.startsWith('#/cliente/'))   return telaCliente(h.slice('#/cliente/'.length).split('?')[0]);
  if (h.startsWith('#/processo/'))  return telaProcesso(h.slice('#/processo/'.length).split('?')[0]);
  if (h.startsWith('#/casos'))      return telaCasos();
  if (h.startsWith('#/clientes'))   return telaClientes();
  if (h.startsWith('#/processos'))  return telaProcessos(q.get('caso'));
  if (h.startsWith('#/publicacoes'))return telaPublicacoes();
  if (h.startsWith('#/conversa/'))  return telaConversa(h.slice('#/conversa/'.length).split('?')[0]);
  if (h.startsWith('#/agenda'))     return telaAgenda(q.get('caso'), q.get('m'));
  if (h.startsWith('#/playbook'))   return telaPlaybook();
  if (h.startsWith('#/ementas'))    return telaEmentas();
  if (h.startsWith('#/ficha/'))     return telaFicha(h.slice('#/ficha/'.length).split('?')[0]);
  if (h.startsWith('#/captacao'))   return telaCaptacao();
  if (h.startsWith('#/prazos'))     return telaPrazos();
  if (h.startsWith('#/andamento'))  return telaAndamento();
  if (h.startsWith('#/mensageria')) return telaMensageria();
  if (h.startsWith('#/metricas'))   return telaMetricas();
  if (h.startsWith('#/whatsapp'))   return telaWhatsapp();
  if (h.startsWith('#/financeiro')) return telaFinanceiro();
  if (h.startsWith('#/recados'))    return telaRecados();
  return telaInicio();
}

window.addEventListener('hashchange', rota);
let USER_ATUAL = null;
sb.auth.onAuthStateChange((evento, sessao) => {
  if (evento === 'TOKEN_REFRESHED' || evento === 'USER_UPDATED') return;
  const uid = sessao?.user?.id ?? null;
  if (uid === USER_ATUAL && evento !== 'SIGNED_OUT') return;
  USER_ATUAL = uid;
  rota();
});
rota();
