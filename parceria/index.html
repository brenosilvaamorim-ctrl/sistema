<div id="app"><div class="vazio">Carregando…</div></div>
<script>
/* ============================================================ A PARCERIA
   Segundo endereço do mesmo sistema, para o trabalho dividido com advogado de
   fora. Quem entra aqui NÃO é usuário do escritório: não tem linha em usuario,
   e por isso toda regra de acesso de lá — que compara escritorio_id com
   meu_escritorio() — nega. O que se vê aqui é só o que leva o carimbo da
   parceria, e o carimbo é a mesma linha que o escritório enxerga do outro lado.
   Não há cópia nem sincronismo: é o mesmo caso, visto por duas portas.
   A regra está em banco/44_parceria.sql. */

const SB_URL = "https://wrdfyudabvvpvfcrvvzd.supabase.co";
const SB_KEY = "sb_publishable_EfdAshQdw1P1-lAXtlO9Hw_O8yoP3y5";
const sb = window.supabase.createClient(SB_URL, SB_KEY);
const app = document.getElementById('app');

const esc = s => String(s??'').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const br = s => s ? String(s).slice(0,10).split('-').reverse().join('/') : '—';
const hoje = () => new Date().toISOString().slice(0,10);
const dias = d => Math.round((Date.parse(String(d).slice(0,10)+'T00:00:00Z') - Date.parse(hoje()+'T00:00:00Z'))/864e5);
const rs = v => Number(v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const numOuNulo = v => { const t = String(v ?? '').replace(/\./g,'').replace(',', '.').trim();
  return t === '' || isNaN(Number(t)) ? null : Number(t); };
const horaBr = t => t ? new Date(t).toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',year:'2-digit',hour:'2-digit',minute:'2-digit'}) : '—';
function sit(r){ if(r<0) return ['crit','Vencido']; if(r<=2) return ['crit','Urgente'];
  if(r<=5) return ['ser','Atenção']; if(r<=10) return ['warn','Próximo']; return ['good','No prazo']; }

let USER = null;
let PAR = { id:null, nome:'Parceria', parceiro_id:null, membros:[], eu:null, esc:null };
let AREAS = [], COLUNAS = [], ORIGENS = [];

/* ------------------------------------------------------------------ entrada */

function telaLogin(msg){
  app.innerHTML = `<div class="login">
    <h1>Parceria</h1>
    <p>Os casos que tocamos juntos. Entre com seu e-mail — enviamos um link de acesso,
      sem senha para decorar.</p>
    <input id="em" type="email" placeholder="seu@email.com" autocomplete="email">
    <button class="btn ok" id="go">Receber link de acesso</button>
    <p id="msg" style="margin-top:12px;font-size:13px;color:var(--i2)">${msg||''}</p></div>`;
  document.getElementById('go').onclick = async () => {
    const email = document.getElementById('em').value.trim();
    if (!email) return;
    document.getElementById('msg').textContent = 'Enviando…';
    const { error } = await sb.auth.signInWithOtp({ email,
      options:{ emailRedirectTo: location.origin + location.pathname }});
    document.getElementById('msg').textContent = error ? ('Erro: ' + error.message)
      : 'Link enviado. Confira seu e-mail.';
  };
}

/* Os mesmos grupos do sistema do escritório, na mesma ordem de pensamento: o dia,
   as pessoas, os casos, a conversa e o dinheiro. Quem sabe andar lá sabe andar aqui. */
const GRUPOS = [
  ['Meu dia',   [['inicio','Início'],['prazos','Prazos'],['agenda','Agenda'],['publicacoes','Publicações']]],
  ['Pessoas',   [['captacao','Captação'],['clientes','Clientes']]],
  ['Casos',     [['casos','Casos'],['processos','Processos'],['andamento','Andamento']]],
  ['Escrever',  [['playbook','Playbook'],['ementas','Ementas']]],
  ['Conversas', [['mensageria','Avisar o cliente'],['recados','Recados'],['whatsapp','WhatsApp']]],
  ['Dinheiro',  [['financeiro','Financeiro'],['metricas','Números']]],
];

window.abrirGrupo = (ev) => {
  ev.preventDefault();
  const alvo = ev.currentTarget.parentElement;
  const jaAberto = alvo.classList.contains('aberto');
  document.querySelectorAll('.grp').forEach(g => g.classList.remove('aberto'));
  if (!jaAberto) alvo.classList.add('aberto');
};
document.addEventListener('click', e => {
  if (!e.target.closest('.grp')) document.querySelectorAll('.grp').forEach(g => g.classList.remove('aberto'));
});

function menu(atual){
  return `<nav>
    <div class="marca"><div class="sigla">BP</div><div><span class="nome">${esc(PAR.nome)}</span>
      <span class="sub2">casos em parceria</span></div></div>
    ${GRUPOS.map(([nome, itens]) => `<div class="grp ${itens.some(([k])=>k===atual)?'tem':''}">
      <button class="gbt" onclick="abrirGrupo(event)">${nome}<span class="seta">▾</span></button>
      <div class="lista">${itens.map(([k,r]) =>
        `<a class="${atual===k?'on':''}" href="#/${k}">${r}</a>`).join('')}</div>
    </div>`).join('')}
    <span class="dir">${esc(PAR.eu?.nome || USER?.email || '')} ·
      <a onclick="sb.auth.signOut().then(()=>location.reload())">sair</a></span></nav>`;
}

function rodape(){
  return `<footer><b>${esc(PAR.nome)}</b> — área da parceria.
    Aqui só existe o que foi marcado como nosso: o caso é a mesma linha que o escritório vê do
    outro lado, e não uma cópia. O que se cadastra aqui aparece lá na hora, e o contrário também.
    O restante do escritório não é visível desta porta.</footer>`;
}

const erro = m => app.innerHTML = menu('') + '<main><div class="card"><div class="vazio">Erro ao carregar: '+esc(m)+'</div></div></main>';
const vazio = t => `<div class="vazio">${esc(t)}</div>`;

async function carregarParceria(){
  const { data:{ user } } = await sb.auth.getUser();
  USER = user;
  /* Gruda o login no convite, se for o primeiro acesso desta pessoa. */
  await sb.rpc('entrar_na_parceria');
  const [p, m, a, c, og] = await Promise.all([
    sb.from('parceria').select('*').eq('ativa', true).order('criado_em'),
    sb.from('parceria_membro').select('*').order('criado_em'),
    sb.from('area_atuacao').select('id,nome').order('nome'),
    sb.from('coluna_caso').select('id,nome,ordem,cor').order('ordem'),
    sb.from('origem_captacao').select('id,nome').order('nome'),
  ]);
  const parcerias = p.data || [], membros = m.data || [];

  /* Qual parceria é esta. Para quem vem de fora, a RLS já devolve uma só — a dela.
     Para um login do escritório, devolve TODAS as parcerias do escritório, e pegar
     "a primeira" acertaria hoje, com uma, e erraria calado no dia em que houver duas.
     Então a escolha é pela presença: a parceria em que o login é membro. */
  const meu = (x) => x.usuario_auth === user.id
    || (x.email || '').toLowerCase() === (user.email || '').toLowerCase();
  const minhas = new Set(membros.filter(meu).map(x => x.parceria_id));
  const escolhida = parcerias.find(x => minhas.has(x.id)) || parcerias[0] || null;

  if (escolhida) { PAR.id = escolhida.id; PAR.nome = escolhida.nome || 'Parceria';
    PAR.parceiro_id = escolhida.parceiro_id; PAR.esc = escolhida.escritorio_id; }
  PAR.membros = membros.filter(x => x.parceria_id === PAR.id);
  PAR.eu = PAR.membros.find(x => x.usuario_auth === user.id)
        || PAR.membros.find(x => (x.email||'').toLowerCase() === (user.email||'').toLowerCase()) || null;
  AREAS = a.data || []; COLUNAS = c.data || []; ORIGENS = og.data || [];
  return PAR;
}

const nomeArea = id => AREAS.find(a => a.id === id)?.nome || '';
const nomeOrigem = id => ORIGENS.find(o => o.id === id)?.nome || '';
const quemE = uid => { const m = PAR.membros.find(x => x.usuario_auth === uid); return m ? m.nome : 'alguém'; };

/* ------------------------------------------------------------------ início */

async function telaInicio(){
  const limite = new Date(Date.now() + 30*864e5).toISOString().slice(0,10);
  const [cs, pz, ev, it, rc] = await Promise.all([
    sb.from('caso').select('id,titulo,encerrado_em').eq('parceria_id', PAR.id),
    sb.from('prazo').select('id,descricao,data_fatal,situacao,caso_id').eq('parceria_id', PAR.id)
      .in('situacao',['sugerido','confirmado']).lte('data_fatal', limite).order('data_fatal'),
    sb.from('evento').select('id,titulo,inicio,tipo,caso_id').eq('parceria_id', PAR.id)
      .eq('situacao','aberta').gte('inicio', hoje()).order('inicio').limit(12),
    sb.from('intimacao').select('id,data_disponibilizacao,tipo_comunicacao,numero_formatado,situacao')
      .eq('parceria_id', PAR.id).eq('situacao','nova').order('data_disponibilizacao',{ascending:false}),
    sb.from('parceria_recado').select('*').eq('parceria_id', PAR.id).order('criado_em',{ascending:false}).limit(5),
  ]);
  if (cs.error) return erro(cs.error.message);
  const casos = cs.data || [], abertos = casos.filter(c => !c.encerrado_em);
  const prazos = pz.data || [], eventos = ev.data || [], novas = it.data || [], recados = rc.data || [];
  const tituloCaso = id => casos.find(c => c.id === id)?.titulo || '';

  app.innerHTML = menu('inicio') + `<main>
  <h1>Início</h1>
  <p class="meta">O que é nosso e o que vence. Tudo o que está aqui está também no sistema do
    escritório, na mesma linha — não é cópia.</p>
  <div class="kpis">
    <div class="kpi"><div class="n">${abertos.length}</div><div class="l">casos abertos</div></div>
    <div class="kpi ${prazos.filter(p=>dias(p.data_fatal)<=5).length?'al':''}">
      <div class="n">${prazos.length}</div><div class="l">prazos em 30 dias</div></div>
    <div class="kpi ${novas.length?'al':''}"><div class="n">${novas.length}</div><div class="l">publicações novas</div></div>
    <div class="kpi"><div class="n">${eventos.length}</div><div class="l">compromissos à frente</div></div>
  </div>

  <div class="card"><h2>Prazos</h2>
    ${prazos.length ? `<table><thead><tr><th>Fatal</th><th>Providência</th><th>Caso</th><th></th></tr></thead><tbody>
      ${prazos.map(p => { const d = dias(p.data_fatal), [cor, rot] = sit(d);
        return `<tr><td class="dt">${br(p.data_fatal)}<span class="sub">${d<0?Math.abs(d)+' dias atrás':d+' dias'}</span></td>
        <td>${esc(p.descricao)}</td>
        <td>${p.caso_id ? `<a class="lnk" href="#/caso/${p.caso_id}">${esc(tituloCaso(p.caso_id))}</a>` : '—'}</td>
        <td><span class="pill ${cor}">${rot}</span></td></tr>`; }).join('')}
    </tbody></table>` : vazio('Nenhum prazo nos próximos 30 dias.')}
  </div>

  <div class="card"><h2>Próximos compromissos</h2>
    ${eventos.length ? `<table><tbody>${eventos.map(e => `<tr>
      <td class="dt" style="width:150px">${horaBr(e.inicio)}</td>
      <td>${esc(e.titulo)}<span class="sub">${esc(e.tipo)}${e.caso_id?' · '+esc(tituloCaso(e.caso_id)):''}</span></td>

  </div>

      <div class="bolha ${r.autor_auth===USER.id?'meu':''}">${esc(r.texto)}

      <p style="margin:10px 0 0"><a class="lnk" href="#/recados">abrir os recados</a></p></div>`
      : vazio('Nenhum recado ainda.')}
  </div>
  </main>` + rodape();
}

/* ------------------------------------------------------------------- casos */

let CASOBUSCA = '';

async function telaCasos(){
  /* A visão caso_quadro não tem parceria_id, e deixar a RLS filtrar sozinha não
     serve: para um login do escritório ela devolve o escritório inteiro, e esta
     porta passaria a mostrar o que não é da parceria. Então a lista de casos vem
     primeiro, carimbada, e a visão é pedida só para esses. */
  const [od, cl] = await Promise.all([
    sb.from('caso').select('id,ordem').eq('parceria_id', PAR.id),
    sb.from('cliente').select('id,nome').eq('parceria_id', PAR.id).order('nome'),
  ]);
  if (od.error) return erro(od.error.message);
  const meus = (od.data || []).map(x => x.id);
  const q = meus.length ? await sb.from('caso_quadro').select('*').in('id', meus) : { data: [] };
  if (q.error) return erro(q.error.message);
  QUADRO = q.data || [];
  const clientes = cl.data || [];
  CASOORD = {}; (od.data || []).forEach(x => { CASOORD[x.id] = x.ordem; });
  await carregarTags(meus).catch(()=>{});
  if (TAGFILTRO && !TAGS.some(t => t.id === TAGFILTRO)) TAGFILTRO = null;

  const filtro = CASOBUSCA.trim().toLowerCase();
  const casa = c => (!filtro || `${c.titulo||''} ${c.cliente_nome||''}`.toLowerCase().includes(filtro))
    && (!TAGFILTRO || tagsDoCaso(c.id).some(t => t.id === TAGFILTRO));
  let abertos = QUADRO.filter(c => !c.encerrado_em && casa(c)).sort(porOrdemCaso);
  const encerrados = QUADRO.filter(c => c.encerrado_em && casa(c))
    .sort((a,b) => String(b.encerrado_em).localeCompare(String(a.encerrado_em)));
  const comPrazo = abertos.filter(c => c.proximo_prazo && dias(c.proximo_prazo) <= 5).length;
  const parados = abertos.filter(c => c.ultima_movimentacao &&
    (Date.now() - Date.parse(c.ultima_movimentacao))/864e5 > 90).length;

  app.innerHTML = menu('casos') + `<main>
  <h1>Casos</h1>
  <p class="meta">O mesmo quadro do escritório, com o que é nosso. Cada caso numa etapa; clique
    no nome para abrir. Para reordenar ou mudar de etapa, arraste pela alça <b>⠿</b> — a ordem
    fica gravada, e é a mesma que o escritório vê. As setas ▲▼ fazem o mesmo sem arrastar.</p>
  <div class="kpis">
    <div class="kpi"><div class="n">${abertos.length}</div><div class="l">casos abertos</div></div>
    <div class="kpi ${comPrazo?'al':''}"><div class="n">${comPrazo}</div><div class="l">com prazo em até 5 dias</div></div>
    <div class="kpi ${parados?'al':''}"><div class="n">${parados}</div><div class="l">parados há mais de 90 dias</div></div>
    <div class="kpi"><div class="n">${encerrados.length}</div><div class="l">encerrados</div></div>
  </div>
  <div class="card">
    <div style="padding:12px 18px;display:flex;gap:8px;flex-wrap:wrap;align-items:center">
      <button class="btn ok" onclick="document.getElementById('nc').style.display='block'">Abrir um caso</button>
      <span style="width:1px;height:22px;background:var(--ln)"></span>
      <button class="btn ${CASOVISTA==='quadro'?'ok':''}" onclick="mudarVistaCasos('quadro')">Quadro</button>
      <button class="btn ${CASOVISTA==='lista'?'ok':''}" onclick="mudarVistaCasos('lista')">Lista</button>
      <input type="search" id="busca" placeholder="buscar por caso ou cliente" value="${esc(CASOBUSCA)}"
        oninput="CASOBUSCA=this.value;clearTimeout(window.__b);window.__b=setTimeout(telaCasos,250)"
        style="flex:1;min-width:200px;padding:6px 11px">
    </div>
    ${TAGS.length ? `<div style="padding:0 18px 12px;display:flex;gap:6px;flex-wrap:wrap;align-items:center">
      <span class="sub" style="margin:0">etiquetas:</span>
      ${TAGS.map(t=>`<button class="btn ${TAGFILTRO===t.id?'ok':''}" style="font-size:11.6px;padding:4px 9px"
        onclick="filtrarTag('${t.id}')">${esc(t.nome)}</button>`).join('')}
      ${TAGFILTRO?`<button class="btn" style="font-size:11.6px;padding:4px 9px" onclick="filtrarTag('${TAGFILTRO}')">limpar</button>`:''}
    </div>` : ''}
  </div>

  <div class="card" id="nc" style="display:none"><h2>Abrir um caso</h2>
    <p class="nota">Digite o nome do cliente. Se ainda não houver cadastro, o sistema cria o
      cliente junto — caso não nasce sem dono.</p>
    <form class="form" onsubmit="novoCaso(event)">
      <label class="larga"><span class="sub">Nome do cliente</span>
        <input name="cliente" required list="lcli" placeholder="como deve aparecer no quadro">
        <datalist id="lcli">${clientes.map(c=>`<option value="${esc(c.nome)}">`).join('')}</datalist></label>
      <label><span class="sub">Telefone</span><input name="telefone" placeholder="com DDD"></label>
      <label><span class="sub">Área</span>
        <select name="area_id"><option value="">— sem área —</option>
          ${AREAS.map(a=>`<option value="${a.id}">${esc(a.nome)}</option>`).join('')}</select></label>
      <label><span class="sub">Polo</span>
        <select name="polo"><option value="">— não informado —</option>
          <option>Reclamante</option><option>Reclamado</option><option>Autor</option><option>Réu</option></select></label>
      <label class="larga"><span class="sub">O que é o caso</span>
        <input name="titulo" placeholder="deixe em branco para usar o nome do cliente"></label>
      <button class="btn ok" type="submit">Abrir</button>
      <span id="nc-st" class="sub" style="margin:0"></span>
    </form>
  </div>

  ${CASOVISTA === 'lista' ? `<div class="card"><h2>Abertos — ${abertos.length}</h2>
    ${abertos.length ? `<table><thead><tr><th>Caso</th><th>Cliente</th><th>Área</th><th>Etapa</th><th>Próximo prazo</th><th>Processos</th></tr></thead>
    <tbody>${abertos.map(c => { const d = c.proximo_prazo ? dias(c.proximo_prazo) : null; return `<tr>
      <td><a class="lnk" href="#/caso/${c.id}"><b>${esc(c.titulo || c.cliente_nome || 'sem título')}</b></a>
        ${c.polo?`<span class="sub">${esc(c.polo)}</span>`:''}</td>
      <td>${esc(c.cliente_nome || '—')}</td>
      <td>${esc(c.area_nome || c.area || '—')}</td>
      <td>${esc(c.coluna_nome || '—')}</td>
      <td class="dt">${c.proximo_prazo ? br(c.proximo_prazo)+`<span class="sub">${d<0?'vencido':(d===0?'hoje':'em '+d+'d')}</span>` : '—'}</td>
      <td>${c.processos}</td></tr>`; }).join('')}</tbody></table>` : vazio('Nenhum caso neste filtro.')}
    </div>` : `
  <div class="quadro">
    ${COLUNAS.map(col => { const meus = abertos.filter(c => c.coluna_id === col.id);
      return `<div class="coluna" data-col="${col.id}">
        <div class="cabcol" style="border-top:3px solid ${col.cor||'var(--i3)'}">
          ${esc(col.nome)} <span class="sub" style="display:inline;margin:0">${meus.length}</span></div>
        ${meus.map(cartao).join('') || '<div class="sub" style="padding:10px 2px">vazio</div>'}
      </div>`; }).join('')}
  </div>`}
  ${encerrados.length ? `<div class="card" style="margin-top:20px"><h2>Encerrados — ${encerrados.length}</h2>
    <table><thead><tr><th>Caso</th><th>Cliente</th><th>Resultado</th><th>Encerrado em</th></tr></thead>
    <tbody>${encerrados.slice(0,40).map(c=>`<tr>
      <td><a class="lnk" href="#/caso/${c.id}">${esc(c.titulo || c.cliente_nome)}</a></td>
      <td>${esc(c.cliente_nome || '—')}</td><td>${esc(c.resultado||'—')}</td>
      <td class="dt">${br(c.encerrado_em)}</td></tr>`).join('')}</tbody></table></div>` : ''}
  </main>` + rodape();
  if (CASOVISTA !== 'lista') ligarArrastoCasos();
}

/* ----------------------------------------- o quadro, igual ao do escritório
   A ordem manual vive em caso.ordem — a mesma coluna que o escritório usa.
   Quem arrasta de um lado muda a ordem do outro, porque é a mesma linha. */
let QUADRO = [], CASOORD = {}, ARRASTA = null;
let CASOVISTA = localStorage.getItem('casovista_parceria') || 'quadro';
window.mudarVistaCasos = v => { CASOVISTA = v; localStorage.setItem('casovista_parceria', v); telaCasos(); };

/* ----------------------------------------------------------------- etiquetas
   A etiqueta é do escritório: a lista de nomes é a mesma dos dois lados, e o
   que a parceria faz é pendurar e tirar nos casos que são dela. Criar etiqueta
   nova continua sendo de lá — é vocabulário do escritório, não da parceria. */
let TAGS = [], CASOTAGS = {}, TAGFILTRO = null;

async function carregarTags(ids){
  const [tg, ct] = await Promise.all([
    sb.from('tag').select('id,nome,cor').order('nome'),
    ids.length ? sb.from('caso_tag').select('caso_id, tag:tag_id(id,nome,cor)').in('caso_id', ids)
               : Promise.resolve({ data: [] }),
  ]);
  TAGS = tg.data || []; CASOTAGS = {};
  for (const r of (ct.data || [])) {
    if (!r.tag) continue;
    (CASOTAGS[r.caso_id] = CASOTAGS[r.caso_id] || []).push(r.tag);
  }
}
const tagsDoCaso = id => CASOTAGS[id] || [];
function pillsTag(id){
  return tagsDoCaso(id).map(t =>
    `<span class="pill" style="background:${esc(t.cor||'#eceae4')};color:#1b1a17">${esc(t.nome)}</span>`).join('');
}
window.filtrarTag = id => { TAGFILTRO = (TAGFILTRO === id ? null : id); telaCasos(); };
window.porTag = async (casoId, tagId, ligar) => {
  const r = ligar
    ? await sb.from('caso_tag').insert({ caso_id: casoId, tag_id: tagId })
    : await sb.from('caso_tag').delete().eq('caso_id', casoId).eq('tag_id', tagId);
  if (r.error) return alert('Não deu certo: ' + r.error.message);
  telaCasos();
};

function porOrdemCaso(a, b){
  const oa = CASOORD[a.id], ob = CASOORD[b.id];
  const va = (oa === null || oa === undefined) ? Infinity : Number(oa);
  const vb = (ob === null || ob === undefined) ? Infinity : Number(ob);
  if (va !== vb) return va - vb;
  return String(a.criado_em).localeCompare(String(b.criado_em));
}

function cartao(c){
  const d = c.proximo_prazo ? dias(c.proximo_prazo) : null;
  const k = d === null ? '' : (d < 0 ? 'crit' : (d <= 5 ? 'ser' : (d <= 15 ? 'warn' : 'good')));
  const parado = c.ultima_movimentacao
    ? Math.round((Date.now() - Date.parse(c.ultima_movimentacao))/864e5) : null;
  return `<div class="cartao" data-caso="${c.id}" data-col="${c.coluna_id||''}">
    <span class="pega" title="arraste para reordenar">⠿</span>
    <div class="tit"><a class="lnk" href="#/caso/${c.id}">${esc(c.titulo || c.cliente_nome || 'sem título')}</a></div>
    <div class="sub" style="margin:2px 0 7px">${esc(c.cliente_nome || 'sem cliente')} · ${
      esc(c.area_nome || c.area || 'sem área')}${c.polo ? ' · ' + esc(c.polo) : ''} · ${c.processos} processo(s)</div>
    ${d !== null ? `<span class="pill ${k}">prazo ${br(c.proximo_prazo)}${d<0?' (vencido)':''}</span>` : ''}
    ${parado !== null && parado > 90 ? `<span class="pill ser">parado há ${parado} dias</span>` : ''}
    ${pillsTag(c.id)}
    <div style="margin-top:9px;display:flex;gap:5px;flex-wrap:wrap">
      <select onchange="moverCaso('${c.id}', this.value)" style="flex:1;min-width:130px;font-size:11.6px">
        ${COLUNAS.map(x=>`<option value="${x.id}" ${x.id===c.coluna_id?'selected':''}>${esc(x.nome)}</option>`).join('')}
      </select>
      <button class="btn" style="font-size:11.4px;padding:4px 7px" title="subir" onclick="subirCaso('${c.id}',-1)">▲</button>
      <button class="btn" style="font-size:11.4px;padding:4px 7px" title="descer" onclick="subirCaso('${c.id}',1)">▼</button>
    </div>
  </div>`;
}

window.moverCaso = async (id, colunaId) => {
  const { error } = await sb.from('caso').update({ coluna_id: colunaId }).eq('id', id);
  if (error) return alert('Não deu certo: ' + error.message);
  telaCasos();
};

function cartaoDepoisDe(col, y){
  const outros = [...col.querySelectorAll('.cartao:not(.arrastando)')];
  return outros.find(el => { const r = el.getBoundingClientRect(); return y < r.top + r.height/2; }) || null;
}
function soltarCartoes(){
  document.querySelectorAll('.quadro .cartao[draggable="true"]').forEach(c => { c.draggable = false; });
}
function ligarArrastoCasos(){
  /* O cartão só vira arrastável enquanto a alça ⠿ está pressionada: marcado o tempo
     todo, o navegador engole o clique no nome e o caso nunca abre. */
  document.addEventListener('mouseup', soltarCartoes);
  document.addEventListener('dragend', soltarCartoes);
  document.querySelectorAll('.quadro .cartao').forEach(el => {
    el.draggable = false;
    const pega = el.querySelector('.pega');
    if (pega) {
      pega.addEventListener('mousedown', () => { el.draggable = true; });
      pega.addEventListener('touchstart', () => { el.draggable = true; }, { passive: true });
    }
    el.addEventListener('dragstart', e => {
      ARRASTA = el; el.classList.add('arrastando');
      e.dataTransfer.effectAllowed = 'move';
      e.dataTransfer.setData('text/plain', el.dataset.caso);
    });
    el.addEventListener('dragend', () => {
      el.classList.remove('arrastando'); ARRASTA = null; el.draggable = false;
      document.querySelectorAll('.coluna.alvo').forEach(c=>c.classList.remove('alvo'));
    });
  });
  document.querySelectorAll('.quadro .coluna').forEach(col => {
    col.addEventListener('dragover', e => {
      if (!ARRASTA) return;
      e.preventDefault(); e.dataTransfer.dropEffect = 'move';
      col.classList.add('alvo');
      const depois = cartaoDepoisDe(col, e.clientY);
      if (depois) col.insertBefore(ARRASTA, depois); else col.appendChild(ARRASTA);
    });
    col.addEventListener('dragleave', e => {
      if (!col.contains(e.relatedTarget)) col.classList.remove('alvo');
    });
    col.addEventListener('drop', async e => {
      e.preventDefault(); col.classList.remove('alvo');
      const el = ARRASTA; ARRASTA = null;
      if (el) el.classList.remove('arrastando');
      await gravarOrdemColuna(col);
    });
  });
}
/* Renumera a coluna de 10 em 10 e grava só o que realmente mudou. */
async function gravarOrdemColuna(col){
  const colId = col.dataset.col;
  const ids = [...col.querySelectorAll('.cartao')].map(el => el.dataset.caso);
  const mudancas = [];
  ids.forEach((id, i) => {
    const nova = (i + 1) * 10;
    const trocouColuna = (QUADRO.find(c => c.id === id)?.coluna_id || '') !== colId;
    if (Number(CASOORD[id]) !== nova || trocouColuna) {
      const campos = { ordem: nova };
      if (trocouColuna) campos.coluna_id = colId;
      mudancas.push({ id, campos });
    }
  });
  if (!mudancas.length) return;
  const res = await Promise.all(mudancas.map(m => sb.from('caso').update(m.campos).eq('id', m.id)));
  const falha = res.find(r => r.error);
  if (falha) alert('Não deu para gravar a nova ordem: ' + falha.error.message);
  telaCasos();
}
/* As setas fazem o mesmo caminho, para quem não quer arrastar (ou está no celular). */
window.subirCaso = async (id, passo) => {
  const caso = QUADRO.find(c => c.id === id);
  if (!caso) return;
  const fila = QUADRO.filter(c => !c.encerrado_em && c.coluna_id === caso.coluna_id).sort(porOrdemCaso);
  const i = fila.findIndex(c => c.id === id), j = i + passo;
  if (i < 0 || j < 0 || j >= fila.length) return;
  const nova = fila.slice(); nova.splice(j, 0, nova.splice(i, 1)[0]);
  const res = await Promise.all(nova.map((c, k) => {
    const ord = (k + 1) * 10;
    return Number(CASOORD[c.id]) === ord ? null : sb.from('caso').update({ ordem: ord }).eq('id', c.id);
  }).filter(Boolean));
  const falha = res.find(r => r.error);
  if (falha) { alert('Não deu para mover: ' + falha.error.message); return; }
  telaCasos();
};

window.novoCaso = async (ev) => {
  ev.preventDefault();
  const f = ev.target, st = document.getElementById('nc-st');
  const v = n => (f.elements[n]?.value || '').trim();
  const nome = v('cliente'); if (!nome) return;
  st.textContent = 'abrindo…'; st.style.color = 'var(--i2)';
  try {
    /* O cliente já da parceria é reaproveitado; senão nasce aqui, carimbado. */
    let { data: cli } = await sb.from('cliente').select('id').eq('parceria_id', PAR.id).ilike('nome', nome).limit(1);
    let cliente_id = cli?.[0]?.id;
    if (!cliente_id) {
      const novo = await sb.from('cliente').insert({
        parceria_id: PAR.id, nome, telefone: v('telefone') || null, whatsapp: v('telefone') || null,
      }).select('id').single();
      if (novo.error) throw novo.error;
      cliente_id = novo.data.id;
    }
    const caso = await sb.from('caso').insert({
      parceria_id: PAR.id, cliente_id, titulo: v('titulo') || nome,
      area_id: v('area_id') || null, area: nomeArea(v('area_id')) || null, polo: v('polo') || null,
    }).select('id').single();
    if (caso.error) throw caso.error;
    location.hash = '#/caso/' + caso.data.id;
  } catch (e) { st.style.color = 'var(--crit)'; st.textContent = 'não deu certo: ' + e.message; }
};

async function telaCaso(id){
  const [c, pr, pz, ev, la, rc] = await Promise.all([
    sb.from('caso').select('*, cliente:cliente_id(id,nome,cpf_cnpj,telefone,whatsapp,email)').eq('id', id).maybeSingle(),
    sb.from('processo').select('*').eq('caso_id', id).order('criado_em'),
    sb.from('prazo').select('*').eq('caso_id', id).order('data_fatal'),
    sb.from('evento').select('*').eq('caso_id', id).order('inicio',{ascending:false}).limit(20),
    sb.from('lancamento').select('*').eq('caso_id', id).order('vencimento'),
    sb.from('parceria_recado').select('*').eq('caso_id', id).order('criado_em'),
  ]);
  if (c.error) return erro(c.error.message);
  if (!c.data) return erro('caso não encontrado, ou não é da parceria');
  const caso = c.data, cli = caso.cliente;
  const procs = pr.data || [], prazos = pz.data || [], eventos = ev.data || [],
        lancs = la.data || [], recados = rc.data || [];

  /* O que o 53 destravou: tudo isto pendura no caso, e por isso vem junto. */
  const [ft, pt, mn, ts, dc, tg, ct, fc, fm, hn] = await Promise.all([
    sb.from('fato').select('*').eq('caso_id', id).order('data'),
    sb.from('parte').select('*').eq('caso_id', id),
    sb.from('minuta').select('id,tipo,status,criado_em,corpo').eq('caso_id', id).order('criado_em',{ascending:false}),
    sb.from('timesheet').select('*').eq('caso_id', id).order('data',{ascending:false}).limit(40),
    sb.from('caso_documento').select('*').eq('caso_id', id).order('ordem'),
    sb.from('tag').select('id,nome,cor').order('nome'),
    sb.from('caso_tag').select('tag_id').eq('caso_id', id),
    sb.from('ficha').select('id,modelo_id,situacao,respostas,criado_em,atualizado_em,arquivo_path,arquivo_nome').eq('caso_id', id)
      .order('criado_em', { ascending: false }),
    sb.from('ficha_modelo').select('id,nome,estrutura'),
    sb.from('honorario').select('*').eq('caso_id', id).maybeSingle(),
  ]);
  const fatos = ft.data || [], partes = pt.data || [], minutas = mn.data || [],
        horas = ts.data || [], docs = dc.data || [], etiquetas = tg.data || [];
  const minhasTags = new Set((ct.data || []).map(x => x.tag_id));
  const fichas = fc.data || [], modelos = fm.data || [], hon = hn.data || null;
  window.__fichas = fichas; window.__modelos = modelos;
  const totalMin = horas.reduce((t, h) => t + Number(h.minutos || 0), 0);
  const aReceber = lancs.filter(l => l.tipo === 'entrada' && l.situacao !== 'pago')
    .reduce((t,l) => t + Number(l.valor||0), 0);

const sim = (st, e) => { if (e) { st.style.color = 'var(--crit)'; st.textContent = e.message; return false; } return true; };

window.porTagNoCaso = async (casoId, tagId, ligar) => {
  const r = ligar
    ? await sb.from('caso_tag').insert({ caso_id: casoId, tag_id: tagId })
    : await sb.from('caso_tag').delete().eq('caso_id', casoId).eq('tag_id', tagId);
  if (r.error) return alert('Não deu certo: ' + r.error.message);
  telaCaso(casoId);
};
window.novaParte = async (ev, casoId) => {
  ev.preventDefault();
  const f = ev.target, st = document.getElementById('pt-st');
  const v = n => (f.elements[n]?.value || '').trim() || null;
  const { error } = await sb.from('parte').insert({ caso_id: casoId, nome: v('nome'),
    polo: v('polo'), cpf_cnpj: v('cpf_cnpj'), advogado_nome: v('advogado_nome') });
  if (sim(st, error)) telaCaso(casoId);
};
window.novoFato = async (ev, casoId) => {
  ev.preventDefault();
  const f = ev.target, st = document.getElementById('ft-st');
  const v = n => (f.elements[n]?.value || '').trim() || null;
  const { error } = await sb.from('fato').insert({ caso_id: casoId, data: v('data'),
    descricao: v('descricao'), prova: v('prova'), origem: 'parceria' });
  if (sim(st, error)) telaCaso(casoId);
};
window.novoPedido = async (ev, casoId) => {
  ev.preventDefault();
  const f = ev.target, st = document.getElementById('dc-st');
  const descricao = (f.elements['descricao'].value || '').trim();
  const { error } = await sb.from('caso_documento').insert({ caso_id: casoId, descricao });
  if (sim(st, error)) telaCaso(casoId);
};
window.marcarRecebido = async (id, casoId) => {
  const { error } = await sb.from('caso_documento').update({ recebido_em: hoje() }).eq('id', id);
  if (error) return alert('Não deu certo: ' + error.message);
  telaCaso(casoId);
};
window.novaHora = async (ev, casoId) => {
  ev.preventDefault();
  const f = ev.target, st = document.getElementById('ts-st');
  const v = n => (f.elements[n]?.value || '').trim() || null;
  const { error } = await sb.from('timesheet').insert({ caso_id: casoId, data: v('data'),
    minutos: Number(v('minutos')), descricao: v('descricao') });
  if (sim(st, error)) telaCaso(casoId);
};
/* A pergunta de cada resposta mora em `ficha_modelo.estrutura`. Sem o modelo — enquanto
   o banco/56 não rodar — mostra a chave crua, que é feio mas honesto: melhor do que
   esconder a resposta. */
/* O arquivo não vem pela tabela: vem do Storage, por link temporário de cinco
   minutos. Quem não tiver direito ao caso recebe erro do próprio Storage — a
   regra está lá, no banco/57, e não aqui. */
window.verArquivo = async (balde, caminho) => {
  const { data, error } = await sb.storage.from(balde).createSignedUrl(caminho, 300);
  if (error) return alert('Não deu para abrir: ' + error.message
    + '\n\n(Se disser que não encontrou, pode ser que o banco/57 ainda não tenha rodado.)');
  window.open(data.signedUrl, '_blank');
};

window.verFicha = (id) => {
  const alvo = document.getElementById('ficha-corpo');
  const f = (window.__fichas || []).find(x => x.id === id);
  if (!alvo || !f) return;
  const modelo = (window.__modelos || []).find(m => m.id === f.modelo_id);
  const r = f.respostas || {};
  let html = '';
  if (modelo && Array.isArray(modelo.estrutura)) {
    for (const bloco of modelo.estrutura) {
      const campos = (bloco.c || []).filter(x => x.t !== 'info' && r[x.k] !== undefined
        && r[x.k] !== '' && r[x.k] !== null);
      if (!campos.length) continue;
      html += `${bloco.t ? `<h3 style="font-size:13.5px;margin:14px 0 6px">${esc(bloco.t)}</h3>` : ''}
        <table><tbody>${campos.map(x=>`<tr>
          <td style="width:40%;vertical-align:top"><span class="sub" style="margin:0">${esc(x.r)}</span></td>
          <td>${esc(Array.isArray(r[x.k]) ? r[x.k].join(', ') : String(r[x.k]))}</td>
        </tr>`).join('')}</tbody></table>`;
    }
  }
  if (!html) {
    const chaves = Object.keys(r).filter(k => r[k] !== '' && r[k] !== null);
    html = chaves.length
      ? `<p class="nota" style="padding:0">O questionário não veio — aplique <b>banco/56</b> para
           ver a pergunta de cada resposta.</p>
         <table><tbody>${chaves.map(k=>`<tr><td style="width:40%"><span class="sub" style="margin:0">${esc(k)}</span></td>
           <td>${esc(Array.isArray(r[k]) ? r[k].join(', ') : String(r[k]))}</td></tr>`).join('')}</tbody></table>`
      : '<div class="vazio">Ficha ainda sem respostas.</div>';
  }
  alvo.style.display = 'block';
  alvo.innerHTML = html;
};

window.verMinuta = async (id) => {
  const alvo = document.getElementById('minuta-corpo');
  if (!alvo) return;
  const { data, error } = await sb.from('minuta').select('corpo,tipo').eq('id', id).maybeSingle();
  if (error) return alert('Não deu certo: ' + error.message);
  alvo.style.display = 'block';
  alvo.innerHTML = `<div class="sub" style="margin:0 0 6px">${esc(data?.tipo || 'peça')}</div>
    <div style="white-space:pre-wrap;font-size:13.4px;line-height:1.6;max-height:60vh;overflow:auto;
      background:var(--s0);border:1px solid var(--ln);border-radius:9px;padding:12px">${esc(data?.corpo || '(vazia)')}</div>`;
};

window.encerrarCaso = async (ev, id) => {
  ev.preventDefault();
  const st = document.getElementById('enc-st');
  const resultado = ev.target.elements['resultado'].value.trim();
  if (!confirm('Encerrar o caso? Ele sai dos abertos, aqui e no sistema do escritório.')) return;
  const { error } = await sb.from('caso').update({ encerrado_em: hoje(), resultado,
    atualizado_em: new Date().toISOString() }).eq('id', id);
  if (error) { st.style.color = 'var(--crit)'; st.textContent = error.message; return; }
  telaCaso(id);
};

window.novoRecado = async (ev, casoId) => {
  ev.preventDefault();
  const st = document.getElementById('rec-st');
  const t = ev.target.elements['texto'];
  const texto = t.value.trim(); if (!texto) return;
  const { error } = await sb.from('parceria_recado').insert({
    parceria_id: PAR.id, caso_id: casoId || null,
    autor_nome: PAR.eu?.nome || USER.email, texto,
  });
  if (error) { st.style.color = 'var(--crit)'; st.textContent = error.message; return; }
  t.value = '';
  casoId ? telaCaso(casoId) : telaRecados();

  if (cl.error) return erro(cl.error.message);
  const clientes = cl.data || [], casos = cs.data || [];
  app.innerHTML = menu('clientes') + `<main>
  <h1>Clientes</h1>

    corrigir aqui corrige lá.</p>
  <div class="card">

      onclick="document.getElementById('ncl').style.display='block'">Cadastrar cliente</button></div>
  </div>

/* O calendário do mês. Mostra compromisso e prazo juntos, porque é assim que o mês
   pesa de verdade: um prazo fatal numa terça conta tanto quanto uma audiência. */
function calendario(mes, eventos, prazos){
  const [ano, m] = mes.split('-').map(Number);
  const primeiro = new Date(Date.UTC(ano, m-1, 1));
  const diasNoMes = new Date(Date.UTC(ano, m, 0)).getUTCDate();
  const comecaEm = primeiro.getUTCDay();                 // 0 = domingo
  const antes = new Date(Date.UTC(ano, m-1, 0)).getUTCDate();
  const celulas = [];
  for (let i = comecaEm - 1; i >= 0; i--) celulas.push({ n: antes - i, fora: true });
  for (let d = 1; d <= diasNoMes; d++) celulas.push({ n: d, dia: `${mes}-${String(d).padStart(2,'0')}` });
  while (celulas.length % 7) celulas.push({ n: celulas.length - diasNoMes - comecaEm + 1, fora: true });

  const anterior = m === 1 ? `${ano-1}-12` : `${ano}-${String(m-1).padStart(2,'0')}`;
  const seguinte = m === 12 ? `${ano+1}-01` : `${ano}-${String(m+1).padStart(2,'0')}`;
  const nomeMes = primeiro.toLocaleDateString('pt-BR', { month:'long', year:'numeric', timeZone:'UTC' });

  return `<div class="calcab">
      <a class="btn" href="#/agenda?m=${anterior}">←</a>
      <b style="font-size:14.5px;text-transform:capitalize">${esc(nomeMes)}</b>
      <a class="btn" href="#/agenda?m=${seguinte}">→</a>
      <a class="btn" href="#/agenda">hoje</a>
    </div>
    <div class="cal">
      ${['dom','seg','ter','qua','qui','sex','sáb'].map(d=>`<div class="ds">${d}</div>`).join('')}
      ${celulas.map(c => {
        if (c.fora) return `<div class="dia fora"><span class="n">${c.n}</span></div>`;
        const doDia = eventos.filter(e => String(e.inicio).slice(0,10) === c.dia);
        const pzDia = prazos.filter(z => String(z.data_fatal).slice(0,10) === c.dia);
        const passou = c.dia < hoje();
        return `<div class="dia ${c.dia === hoje() ? 'hoje' : ''}"><span class="n">${c.n}</span>
          ${doDia.map(e => `<a class="${passou?'pas':''}" href="#/agenda?m=${mes}"
             title="${esc(e.titulo)}">${String(e.inicio).slice(11,16)} ${esc(e.titulo)}</a>`).join('')}
          ${pzDia.map(z => `<a class="${passou?'pas':''}" href="#/casos"
             title="prazo: ${esc(z.descricao||'')}">⏳ ${esc(z.descricao||'prazo')}</a>`).join('')}
        </div>`;
      }).join('')}
    </div>`;
}

window.novoLancamento = async (ev) => {
  ev.preventDefault();
  const f = ev.target, st = document.getElementById('fin-st');
  const v = n => (f.elements[n]?.value || '').trim() || null;
  const valor = numOuNulo(v('valor'));
  if (valor == null) { st.style.color = 'var(--crit)'; st.textContent = 'valor inválido'; return; }
  const pct = numOuNulo(v('percentual_parceiro'));
  const { error } = await sb.from('lancamento').insert({
    parceria_id: PAR.id, tipo: v('tipo') || 'entrada', descricao: v('descricao'),
    caso_id: v('caso_id'), valor, vencimento: v('vencimento'), situacao: 'previsto',
    parceiro_id: PAR.parceiro_id || null,
    percentual_parceiro: (pct != null && pct > 0 && pct < 100) ? pct : null,
  });
  if (error) { st.style.color = 'var(--crit)'; st.textContent = error.message; return; }
  telaFinanceiro();
};

window.baixarLancamento = async (id) => {
  if (!confirm('Dar baixa neste lançamento? Ele passa a constar como pago, aqui e no escritório.')) return;
  const { error } = await sb.from('lancamento').update({ situacao: 'pago', pagamento: hoje() }).eq('id', id);
  if (error) return alert('Não deu certo: ' + error.message);
  telaFinanceiro();
};

/* Chamar uma função do servidor com o login de quem está na tela — é o login que
   diz quem pede, e a função confere se a consulta é desta parceria. */
async function chamarFuncao(nome, corpo){
  const { data: ses } = await sb.auth.getSession();
  const r = await fetch(SB_URL + '/functions/v1/' + nome, {
    method: 'POST',
    headers: { 'content-type': 'application/json', apikey: SB_KEY,
               authorization: 'Bearer ' + (ses?.session?.access_token || SB_KEY) },
    body: JSON.stringify(corpo || {}),
  });
  let j = {}; try { j = await r.json(); } catch {}
  if (!r.ok || j.erro) throw new Error(j.erro || ('a função respondeu ' + r.status));
  return j;
}

/* ==================================================== a biblioteca de trabalhista
   Playbook e Ementas são a primeira coisa nesta porta que NÃO se filtra por
   `parceria_id` — e não por descuido: tese e precedente não penduram em caso nenhum,
   são material de consulta. O que delimita é a matéria: só direito do trabalho
   (reclamante, reclamada e acidente), decisão do Breno em 09/11/2026.

   Os três campos que guardam de onde o verbete veio — `tese.origem`,
   `precedente.origem` e `precedente.citacao` — nomeiam cliente de caso que não é da
   parceria. Por isso a tela não lê as tabelas: lê três VISÕES que simplesmente não
   trazem essas colunas (banco/61). A regra está no servidor; esconder na tela não
   seria esconder.

   É só leitura. Ensinar peça ao banco, fila de aprovação e carteira de revisão são do
   escritório: o acervo é dele, e quem decide o que entra nele é ele. */

let PBK = [], PBTESES = [], EMENTAS = [];
let FILTRO_PB = '', FILTRO_EM = '';

/* Busca sem acento e sem caixa: quem procura "ferias" tem de achar "férias". */
const semAcento = t => String(t||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();
const casa = (termo, ...campos) => {
  const q = semAcento(termo).trim();
  if (!q) return true;
  const alvo = semAcento(campos.filter(Boolean).join(' '));
  return q.split(/\s+/).every(t => alvo.includes(t));
};

window.copiarDe = async (idOrigem, el) => {
  const src = document.getElementById(idOrigem);
  if (!src) { el.textContent = 'não achei o texto'; return; }
  const rotulo = el.dataset.rot || el.textContent;
  el.dataset.rot = rotulo;
  let ok = false;
  try { await navigator.clipboard.writeText(src.innerText); ok = true; } catch (e) { ok = false; }
  if (!ok) {
    /* Sem permissão de área de transferência (acontece em alguns navegadores): cai no
       caminho antigo, que ainda funciona. */
    const ta = document.createElement('textarea');
    ta.value = src.innerText; ta.style.position = 'fixed'; ta.style.top = '-1000px';
    document.body.appendChild(ta); ta.select();
    try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
    ta.remove();
  }
  el.textContent = ok ? 'copiado' : 'não deu — selecione e copie';
  setTimeout(() => { el.textContent = rotulo; }, 1800);
};

/* A biblioteca depende do banco/61. Enquanto ele não rodar, a visão não existe e o
   Postgres responde 42P01 — dizer isso é melhor do que "erro ao carregar". */
function erroBiblioteca(visao, msg){
  const faltando = /does not exist|42P01|schema cache/i.test(msg);
  app.innerHTML = menu('') + `<main><div class="card"><h2>A biblioteca ainda não foi aberta</h2>
    <p class="nota">${faltando
      ? `A visão <code>${esc(visao)}</code> não existe no banco. Ela é criada pelo
         <b>banco/61_parceria_biblioteca.sql</b>, que precisa ser rodado no SQL Editor do
         Supabase. Peça ao Dr. Breno.`
      : 'O banco respondeu: ' + esc(msg)}</p></div></main>` + rodape();
}

/* ------------------------------------------ ficha de atendimento (preencher)
   Até aqui a parceria só VIA ficha, e anexava o papel. Mas a ficha é o coração da
   triagem: é ela que vira os fatos do caso e a lista de documentos, e é ela que a
   minuta lê depois. Quem atende tem de poder preenchê-la, senão o atendimento da
   parceira chega ao caso pela metade.

   É a mesma `ficha` e o mesmo `ficha_modelo` do escritório — a mesma linha, vista
   pela outra porta. Duas coisas ficaram de fora, e de propósito:

   - **plantar modelo.** O escritório semeia `ficha_modelo` na primeira abertura; o
     banco/56 abriu só a LEITURA para a parceria, e está certo: o questionário é
     decisão do escritório, não de quem é de fora. Sem modelo ativo, a tela diz isso
     em vez de inventar um.
   - **imprimir para assinar.** O papel sai com o timbre do escritório, e o timbre
     mora na tabela `escritorio`, que a parceira não lê. Como é a MESMA ficha, o
     Breno imprime do lado dele — não há nada a duplicar aqui. */
let FICHA = null, FICHAMOD = [];

async function modelosDeFicha(){
  if (FICHAMOD.length) return FICHAMOD;
  const { data } = await sb.from('ficha_modelo').select('*').eq('ativo', true).order('ordem');
  FICHAMOD = data || [];
  return FICHAMOD;
}

/* Devolve o id da ficha do lead, criando-a se ainda não existir — e é a mesma função
   que o anexo do papel usa, para não nascerem duas fichas do mesmo atendimento. */
async function garantirFicha(leadId){
  const ja = (await sb.from('ficha').select('id').eq('lead_id', leadId).limit(1).maybeSingle()).data;
  if (ja) return ja.id;
  const mods = await modelosDeFicha();
  if (!mods.length) {
    alert('Nenhum modelo de ficha disponível.\n\nO questionário é cadastrado pelo escritório; '
        + 'peça ao Dr. Breno para abrir a Captação lá uma vez, que os modelos nascem sozinhos.');
    return null;
  }
  let m = mods[0];
  if (mods.length > 1) {
    const nomes = mods.map((x,i) => `${i+1}) ${x.nome}`).join('\n');
    const esc1 = Number(prompt('Qual ficha?\n\n' + nomes + '\n\nDigite o número:', '1'));
    m = mods[esc1 - 1];
    if (!m) return null;
  }
  const l = (await sb.from('lead').select('nome,telefone,email,caso_id').eq('id', leadId).maybeSingle()).data;
  const resp = {};
  if (l?.nome)     resp.nome  = l.nome;
  if (l?.telefone) resp.fone  = l.telefone;
  if (l?.email)    resp.email = l.email;
  /* escritorio_id não vai daqui: o gatilho o deduz do caso ou, não havendo, do lead. */
  const { data, error } = await sb.from('ficha').insert({
    modelo_id: m.id, lead_id: leadId, caso_id: l?.caso_id || null, respostas: resp,
  }).select('id').maybeSingle();
  if (error) { alert('Não deu para criar a ficha: ' + error.message); return null; }
  return data.id;
}

window.abrirFicha = async (leadId) => {
  const id = await garantirFicha(leadId);
  if (id) location.hash = '#/ficha/' + id;
};

const pctF = (a,b) => b > 0 ? Math.min(100, Math.round(a/b*100)) : 0;
const moduloA = (est, r) => {
  for (const sec of est) for (const c of sec.c)
    if (c.g === 'A' && Array.isArray(r[c.k]) && r[c.k].length) return true;
  return false;
};

const campoFicha = (c, v) => {
  const id = 'fc-' + c.k, val = v == null ? '' : v;
  const rot = `<div style="font-size:12.6px;color:var(--i2);margin-bottom:3px">${esc(c.r)}${
    c.d ? `<span class="sub" style="display:block;margin:1px 0 0">${esc(c.d)}</span>` : ''}</div>`;
  if (c.t === 'info')  return `<div class="sub" style="margin:0;padding:8px 11px;border-left:2px solid var(--ser);background:var(--s0);border-radius:0 5px 5px 0;font-size:12.4px;line-height:1.5">${esc(c.r)}</div>`;
  if (c.t === 'long')  return rot + `<textarea id="${id}" rows="3" style="width:100%">${esc(val)}</textarea>`;
  if (c.t === 'sn')    return rot + `<div style="display:flex;gap:14px;flex-wrap:wrap">${
    ['sim','não','não sei'].map(o => `<label style="display:flex;gap:5px;align-items:center;font-size:13px">
      <input type="radio" name="${id}" value="${o}" ${val===o?'checked':''}> ${o}</label>`).join('')}</div>`;
  if (c.t === 'esc')   return rot + `<select id="${id}"><option value=""></option>${
    (c.op||[]).map(o => `<option ${val===o?'selected':''}>${esc(o)}</option>`).join('')}</select>`;
  if (c.t === 'multi') { const m = Array.isArray(val) ? val : [];
    return rot + `<div style="display:flex;gap:6px 16px;flex-wrap:wrap">${
      (c.op||[]).map(o => `<label style="display:flex;gap:5px;align-items:center;font-size:13px">
        <input type="checkbox" name="${id}" value="${esc(o)}" ${m.includes(o)?'checked':''}> ${esc(o)}</label>`).join('')}</div>`; }
  const tipo = c.t==='data' ? 'date' : c.t==='hora' ? 'time' : c.t==='num' ? 'number' : 'text';
  return rot + `<input id="${id}" type="${tipo}" value="${esc(val)}" style="width:100%">`;
};

function lerFicha(){
  const est = FICHA.modelo?.estrutura || [], r = {};
  for (const sec of est) for (const c of sec.c) {
    if (c.t === 'info') continue;
    const id = 'fc-' + c.k;
    if (c.t === 'sn') { const m = document.querySelector(`input[name="${id}"]:checked`); if (m) r[c.k] = m.value; }
    else if (c.t === 'multi') {
      const m = [...document.querySelectorAll(`input[name="${id}"]:checked`)].map(x => x.value);
      if (m.length) r[c.k] = m;
    } else { const el = document.getElementById(id); if (el && el.value !== '') r[c.k] = el.value; }
  }
  return r;
}

window.salvarFicha = async (silencioso) => {
  const st = document.getElementById('fi-st');
  /* Trava: o que se guarda é LIDO do formulário. Chamado fora da tela da ficha — por
     uma autoguarda que disparou depois de trocar de tela, ou por um botão chamado de
     outro lugar —, `lerFicha()` devolve vazio e isto apagaria as respostas. Achado
     testando: o "levar para os fatos" chamado da Captação zerou a ficha. */
  if (!st || !FICHA) return;
  const respostas = lerFicha();
  if (st && !silencioso) st.textContent = 'guardando…';
  const { error } = await sb.from('ficha')
    .update({ respostas, atualizado_em: new Date().toISOString() }).eq('id', FICHA.id);
  if (st) { st.style.color = error ? 'var(--crit)' : 'var(--i3)';
            st.textContent = error ? error.message : 'guardado ' + new Date().toTimeString().slice(0,5); }
  FICHA.respostas = respostas;
};

window.concluirFicha = async () => {
  await salvarFicha(true);
  const nova = FICHA.situacao === 'concluida' ? 'rascunho' : 'concluida';
  const { error } = await sb.from('ficha')
    .update({ situacao: nova, assinada_em: nova === 'concluida' ? hoje() : null }).eq('id', FICHA.id);
  if (error) return alert('Não deu certo: ' + error.message);
  telaFicha(FICHA.id);
};

/* Cada resposta longa vira um fato do caso — é isso que a minuta lê depois. */
window.fichaVirarFatos = async () => {
  await salvarFicha(true);
  if (!FICHA.caso_id) return alert('Esta ficha ainda não está ligada a um caso. '
    + 'Use "Virar caso" na Captação primeiro — o caso nasce ali.');
  const est = FICHA.modelo?.estrutura || [], r = FICHA.respostas || {};
  const jaTem = new Set(((await sb.from('fato').select('descricao').eq('caso_id', FICHA.caso_id)).data||[]).map(x => x.descricao));
  const temA = moduloA(est, r);
  const novos = [];
  for (const sec of est) {
    if (sec.i) continue;
    if (sec.m === 'A' && !temA) continue;
    for (const c of sec.c) {
      if (c.t === 'info') continue;
      const v = r[c.k];
      if (v == null || v === '' || (Array.isArray(v) && !v.length)) continue;
      if (c.t !== 'long' && String(v).length < 12) continue;   // dado curto não é fato
      const d = `${c.r} — ${Array.isArray(v) ? v.join('; ') : v}`;
      if (!jaTem.has(d)) novos.push(d);
    }
  }
  if (!novos.length) return alert('Nada novo para levar: ou a ficha está vazia, ou os fatos já estão no caso.');
  const base = ((await sb.from('fato').select('id').eq('caso_id', FICHA.caso_id)).data||[]).length;
  const { error } = await sb.from('fato').insert(novos.map((d,i) => ({
    caso_id: FICHA.caso_id, descricao: d, ordem: base + i, origem: 'ficha de atendimento' })));
  alert(error ? 'Erro: ' + error.message
    : `${novos.length} fato(s) levados para o caso. Abra o caso e confira antes de gerar a peça.`);
};

/* O checklist do fim da ficha vira pendência no caso, com o que NÃO foi marcado. */
window.fichaCobrarDocs = async () => {
  await salvarFicha(true);
  if (!FICHA.caso_id) return alert('Ligue a ficha a um caso antes — o pedido de documento mora no caso.');
  const est = FICHA.modelo?.estrutura || [], r = FICHA.respostas || {};
  let campo = null;
  for (const sec of est) for (const c of sec.c) if (c.t === 'multi' && /document/i.test(c.r)) campo = c;
  if (!campo) return alert('Este modelo não tem checklist de documentos.');
  const trouxe = new Set(Array.isArray(r[campo.k]) ? r[campo.k] : []);
  const faltam = (campo.op||[]).filter(o => !trouxe.has(o));
  if (!faltam.length) return alert('O cliente trouxe tudo o que a ficha pede.');
  const jaTem = new Set(((await sb.from('caso_documento').select('descricao').eq('caso_id', FICHA.caso_id)).data||[]).map(x => x.descricao));
  const novos = faltam.filter(d => !jaTem.has(d));
  if (!novos.length) return alert('Esses documentos já estão na lista do caso.');
  const base = ((await sb.from('caso_documento').select('id').eq('caso_id', FICHA.caso_id)).data||[]).length;
  const { error } = await sb.from('caso_documento').insert(novos.map((d,i) => ({
    caso_id: FICHA.caso_id, descricao: d, ordem: base + i, obs: 'pedido na ficha de atendimento' })));
  alert(error ? 'Erro: ' + error.message : `${novos.length} documento(s) entraram na lista do caso.`);
};

window.anexarFichaPapel = async (fichaId, el) => {
  const arq = el.files?.[0]; if (!arq) return;
  const st = document.getElementById('fp-st');
  if (st) { st.style.color = 'var(--i3)'; st.textContent = 'enviando ' + arq.name + '…'; }

  if (r.erro) { if (st) { st.style.color = 'var(--crit)'; st.textContent = 'erro: ' + r.erro; } return; }
  telaFicha(fichaId);
};

window.tirarFichaPapel = async (fichaId, caminho) => {

};

async function telaFicha(id){
  const f = (await sb.from('ficha')
    .select('*, modelo:modelo_id(*), lead:lead_id(nome,telefone), caso:caso_id(id,titulo)')
    .eq('id', id).maybeSingle()).data;
  if (!f) return erro('Ficha não encontrada — ou ela não é desta parceria.');
  FICHA = f;
  const r = f.respostas || {}, est = f.modelo?.estrutura || [];
  const vale = c => c.t !== 'info';
  const total = est.reduce((a,s) => a + s.c.filter(vale).length, 0);
  const feitos = est.reduce((a,s) => a + s.c.filter(c => vale(c) && r[c.k] != null && r[c.k] !== '').length, 0);

  app.innerHTML = menu('captacao') + `<main>
  <h1>Ficha de atendimento</h1>
  <p class="meta">${esc(f.modelo?.nome || '')}${f.lead?.nome ? ' · ' + esc(f.lead.nome) : ''} ·
    aberta em ${br(String(f.criado_em).slice(0,10))}. O que você escreve é guardado sozinho ao
    sair de cada campo. É a mesma ficha que o escritório vê.</p>
  <div class="kpis">
    <div class="kpi"><div class="n">${feitos}/${total}</div><div class="l">respondido</div></div>
    <div class="kpi"><div class="n">${pctF(feitos,total)}%</div><div class="l">da ficha</div></div>
    <div class="kpi"><div class="n">${f.situacao === 'concluida' ? 'concluída' : 'rascunho'}</div><div class="l">situação</div></div>
    <div class="kpi"><div class="n">${f.caso ? 'sim' : 'não'}</div><div class="l">virou caso</div></div>
  </div>
  ${est.length ? '' : `<div class="card"><p class="nota">Esta ficha não tem questionário ligado —
    ela nasceu só para guardar o papel. As respostas abaixo, se houver, aparecem como vieram.</p></div>`}
  <div class="card"><div style="padding:12px 18px;display:flex;gap:8px;flex-wrap:wrap;align-items:center">
    <button class="btn ok" onclick="salvarFicha()">Guardar agora</button>
    <button class="btn" onclick="fichaVirarFatos()">Levar respostas para os fatos do caso</button>
    <button class="btn" onclick="fichaCobrarDocs()">Cobrar os documentos que faltam</button>
    <button class="btn" onclick="concluirFicha()">${f.situacao === 'concluida' ? 'Reabrir' : 'Concluir'}</button>
    ${f.caso ? `<a class="btn" style="text-decoration:none" href="#/caso/${f.caso.id}">Abrir o caso</a>` : ''}
    <a class="btn" style="text-decoration:none" href="#/captacao">Voltar à Captação</a>
    <span class="sub" id="fi-st" style="margin:0"></span>
  </div>
  <p class="nota" style="padding-top:0">Para imprimir a ficha e colher a assinatura, peça ao
    Dr. Breno: o papel sai com o timbre do escritório, que mora no lado dele. É esta mesma ficha.</p>
  </div>

  <div class="card"><h2>Ficha em papel</h2>
    ${f.arquivo_path ? `
    <div style="padding:10px 18px 16px;display:flex;gap:9px;align-items:center;flex-wrap:wrap">
      <span class="pill good">anexada</span>
      <b>${esc(f.arquivo_nome || 'arquivo')}</b>
      ${f.arquivo_em ? `<span class="sub" style="margin:0">enviada em ${br(String(f.arquivo_em).slice(0,10))}</span>` : ''}
      <button class="btn" onclick="verArquivo('fichas','${esc(f.arquivo_path)}')">Abrir</button>
      <button class="btn" onclick="tirarFichaPapel('${f.id}','${esc(f.arquivo_path)}')">Tirar</button>
    </div>` : `
    <p class="nota">Se a pessoa preencheu e assinou a ficha no papel, anexe aqui o PDF ou a foto —
      fica guardado junto das respostas, e vai com o caso quando o lead fechar. Até 15 MB.</p>
    <div style="padding:0 18px 16px;display:flex;gap:9px;align-items:center;flex-wrap:wrap">
      <input type="file" accept="application/pdf,image/*" onchange="anexarFichaPapel('${f.id}', this)">
      <span class="sub" id="fp-st" style="margin:0"></span>
    </div>`}</div>

  <div id="fi-avisoA" class="card" style="border-left:3px solid var(--warn);display:none">
    <div style="padding:12px 18px" class="sub">
      O <b>módulo A</b> — acidente de trabalho e doença ocupacional — está escondido. Ele aparece
      sozinho assim que você marcar algum item da linha <i>&ldquo;Acidente e saúde&rdquo;</i>, no
      primeiro bloco.
    </div></div>
  ${est.map(sec => `<div class="card"${sec.m ? ` data-mod="${sec.m}"` : ''}${
      sec.i ? ' style="border-left:3px solid var(--warn)"' : sec.m ? ' style="border-left:3px solid var(--crit)"' : ''}>
    <h2>${esc(sec.s)}</h2>
    ${sec.d ? `<p class="sub" style="margin:-4px 18px 0">${esc(sec.d)}</p>` : ''}
    <div style="padding:6px 18px 16px;display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px 16px">
      ${sec.c.map(c => `<div${['long','multi','info'].includes(c.t) ? ' style="grid-column:1/-1"' : ''}>${campoFicha(c, r[c.k])}</div>`).join('')}
    </div></div>`).join('')}
  </main>` + rodape();

  app.querySelectorAll('input,textarea,select').forEach(el =>
    el.addEventListener('change', () => salvarFicha(true)));
  /* O módulo A só existe quando o atendimento é de acidente ou doença. Fica escondido
     até alguém marcar a linha que o dispara, e some se desmarcarem. */
  const gatilho = [];
  for (const sec of est) for (const c of sec.c) if (c.g === 'A') gatilho.push('fc-' + c.k);
  const olharA = () => {
    const liga = gatilho.some(id => [...document.querySelectorAll(`input[name="${id}"]:checked`)].length > 0);
    app.querySelectorAll('[data-mod="A"]').forEach(el => el.style.display = liga ? '' : 'none');
    const av = document.getElementById('fi-avisoA');
    if (av) av.style.display = gatilho.length ? (liga ? 'none' : '') : 'none';
  };
  gatilho.forEach(id => document.querySelectorAll(`input[name="${id}"]`)
    .forEach(el => el.addEventListener('change', olharA)));
  olharA();
}

/* ------------------------------------------------ pedido de documentos
   Depois da consulta vem a parte que trava mais caso: a pessoa some porque não sabe
   o que mandar. O painel monta a lista, deixa editar e abre o WhatsApp com o texto
   pronto — a mesma lista do escritório, para o cliente receber o mesmo pedido venha
   ele por qual porta vier.

   Uma diferença que é de propósito, e não falta: no escritório o pedido pode sair
   pela assistente do WhatsApp, no número do escritório. Aqui não sai — a função
   `whatsapp-bot` só atende quem tem linha em `usuario`, e falar pelo número do
   escritório não é coisa que se dê a quem é de fora sem o Breno decidir. Então o
   texto abre no WhatsApp de quem está pedindo, que é quem assina o pedido. */
const DOCS = {
  comuns: ['RG e CPF', 'Comprovante de residência', 'Contracheques dos últimos três meses',
           'Ficha funcional (ou histórico funcional)'],
  procedimento: ['Portaria de instauração', 'Citação ou termo de indiciação',
                 'Relatório final da comissão', 'Decisão ou publicação da penalidade',
                 'Defesa já apresentada, se houver'],
  direito: ['Requerimento protocolado, com o número do protocolo',
            'Despacho ou ofício que negou o pedido',
            'Publicação no diário oficial, se houve',
            'Laudo da perícia, quando o caso envolver saúde'],
};
const ASSUNTO_PROCEDIMENTO_DOCS = ['PAD ou sindicância', 'Acúmulo de cargos', 'Reintegração ao cargo'];
let DOCSASSUNTO = {};   // lead_id -> assunto da ficha, buscado só quando o painel abre

window.abrirDocs = async (id) => {
  const cx = document.getElementById('dc' + id); if (!cx) return;
  if (cx.style.display === 'block') { cx.style.display = 'none'; return; }
  cx.style.display = 'block';
  cx.innerHTML = '<div class="sub" style="margin:0">carregando…</div>';

  /* O assunto fica na ficha da triagem e decide o que vem marcado. Buscado só agora:
     carregar a ficha de todos os leads encheria a tela à toa. */
  if (DOCSASSUNTO[id] === undefined) {
    const { data } = await sb.from('ficha').select('respostas').eq('lead_id', id)
      .order('criado_em', { ascending: false }).limit(1).maybeSingle();
    DOCSASSUNTO[id] = data?.respostas?.assunto ?? null;
  }
  const assunto = DOCSASSUNTO[id];
  /* Sem assunto na ficha, marca só os comuns: pedir documento que não serve cansa a
     pessoa e atrasa o que importa. */
  const grupo = assunto == null ? null
    : (ASSUNTO_PROCEDIMENTO_DOCS.includes(assunto) ? 'procedimento' : 'direito');

  const linha = (txt, marcado) => `<label style="display:flex;gap:6px;align-items:flex-start;margin-bottom:4px">
    <input type="checkbox" class="dc-item-${id}" value="${esc(txt)}" ${marcado ? 'checked' : ''}>
    <span class="sub" style="margin:0">${esc(txt)}</span></label>`;

  cx.innerHTML = `
    <div class="sub" style="margin:0 0 6px">${assunto
      ? 'Assunto na ficha: <b>' + esc(assunto) + '</b>. Marquei o que costuma valer para esse caso.'
      : 'A ficha não diz o assunto, então marquei só os documentos comuns.'}</div>
    ${DOCS.comuns.map(t => linha(t, true)).join('')}
    ${DOCS.procedimento.map(t => linha(t, grupo === 'procedimento')).join('')}
    ${DOCS.direito.map(t => linha(t, grupo === 'direito')).join('')}
    <input type="text" id="dc-extra-${id}" placeholder="outro documento (separe por vírgula)"
           style="font-size:11.4px;width:100%;margin-top:4px">
    <div class="sub" style="margin:6px 0 0">O texto abre no seu WhatsApp, para você enviar.</div>
    <div style="margin-top:6px;display:flex;gap:6px;align-items:center">
      <button class="btn ok" style="font-size:11.4px;padding:4px 8px"
        onclick="enviarDocs('${id}')">Abrir no WhatsApp</button>
      <span class="sub" id="dc-st-${id}" style="margin:0"></span></div>`;
};

/* Monta o texto a partir do que ficou marcado. Quem pede documento depois da consulta
   é o advogado, e é o nome dele que a mensagem usa. */
function textoDocs(id, itens){
  const l = LEADS.find(x => x.id === id);
  const primeiro = nomeProprio((l?.nome || '').split(' ')[0]);
  const eu = PAR.eu?.nome ? nomeProprio(PAR.eu.nome) : null;
  return `Olá, ${primeiro}. ` + (eu ? `Aqui é ${eu}, advocacia.` : 'Aqui é da advocacia.') + `\n\n` +
    `Para seguir com a análise do seu caso, preciso destes documentos:\n\n` +
    itens.map(t => '- ' + t).join('\n') +
    `\n\nPode mandar por aqui mesmo, em foto ou PDF. Se faltar algum, envie o que tiver que a gente completa depois.`;
}

window.enviarDocs = async (id) => {
  const st = document.getElementById('dc-st-' + id);
  const marcados = [...document.querySelectorAll('.dc-item-' + id)].filter(c => c.checked).map(c => c.value);
  const extra = (document.getElementById('dc-extra-' + id)?.value || '')
    .split(',').map(t => t.trim()).filter(Boolean);
  const itens = [...marcados, ...extra];
  if (!itens.length) { if (st) { st.style.color = 'var(--crit)';
    st.textContent = ' marque ao menos um documento'; } return; }
  const l = LEADS.find(x => x.id === id);
  if (!l?.telefone) { if (st) { st.style.color = 'var(--crit)';
    st.textContent = ' este lead não tem telefone'; } return; }
  window.open(linkWa(l.telefone, textoDocs(id, itens)), '_blank', 'noreferrer');

  /* O pedido foi feito: o lead avança e o retorno passa a ser daqui a três dias —
     é o prazo em que se cobra sem parecer pressa. */
  const volta = new Date(Date.now() + 3*864e5).toISOString().slice(0,10);
  await sb.from('lead').update({ etapa: 'documentos', proximo_contato: volta,
    atualizado_em: new Date().toISOString() }).eq('id', id);
  telaCaptacao();
};

/* ------------------------------------------------------ viabilidade
   A mesma régua do escritório, com os mesmos pesos: a nota não é opinião, é a soma
   do que se verificou. Vale para a parceria porque é aqui que se decide se o caso
   entra — e a nota tem de significar o mesmo dos dois lados, senão o mesmo lead
   apareceria bom numa porta e ruim na outra. */
const VIAB = [
  ['prazo',  'Dentro do prazo (prescrição e decadência)', 3],
  ['prova',  'Tem prova documental do essencial',         3],
  ['test',   'Tem testemunha',                            1],
  ['solv',   'A parte contrária tem como pagar',          2],
  ['claro',  'O relato é coerente e sem contradição',     1],
];
const notaViab = v => VIAB.reduce((a,[k,,peso]) => a + (v?.[k] ? peso : 0), 0);
const corNota = n => n >= 8 ? 'good' : (n >= 5 ? 'ser' : 'crit');

window.abrirViab = (id) => {
  const el = document.getElementById('vb'+id); if (!el) return;
  el.style.display = el.style.display === 'none' ? 'block' : 'none';
};

window.salvarViab = async (id) => {
  const l = LEADS.find(x => x.id === id); if (!l) return;
  const v = {};
  VIAB.forEach(([k]) => { v[k] = !!document.getElementById('vb-'+k+'-'+id)?.checked; });
  const valor = document.getElementById('vb-valor-'+id)?.value;
  if (valor) v.valor = numOuNulo(valor);
  const obs = document.getElementById('vb-obs-'+id)?.value?.trim();
  if (obs) v.obs = obs;
  const n = notaViab(v);
  const st = document.getElementById('vb-st-'+id);
  if (st) { st.style.color = 'var(--i3)'; st.textContent = 'guardando…'; }
  const { error } = await sb.from('lead').update({ viabilidade: v, nota: n }).eq('id', id);
  if (error) { if (st) { st.style.color = 'var(--crit)'; st.textContent = 'erro: ' + error.message; } return; }
  l.viabilidade = v; l.nota = n;
  if (st) { st.style.color = 'var(--good)'; st.textContent = 'nota ' + n + ' de 10'; }
};

/* --------------------------------------------------- consulta marcada
   Igual ao escritório: "consulta marcada" sem dia e hora não chega à agenda, e o
   que não está na agenda é o que se esquece. Aqui a consulta vira compromisso de
   verdade, ligado ao lead e carimbado como da parceria — a mesma linha que o
   escritório vê do outro lado.

   O endereço do escritório não é preenchido sozinho, como lá: a parceira não lê a
   tabela escritorio (banco/44_parceria.sql), e faz sentido — a consulta em parceria
   pode ser no escritório de qualquer um dos dois. Quem marca escreve onde é. */
const rotConsulta = e => br(String(e.inicio).slice(0,10)) + ' às ' + String(e.inicio).slice(11,16);
const FORMATOS = [['presencial','Presencial'],['video','Videochamada (Meet)'],['telefone','Ligação']];
const ROT_FORMATO = { presencial:'presencial', video:'por vídeo', telefone:'por ligação' };

window.trocarFormato = (id) => {
  const f = document.getElementById('cs-formato-'+id)?.value || 'presencial';
  const l = LEADS.find(x => x.id === id) || {};
  const loc = document.getElementById('cs-local-'+id);
  const aviso = document.getElementById('cs-meet-'+id);
  if (loc) {
    loc.style.display = f === 'video' ? 'none' : '';
    /* Só mexe no que a tela mesma escreveu: o que a pessoa digitou fica. */
    if (!loc.value || loc.dataset.auto === '1') {
      loc.value = f === 'telefone' ? 'Ligação para ' + (l.telefone || 'a pessoa') : '';
      loc.dataset.auto = '1';
    }
    loc.placeholder = f === 'telefone' ? 'número para a ligação' : 'onde (escritório, endereço)';
  }
  if (aviso) aviso.style.display = f === 'video' ? '' : 'none';
};

window.abrirConsulta = (id) => {
  const el = document.getElementById('cs'+id); if (!el) return;
  el.style.display = el.style.display === 'none' ? 'block' : 'none';
  if (el.style.display === 'block') trocarFormato(id);
};

window.agendarConsulta = async (id) => {
  const l = LEADS.find(x => x.id === id); if (!l) return;
  const g = k => (document.getElementById('cs-'+k+'-'+id)?.value || '').trim();
  const st = document.getElementById('cs-st-'+id);
  const data = g('data');
  if (!data) { st.style.color = 'var(--crit)'; return st.textContent = 'escolha o dia'; }
  const hora = g('hora') || '09:00';
  st.style.color = 'var(--i3)'; st.textContent = 'marcando…';

  const formato = g('formato') || 'presencial';
  const antiga = LEADEV[id];
  /* escritorio_id não vai daqui: o gatilho do banco o deduz da parceria. */
  const campos = {
    parceria_id: PAR.id, lead_id: id, tipo: 'reuniao', origem: 'parceria',
    titulo: 'Consulta — ' + l.nome,
    descricao: ['Consulta de captação em parceria' +
                 (ROT_FORMATO[formato] ? ', ' + ROT_FORMATO[formato] : '') + '.',
                l.resumo, g('obs')].filter(Boolean).join(' '),
    inicio: data + 'T' + hora + ':00+00:00', formato,
    /* por vídeo, o lugar é a sala; a sala que já existia continua valendo na remarcação */
    local: formato === 'video' ? null : (g('local') || null),
    link_sala: formato === 'video' ? (antiga?.link_sala || null) : null,
    urgencia: 'normal',
  };
  let error, evId = antiga?.id;
  if (antiga) ({ error } = await sb.from('evento').update(campos).eq('id', antiga.id));
  else {
    let r; ({ data: r, error } = await sb.from('evento').insert(campos).select('id').single());
    evId = r?.id;
  }
  if (error) { st.style.color = 'var(--crit)'; return st.textContent = 'erro: ' + error.message; }

  /* A etapa acompanha o fato: marcou a consulta, o lead está em "Consulta
     marcada". E o retorno passa a ser o dia dela. */
  await sb.from('lead').update({ etapa: 'consulta', proximo_contato: data,
    atualizado_em: new Date().toISOString() }).eq('id', id);

  /* Por vídeo sem sala: o Google cria o evento já com o Meet, na hora. A sala
     nasce na conta do escritório, a única que existe — e é dela que sai o link. */
  let falhaMeet = null;
  if (formato === 'video' && !campos.link_sala && evId) {
    st.textContent = 'gerando a sala do Meet…';
    try { await chamarFuncao('consulta-meet', { evento_id: evId }); }
    catch (e) { falhaMeet = e.message; }
  }
  await telaCaptacao();
  if (falhaMeet) alert('A consulta foi marcada, mas o Meet não foi gerado: ' + falhaMeet);
};

window.desmarcarConsulta = async (id) => {
  const e = LEADEV[id]; if (!e) return;
  if (!confirm('Desmarcar a consulta de ' + (LEADS.find(x=>x.id===id)?.nome || '') + '? Ela sai da agenda.')) return;
  const { error } = await sb.from('evento').update({ situacao: 'cancelada' }).eq('id', e.id);
  if (error) return alert('Não deu: ' + error.message);
  telaCaptacao();
};

function cartaoLead(l){
  const d = l.proximo_contato ? dias(l.proximo_contato) : null;
  const parado = Math.round((Date.now() - Date.parse(l.atualizado_em || l.criado_em))/864e5);
  return `<div class="cartao">
    <div class="tit">${esc(l.nome)}</div>
    <div class="sub" style="margin:2px 0 6px">${esc(nomeArea(l.area_id) || l.area || 'área não definida')}
      · ${esc([nomeOrigem(l.origem_id), nomeOrigem(l.origem2_id)].filter(Boolean).join(' + ')
        || l.origem || 'origem não informada')} · entrou ${br(l.criado_em)}</div>
    ${PAPEL[l.id] ? `<button class="btn" style="font-size:11.4px;padding:3px 8px;margin-bottom:6px"
      onclick="verArquivo('fichas','${esc(PAPEL[l.id])}')">Ficha em papel</button>` : ''}
    ${l.telefone ? `<div class="sub" style="margin:0 0 6px">${esc(l.telefone)}</div>` : ''}
    ${l.resumo ? `<div class="sub" style="margin-bottom:6px">${esc(String(l.resumo).slice(0,130))}</div>` : ''}
    ${d !== null ? `<span class="pill ${d<0?'crit':(d<=1?'ser':'good')}">contato ${br(l.proximo_contato)}</span>` : ''}
    ${parado > 7 ? `<span class="pill ser">parado há ${parado} dias</span>` : ''}
    ${(() => { /* O WhatsApp às vezes entrega um identificador interno no lugar do número.
         Quem já escreveu antes pelo telefone vira cartão repetido, e sem o carimbo do
         anúncio — então marca-se para conferir, em vez de a tela adivinhar.
         Só o telefone da CONVERSA entra na conta: é o que o bot grava, sempre em dígitos
         e com o código do país. O do lead é campo livre, e marcar isso seria ruído. */
      const t = LEADCONV[l.id]?.telefone || '';
      return t && !/^55\d{10,11}$/.test(t)
        ? `<span class="pill ser" title="O WhatsApp não informou o número (veio ${esc(t)}). Pode ser a mesma pessoa de outro cartão, e a origem pode não ser esta.">origem a conferir</span>`
        : ''; })()}
    ${l.nota != null ? `<span class="pill ${corNota(l.nota)}">viabilidade ${l.nota}/10</span>` : ''}
    ${(() => { const e = LEADEV[l.id]; return e
      ? `<div class="pill serie" title="${esc(e.local || e.link_sala || 'sem local informado')}"
           >consulta ${rotConsulta(e)}${ROT_FORMATO[e.formato] ? ' · ' + ROT_FORMATO[e.formato] : ''}</div>` : ''; })()}
    ${(() => { const e = LEADEV[l.id];
      if (!e?.link_sala || !l.telefone) return '';
      /* Quem manda se apresenta pelo próprio nome. No escritório a mensagem diz "aqui é
         do escritório"; aqui não serve: quem manda pode ser a parceira, e ela não fala
         pelo escritório — fala por si, no caso que é dos dois. */
      const eu = PAR.eu?.nome ? nomeProprio(PAR.eu.nome) : null;
      const txt = `Olá, ${nomeProprio((l.nome||'').split(' ')[0])}! ` +
        (eu ? `Aqui é ${eu}, advocacia. ` : 'Aqui é da advocacia. ') +
        `Nossa conversa está marcada para ${rotConsulta(e)}, por videochamada. É só entrar por este link no horário: ${e.link_sala}`;
      return `<a class="btn" style="font-size:11.4px;padding:4px 8px;text-decoration:none;display:inline-block;margin-top:4px"
        href="${linkWa(l.telefone, txt)}" target="_blank" rel="noreferrer">Mandar o link do Meet</a>`; })()}
    <div style="margin-top:9px;display:flex;gap:5px;flex-wrap:wrap">
      <select onchange="moverLead('${l.id}', this.value)" style="flex:1;min-width:140px;font-size:11.6px">
        ${ETAPAS.map(([k,r])=>`<option value="${k}" ${l.etapa===k?'selected':''}>${r}</option>`).join('')}
        <option value="perdido">Não fechou</option>
      </select>
      <button class="btn" style="font-size:11.4px;padding:4px 8px"
        onclick="abrirViab('${l.id}')">Viabilidade</button>
      <button class="btn" style="font-size:11.4px;padding:4px 8px"
        title="abre a ficha de atendimento para preencher"
        onclick="abrirFicha('${l.id}')">Ficha</button>
      <button class="btn ${LEADEV[l.id] ? '' : 'ok'}" style="font-size:11.4px;padding:4px 8px"
        title="marca dia e hora e joga a consulta na agenda"
        onclick="abrirConsulta('${l.id}')">${LEADEV[l.id] ? 'Remarcar' : 'Marcar consulta'}</button>
      ${LEADEV[l.id] ? `<button class="btn" style="font-size:11.4px;padding:4px 8px"
        onclick="desmarcarConsulta('${l.id}')">Desmarcar</button>` : ''}
      ${['consulta','documentos'].includes(l.etapa) ? `<button class="btn" style="font-size:11.4px;padding:4px 8px"
        title="monta a lista de documentos e abre o WhatsApp com o texto pronto"
        onclick="abrirDocs('${l.id}')">Pedir documentos</button>` : ''}
      ${LEADCONV[l.id] ? `<a class="btn" style="font-size:11.4px;padding:4px 8px;text-decoration:none"
        title="a conversa desta pessoa com a assistente do WhatsApp"
        href="#/conversa/${LEADCONV[l.id].id}">Ler a conversa</a>` : ''}
      <button class="btn" style="font-size:11.4px;padding:4px 8px"
        onclick="leadViraCaso('${l.id}')">Virar caso</button>
    </div>
    <div id="dc${l.id}" style="display:none;margin-top:8px;border-top:1px solid var(--ln);padding-top:8px"></div>
    ${(() => { const e = LEADEV[l.id] || null; const d = e ? String(e.inicio) : '';
      return `<div id="cs${l.id}" style="display:none;margin-top:8px;border-top:1px solid var(--ln);padding-top:8px">
      <div class="sub" style="margin:0 0 5px">A consulta entra na Agenda da parceria como
        compromisso e vai junto para o Google do escritório. Se a pessoa fechar, ela segue
        para o caso.</div>
      <div style="display:flex;gap:5px;flex-wrap:wrap;align-items:center">
        <input type="date" id="cs-data-${l.id}" value="${d.slice(0,10)}" style="font-size:11.4px">
